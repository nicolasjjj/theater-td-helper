    } else if (ptab === "crew") {
      h += `<details class="card prep" ${prepOpen ? "open" : ""}><summary><b>前置與我的時段費</b><span>${c.tdFlat ? "整筆 $" + money(c.tdFlat) : c.prepSeg ? fmtSeg(c.prepSeg) + " 段" : "未填"}</span></summary>
        <label>前置內容（一行一項）<textarea id="prepText" rows="4" placeholder="技協1段&#10;開會1段">${esc(c.prep)}</textarea></label>
        <div class="row2"><label>前置段數<input id="prepSeg" inputmode="decimal" value="${c.prepSeg ?? ""}"></label>
        <label>TD 時段費<input id="tdRate" inputmode="numeric" value="${c.tdRate ?? ""}"></label></div>
        <label>這個案子的 TD<input id="tdName" value="${esc(c.tdName || "")}" placeholder="${DEFAULT_TD}（空白就是你）"></label>
        <label>整筆費用（已談好整個案子的總價才填，會取代時段費計算）<input id="tdFlat" inputmode="numeric" value="${c.tdFlat ?? ""}" placeholder="例如 45000"></label></details>`;
      const names = crewOrder(c, rec, tmap);
      h += `<details class="card rates" ${ratesOpen ? "open" : ""}><summary><b>Crew 時段費</b><span>${names.filter(n => rec.rates[n]).length}/${names.length} 人已填</span></summary>
        <div class="row2"><label>全部套用<input id="rateAll" inputmode="numeric" placeholder="例如 850"></label><button class="ghost" id="rateAllBtn">套用到空白的人</button></div>
        ${names.map(n => { const p = crewByName[n]; const last = lastRate(p); return `<div class="rate"><span>${esc(n)}</span>
          <small>${last ? "上次 " + last : ""}</small><input class="rateIn" data-name="${esc(n)}" inputmode="numeric" value="${rec.rates[n] ?? ""}" placeholder="${c.crewRate || last || ""}"></div>`; }).join("") || `<div class="note">還沒有 Crew</div>`}
        <div class="note">存檔時也會寫進每個人在「劇場のCrew」的「時段費紀錄」。</div></details>`;
    } else if (ptab === "give") {
      const sh = giveSheet(c, rec, tmap), crewP = sh.people;
      if (sh.stops) h += `<div class="note" style="margin:2px 2px 6px">巡演「${esc(c.tour)}」：同一個人跑了好幾站，會合在同一張表裡給他（可在「時段表」取消合併）。</div>`;
      h += `<div class="note" style="margin:2px 2px 10px">點名字會變成全螢幕表格，直接截圖傳給他。</div>`;
      h += crewP.map((p, i) => `<button class="card cm cmShot" data-i="${i}"><div class="cmh"><b>${esc(p.name)}${p.role === "TD" ? "（我）" : ""}</b><span>${fmtSeg(p.total)} 段${p.pay !== null ? "・$" + money(p.pay) : "・<em>未填時段費</em>"}</span><i class="go">看表格 ›</i></div></button>`).join("") || `<div class="state">還沒有 Crew</div>`;
    }
    root.innerHTML = h;
    wire(c, rec, tmap);
    if (ptab === "punch" && scrolledFor !== c.id) {
      scrolledFor = c.id;
      const el = document.querySelector(".day.today, .day.miss, .day.future");
      if (el && el !== document.querySelector(".day")) setTimeout(() => el.scrollIntoView({ block: "center" }), 50);
    }
  }

  function dayCard(d, prev, i, tmap) {
    const seg = tdSeg(d), st = dayState(d);
    const people = attendees(d, tmap);
    const absent = d.people.filter(p => p.absent).map(p => p.name);
    const chips = people.map(n => {
      const x = personDay(d, n), p = d.people.find(q => q.name === n);
      const custom = p && (p.tin || p.tout || p.lunch !== null || p.dinner !== null || p.adj !== null);
      return `<button class="pchip ${custom ? "ex" : ""}" data-i="${i}" data-name="${esc(n)}">${esc(n)}${custom ? `<small>${x.tin || "?"}-${x.tout || "?"}</small>` : ""}</button>`;
    }).join("") + absent.map(n => `<button class="pchip off" data-i="${i}" data-name="${esc(n)}">${esc(n)}<small>缺席</small></button>`).join("");
    const extra = [d.lunch ? `午+${d.lunch}` : "", d.dinner ? `晚+${d.dinner}` : "", lateSeg(d.tin, d.tout) ? `超時+${lateSeg(d.tin, d.tout)}` : "", d.adj !== null ? "手動" : "", ""].filter(Boolean).join("・");
    return `<div class="day ${st}" data-i="${i}">
      <div class="dtop"><div><div class="dd">${dw(d.date)}</div><span class="stg s-${d.stage}">${d.stage}</span><span class="pill">${STATE_PILL[st]}</span></div>
        <div class="big ${seg === null ? "empty" : ""}">${seg === null ? "—" : fmtSeg(seg)}<small>段</small></div></div>
      ${d.off ? `<div class="offnote"><span>當天沒上班</span><button class="offbtn on">取消</button></div>` : d.stage === "裝車" ? `<div class="slotrow">${Object.entries(SLOTS).map(([k, l]) => `<button class="slot ${d.slot === k ? "on" : ""}" data-s="${k}">${l}</button>`).join("")}</div>
      <div class="note" style="margin-top:6px">裝車選一個時段，一律算 1 段</div>
      <details class="more"><summary>沒上班</summary><button class="offbtn">當天沒上班</button></details>` : `<div class="times">
        <label>上班<input class="tin" inputmode="numeric" maxlength="4" value="${d.tin}" placeholder="${prev && prev.tin || "0900"}"></label>
        <label>下班<input class="tout" inputmode="numeric" maxlength="4" value="${d.tout}" placeholder="${prev && prev.tout || "2200"}"></label>
        ${prev && (prev.tin || prev.tout) ? `<button class="mini same">同前一天</button>` : ""}
      </div>
      <div class="qrow"><span>上班</span>${quick(d.tin, IN_OPTS, "qin")}</div>
      <div class="qrow"><span>下班</span>${quick(d.tout, OUT_OPTS, "qout")}</div>
      <details class="more"><summary>誤餐 / 超時 / 沒上班${extra ? `<span>${esc(extra)}</span>` : ""}</summary>
        ${mealSeg("午", d.lunch, "ml", false)}${mealSeg("晚", d.dinner, "md", false)}
        <div class="row2"><label>時段數調整<input class="adj" inputmode="decimal" value="${d.adj ?? ""}" placeholder="手動填入"></label></div>
        <button class="offbtn">當天沒上班</button>
        </details>`}
      <div class="crew"><div class="clabel">特殊上下班時間（點名字設定例外）</div>${chips || `<span class="note">還沒有人</span>`}
        <button class="pchip add" data-i="${i}">＋其他人</button></div>
      <div class="dfoot"><button class="clearDay ${clearArm === i ? "armed" : ""}">${clearArm === i ? "再按一次確認清除" : "清除這天"}</button></div></div>`;
  }

  function wire(c, rec, tmap) {
    document.querySelectorAll(".ptabs button").forEach(b => b.onclick = () => { ptab = b.dataset.t; clearArm = null; render(); window.scrollTo(0, 0); });
    if (ptab === "sheet") {
      const stops = tourStops(c), merge = c.tour && stops.length > 1 && tourMerge[c.tour] !== false;
      $("tsMake").onclick = () => makeGoogleSheet(c, merge ? buildTourSheet(c) : buildSheet(c, rec, tmap));
      if ($("tourMerge")) $("tourMerge").onchange = (e) => { tourMerge[c.tour] = e.target.checked; render(); };
      if ($("tsFolderReset")) $("tsFolderReset").onclick = () => { c.tsFolder = ""; updateProps(c.id, { "時段表資料夾": null }); render(); };
      return;
    }
    if (ptab === "shot") { $("shotCrew").onclick = () => showShot(crewShotHtml(c, rec, tmap), true); $("shotTax").onclick = () => showShot(taxShotHtml(c)); return; }
    if (ptab === "give") {
      const sh = giveSheet(c, rec, tmap), crewP = sh.people;
      document.querySelectorAll(".cmShot").forEach(b => b.onclick = () => showShot(crewShotCard(c, sh, crewP[+b.dataset.i])));
      return;
    }
    if (ptab === "crew") {
      document.querySelector(".rates").ontoggle = (e) => { ratesOpen = e.target.open; };
      document.querySelector(".prep").ontoggle = (e) => { prepOpen = e.target.open; };
    const prepT = $("prepText"), prepS = $("prepSeg"), tdR = $("tdRate");
    prepT.onchange = () => { c.prep = prepT.value.trim(); updateProps(c.id, { "前置": c.prep || null }); };
    prepS.onchange = () => { c.prepSeg = num(prepS.value); updateProps(c.id, { "前置段數": c.prepSeg }); render(); };
    $("tdName").onchange = () => { c.tdName = $("tdName").value.trim(); updateProps(c.id, { "TD姓名": c.tdName || null }); render(); };
    $("tdFlat").onchange = () => { c.tdFlat = num($("tdFlat").value); updateProps(c.id, { "TD整筆費用": c.tdFlat }); render(); };
    tdR.onchange = () => { c.tdRate = num(tdR.value); updateProps(c.id, { "TD時段費": c.tdRate }); render(); };

    $("rateAllBtn").onclick = () => {
      const v = num($("rateAll").value); if (!v) return;
      document.querySelectorAll(".rateIn").forEach(inp => { if (!inp.value) { inp.value = v; setRate(c, rec, inp.dataset.name, v); } });
      saveRec(c); render();
    };
    document.querySelectorAll(".rateIn").forEach(inp => inp.onchange = () => { setRate(c, rec, inp.dataset.name, num(inp.value)); saveRec(c); render(); });
      return;
    }
    document.querySelectorAll(".wkTog").forEach(el => el.onclick = (e) => {
      if (e.target.closest("input")) return;
      const n = +el.dataset.w, st = wkOpen[c.id] || (wkOpen[c.id] = new Set());
      st.has(n) ? st.delete(n) : st.add(n); render();
    });
    document.querySelectorAll(".wkVenue").forEach(inp => inp.onchange = () => { const v = inp.value.trim(); if (v) rec.wv[+inp.dataset.w] = v; else delete rec.wv[+inp.dataset.w]; saveRec(c); render(); });
    $("toTop").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
    $("clearAll").onclick = () => {
      if (clearArm !== "all") { clearArm = "all"; render(); return; }
      clearArm = null; rec.days = []; rec.rates = {}; delete recs[c.id]; c.punch = "";
      updateProps(c.id, { "打卡": null }); render();
    };
    $("addDay").onclick = () => {
      const v = $("addDate").value; if (!v) return;
      const d = { date: pd(v), stage: $("addStage").value, tin: "", tout: "", lunch: 0, dinner: 0, adj: null, note: "", people: [] };
      if (rec.days.find(x => dayKey(x) === dayKey(d))) return;
      rec.days.push(d); rec.days.sort(dayCmp); saveRec(c); render();
    };

    document.querySelectorAll(".day").forEach(el => {
      const i = +el.dataset.i, d = rec.days[i], prev = rec.days[i - 1];
      el.querySelector(".clearDay").onclick = () => {
        if (clearArm !== i) { clearArm = i; render(); return; }
        clearArm = null; Object.assign(d, { off: false, tin: "", tout: "", slot: "", lunch: 0, dinner: 0, adj: null, note: "", people: [] });
        openMore.delete(i); saveRec(c); render();
      };
      el.querySelector(".offbtn").onclick = () => { d.off = !d.off; if (d.off) Object.assign(d, { tin: "", tout: "", slot: "", lunch: 0, dinner: 0, adj: null }); saveRec(c); render(); };
      if (d.off) return;
      if (d.stage === "裝車") {
        el.querySelectorAll(".slot").forEach(b => b.onclick = () => { d.slot = d.slot === b.dataset.s ? "" : b.dataset.s; d.tin = ""; d.tout = ""; saveRec(c); render(); });
        return;
      }
      const tin = el.querySelector(".tin"), tout = el.querySelector(".tout");
      const saveTimes = () => {
        const a = normTime(tin.value), b = normTime(tout.value);
        tin.value = a; tout.value = b;
        if (a === d.tin && b === d.tout) return;
        d.tin = a; d.tout = b; saveRec(c); render();
      };
      tin.onchange = saveTimes; tout.onchange = saveTimes;
      el.querySelectorAll(".qin").forEach(b => b.onclick = () => { tin.value = b.dataset.t; saveTimes(); });
      el.querySelectorAll(".qout").forEach(b => b.onclick = () => { tout.value = b.dataset.t; saveTimes(); });
      if (el.querySelector(".same")) el.querySelector(".same").onclick = (e) => {
        if (e.target.classList.contains("std")) { tin.value = "0900"; tout.value = "2200"; } else { tin.value = prev.tin; tout.value = prev.tout; }
        saveTimes();
      };
      const keepOpen = () => { openMore.add(i); };
      el.querySelector(".more").open = openMore.has(i);
      el.querySelector(".more").ontoggle = (e) => { if (e.target.open) openMore.add(i); else openMore.delete(i); };
      el.querySelectorAll(".ml").forEach(b => b.onclick = () => { keepOpen(); d.lunch = +b.dataset.v; saveRec(c); render(); });
      el.querySelectorAll(".md").forEach(b => b.onclick = () => { keepOpen(); d.dinner = +b.dataset.v; saveRec(c); render(); });
      const adj = el.querySelector(".adj"); adj.onchange = () => { keepOpen(); d.adj = num(adj.value); saveRec(c); render(); };
    });
    document.querySelectorAll(".pchip").forEach(p => p.onclick = () => {
      const d = rec.days[+p.dataset.i];
      if (p.classList.contains("add")) openPicker(c, rec, d, tmap); else openEditor(c, rec, d, p.dataset.name, tmap);
    });
  }
  const openMore = new Set();
  let ratesOpen = false, prepOpen = false;

  const troupeOf = (c) => (c.troupeIds || []).map(id => (troupes[id] || {}).name).filter(Boolean).join("、");

  // ===================== timesheet =====================
  const dws = (d) => `${md(d)} (${wk(d)})`;
  function buildSheet(c, rec, tmap) {

    const ds = rec.days;
    // 沒有人上班的進場日（例如「不留技術」的那週）不放進時段表
    const used = (d) => !!(d.tin || d.tout) || attendees(d, tmap).length > 0;
    const ws = weeksOf(c, rec).map(w => Object.assign({}, w, { days: w.days.filter(used) })).filter(w => w.days.length);
    // 最後一週只剩一天（拆台日）時，當作「拆台」欄，不另成一週
    const strikeDays = ds.filter(d => d.stage === "拆台");
    if (ws.length > 1 && ws[ws.length - 1].days.length === 1 && !strikeDays.length) strikeDays.push(ws.pop().days[0]);
    const allCols = [];
    const push = (d, group, gkey, glabel) => allCols.push({ d, group, gkey, glabel });
    ds.filter(d => d.stage === "裝車").forEach(d => push(d, "裝車", "裝車", "裝車"));
    ds.filter(d => d.stage === "交通").forEach(d => push(d, "交通", "交通", "交通\n時段"));
    ws.forEach(w => {
      const lab = (ws.length > 1 ? `進場 Week ${w.n}` : "進場") + (w.venue ? `（${w.venue}）` : "");
      w.days.forEach(d => push(d, "進場", "進場" + w.n, lab));
    });
    strikeDays.forEach(d => push(d, "拆台", "拆台", "拆台"));
    ds.filter(d => d.stage === "卸車").forEach(d => push(d, "卸車", "卸車", "卸車"));
    const groups = [];
    allCols.forEach((col, k) => {
      const g = groups[groups.length - 1];
      if (g && g.gkey === col.gkey) g.n++; else groups.push({ gkey: col.gkey, glabel: col.glabel, group: col.group, start: k, n: 1, week: col.group === "進場" ? +col.gkey.slice(2) : 0 });
    });
    const cellOf = (x) => {
      if (x && x.slot) return { text: [SLOTS[x.slot]].concat(x.note || []).join("\n"), seg: x.seg === null ? "" : x.seg, raw: x };
      if (!x || (!x.tin && !x.tout)) return { text: "", seg: "" };
      const ls = x.adj === null || x.adj === undefined ? lateSeg(x.tin, x.tout) : 0;
      const lines = [x.tin || "?", x.tout || "?", mealText("午", x.lunch, true), mealText("晚", x.dinner, true), ls ? "超過2200" : ""].concat(x.note).filter(Boolean);
      return { text: lines.join("\n"), seg: x.seg === null ? "" : x.seg, raw: x };
    };
    const at = (name) => (d) => attendees(d, tmap).includes(name);
    const roleText = (name) => {
      if (name === TD_NAME) return "TD";
      const parts = [];
      // 職位看 Call Time 排班（缺席不影響「全程」的判斷）
      const on = (d) => (tmap.get(d) || new Set()).has(name) || d.people.some(p => p.name === name && !p.absent);
      const kind = (days) => {
        const n = days.filter(on).length, f = on(days[0]), l = on(days[days.length - 1]);
        return !n ? "" : n === days.length ? "全程" : f && l ? "裝拆" : f ? "裝台" : l ? "拆台" : `${n}天`;
      };
      const k = ws.map(w => kind(w.days));
      if (!(k.length && k.every(x => x === "全程")) && ds.some(d => d.stage === "裝車" && on(d))) parts.push("裝車");
      if (ws.length > 1) k.forEach((x, i) => { if (x) parts.push(`W${ws[i].n}${x}`); });
      else if (k[0]) parts.push(k[0]);
      const whole = k.length && k.every(x => x === "全程");
      if (!whole && strikeDays.some(on)) parts.push("拆台");
      if (!whole && ds.some(d => d.stage === "卸車" && on(d))) parts.push("卸車");
      return (parts.length ? parts.join(" / ") + "\n" : "") + "Crew";
    };
    const person = (name, role) => {

    const r = payloadOf(await mcp.callTool("Google Drive", "search_files", { query: q, excludeContentSnippets: true, pageSize: size || 50 }, { cache: false }));
    return r.files || (r.content && r.content.files) || [];
  }
  function chooseFolder(c, cands, ongoingId, others) {
    return new Promise((resolve) => {
      const sheet = $("pSheet");
      const list = cands.slice().sort((a, b) => (b.parentId === ongoingId) - (a.parentId === ongoingId) || String(b.createdTime).localeCompare(String(a.createdTime)));
      sheet.innerHTML = `<div class="sh-in"><b>要把時段表放在哪個資料夾？</b>
        <div class="note">用「${esc(c.title.split("_")[0].replace(/^\d{2,4}\s*/, ""))}」在雲端硬碟找到 ${cands.length} 個同名資料夾，選一個，之後都會放在它裡面的「時段表」資料夾。</div>
        <div class="fd-list">${list.concat(others || []).map((f, k) => `${k === list.length ? `<div class="clabel" style="margin-top:6px">其他名稱相近的資料夾</div>` : ""}<button class="fd" data-k="${k}"><b>${esc(f.title)}</b><small>${f.parentId === ongoingId ? "在「劇場案子_進行中」・" : (() => { const up = cands.concat(others || []).find(x => x.id === f.parentId); return up ? `在「${esc(up.title)}」裡・` : ""; })()}建立於 ${String(f.createdTime || "").slice(0, 10)}</small></button>`).join("") || `<div class="note">找不到符合的資料夾</div>`}</div>
        <div class="sh-actions"><button class="ghost" id="fdRoot">放在雲端硬碟最上層</button><button class="ghost" id="fdCancel">取消</button></div></div>`;
      sheet.classList.add("show");
      const done = (v) => { sheet.classList.remove("show"); resolve(v); };
      sheet.querySelectorAll(".fd").forEach(b => b.onclick = () => done(list.concat(others || [])[+b.dataset.k]));
      $("fdRoot").onclick = () => done({ id: "root", title: "我的雲端硬碟" });
      $("fdCancel").onclick = () => done(null);
      sheet.onclick = (e) => { if (e.target === sheet) done(null); };
    });
  }
  async function ensureTsFolder(c, msg) {
    // 已經記過的「時段表」資料夾：確認還在、沒有被丟進垃圾桶
    const saved = folderIdOf(c.tsFolder);
    if (saved) {
      try {
        const m = payloadOf(await mcp.callTool("Google Drive", "get_file_metadata", { fileId: saved, excludeContentSnippets: true }, { cache: false }));
        if (m && m.id && !m.trashed) return saved;
      } catch (e) {}
      c.tsFolder = "";
    }
    msg.textContent = "在「劇場案子_進行中」找這個案子的資料夾…";
    const base = c.title.split("_")[0].replace(/^\d{2,4}\s*/, "").trim() || c.title;
    const ongoing = (await driveSearch(`title = '劇場案子_進行中' and mimeType = '${FOLDER_MT}' and owner = 'me' and trashed = false`, 5))[0];
    let pick = null;
    if (ongoing) {
      const inside = await driveSearch(`parentId = '${ongoing.id}' and title contains '${qstr(base)}' and mimeType = '${FOLDER_MT}' and trashed = false`, 20);
      const exact = inside.filter(f => f.title.replace(/^\d{2,4}\s*/, "").trim() === base);
      if (exact.length === 1) pick = exact[0];
      else if (exact.length > 1) { pick = await chooseFolder(c, exact, ongoing.id, []); if (!pick) throw { code: "cancelled" }; }
      else {
        // 進行中裡還沒有這個案子的資料夾 → 試算表直接放在「劇場案子_進行中」最上層，不建資料夾、也不記住位置
        msg.textContent = "「劇場案子_進行中」裡還沒有這個案子的資料夾，先放在最上層…";
        return ongoing.id;
      }
    } else {
      // 找不到「劇場案子_進行中」才退回全雲端硬碟搜尋
      const cands = (await driveSearch(`title contains '${qstr(base)}' and mimeType = '${FOLDER_MT}' and owner = 'me' and trashed = false`))
        .filter(f => f.title !== "時段表" && !(f.capabilities && f.capabilities.canAddChildren === false));
      const exact = cands.filter(f => f.title.replace(/^\d{2,4}\s*/, "").trim() === base);
      pick = exact.length === 1 ? exact[0] : await chooseFolder(c, exact.length ? exact : cands, "", exact.length ? cands.filter(f => !exact.includes(f)) : []);
      if (!pick) throw { code: "cancelled" };
    }
    const ts = pick.id === "root" ? [] : await driveSearch(`parentId = '${pick.id}' and title = '時段表' and mimeType = '${FOLDER_MT}' and trashed = false`, 5);
    let tsId = (ts[0] || {}).id;
    if (!tsId) {
      msg.textContent = `在「${pick.title}」裡建立「時段表」資料夾…`;
      const made = payloadOf(await mcp.callTool("Google Drive", "create_file", Object.assign({ title: "時段表", contentMimeType: FOLDER_MT }, pick.id === "root" ? {} : { parentId: pick.id }), { cache: false }));
      tsId = made.id || (made.file && made.file.id);
      if (!tsId) throw { code: "tool_error", message: "沒有建立成功「時段表」資料夾" };
    }
    c.tsFolder = `https://drive.google.com/drive/folders/${tsId}`;
    updateProps(c.id, { "時段表資料夾": c.tsFolder });
    return tsId;
  }
  const stamp = () => { const d = new Date(), p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}${p(d.getMinutes())}`; };
  async function makeGoogleSheet_google(c, s) {
    const btn = $("tsMake"), msg = $("tsMsg");
    btn.disabled = true; btn.textContent = "建立中…"; msg.textContent = "正在 Google 雲端硬碟建立試算表…";
    try {
      const plan = sheetPlan(s);
      const parentId = await ensureTsFolder(c, msg);
      let title = s.title;
      const same = await driveSearch(`parentId = '${parentId}' and title contains '${qstr(s.title)}' and trashed = false`, 10).catch(() => []);
      if (same.length) title += ` ${stamp()}`;
      msg.textContent = "正在 Google 雲端硬碟建立試算表…";
      const made = await mcp.callTool("Google Drive", "create_file", { title, contentMimeType: "application/vnd.google-apps.spreadsheet", parentId }, { cache: false });
      const f = payloadOf(made);
      const id = f.id || (f.file && f.file.id) || ((JSON.stringify(f).match(/"id"\s*:\s*"([\w-]{20,})"/) || [])[1]);
      if (!id) throw { code: "tool_error", message: "沒有拿到新檔案的 ID" };
      const meta = payloadOf(await mcp.callTool("Google Sheets", "get_spreadsheet", { spreadsheetId: id, fields: ["sheets.properties"] }, { cache: false }));
      const sp = (((meta.sheets || (meta.content && meta.content.sheets) || [])[0]) || {}).properties || { sheetId: 0 };
      const SID = sp.sheetId || 0, SID2 = SID === 1 ? 2 : 1;
      msg.textContent = "建立分頁…";
      await mcp.callTool("Google Sheets", "update_spreadsheet", { spreadsheetId: id, requests: [
        { updateSheetProperties: { properties: { sheetId: SID, title: "時段表" }, fields: "title" } },
        { addSheet: { properties: { sheetId: SID2, title: EXP_TAB, index: 1 } } },
      ] }, { cache: false });
      msg.textContent = "寫入表格內容…";
      await mcp.callTool("Google Sheets", "update_values", { spreadsheetId: id, range: "'時段表'!A1", values: plan.rows }, { cache: false });
      await mcp.callTool("Google Sheets", "update_values", { spreadsheetId: id, range: `'${EXP_TAB}'!A1`, values: plan.rows2 }, { cache: false });
      msg.textContent = "套用格式…";
      await mcp.callTool("Google Sheets", "update_spreadsheet", { spreadsheetId: id, requests: plan.reqs(SID, SID2) }, { cache: false });
      msg.textContent = "設定共用連結…";
      let shared = null;
      try { shared = payloadOf(await mcp.callTool("Google Drive", "share_file", { fileId: id, permissionId: "anyoneWithLink", role: "reader" }, { cache: false })); } catch (e) { shared = null; }
      const link = (shared && shared.shareableLink) || f.viewUrl || f.alternateLink || f.webViewLink || `https://docs.google.com/spreadsheets/d/${id}/edit`;
      if (!shared) sheetWarn[c.id] = "試算表建好了，但共用設定沒有成功，請在 Google 試算表裡手動改成「知道連結的使用者：檢視者」。"; else delete sheetWarn[c.id];
      sheetLinks[c.id] = link;
      toast("試算表建立好了");
      render();
    } catch (e) {
      btn.disabled = false; btn.textContent = "建立 Google 試算表";
      const code = e && e.code;
      msg.textContent = code === "cancelled" ? "已取消，沒有建立試算表。"
        : code === "server_not_connected" ? "還沒連接 Google 雲端硬碟或 Google 試算表，請到 claude.ai 設定 → 連接器加入。"
        : code === "needs_reauth" ? "Google 連線過期，請到 claude.ai 設定 → 連接器重新連接。"
        : (code === "approval_required" || code === "not_in_manifest") ? "需要你允許這個頁面使用 Google 雲端硬碟和試算表，再按一次。"
        : "建立失敗：" + String((e && e.message) || e).slice(0, 120) + "（如果已經建立了一半，雲端硬碟裡可能會有一份不完整的試算表）";
    }
  }
  async function makeGoogleSheet(c, s) {   // 獨立版：直接下載 Excel 檔
    const btn = $("tsMake"), msg = $("tsMsg");
    btn.disabled = true; btn.textContent = "製作中…";
    try {
      const plan = sheetPlan(s);
      const blob = window.__tdh.xlsx([{ name: "時段表", rows: plan.rows }, { name: EXP_TAB, rows: plan.rows2 }], plan.reqs(0, 1));
      const how = await window.__tdh.saveFile(blob, `${s.title}.xlsx`.replace(/[\\/:*?"<>|]/g, "_"));
      msg.textContent = how === "cancelled" ? "已取消。" : "Excel 檔做好了！可以存到檔案、傳到 LINE，或用 Google 試算表打開。";
      if (how !== "cancelled") toast("時段表已下載");
    } catch (e) { msg.textContent = "製作失敗：" + String((e && e.message) || e).slice(0, 120); }
    btn.disabled = false; btn.textContent = "下載 Excel 時段表";
  }
  // ---------- preview ----------
  function previewHtml(s, c, shot) {
    const grand = s.people.reduce((a, p) => a + (p.pay || 0), 0);
    const segs = s.people.reduce((a, p) => a + p.total, 0);
    const tags = (x) => {
      if (!x) return "";
      const t = [];
      if (x.lunch) t.push(`午+${fmtSeg(x.lunch)}`);
      if (x.dinner) t.push(`晚+${fmtSeg(x.dinner)}`);
      const ls = x.adj === null || x.adj === undefined ? lateSeg(x.tin, x.tout) : 0;
      if (ls) t.push(`超+${fmtSeg(ls)}`);
      if (x.adj !== null && x.adj !== undefined) t.push("手動");
      return t.map(v => `<i>${v}</i>`).join("");
    };
    const gcls = (g) => g.group === "進場" ? `g-進場 wk${((g.week - 1) % 4) + 1}` : `g-${g.group}`;
    let h = `<div class="tsx"><div class="tsx-head"><div class="tsx-k">舞台技術人員時段統計表</div>
      <div class="tsx-t">${esc(s.short)}</div>
      ${(() => { const v = [...new Set(s.weeks.map(w => w.venue).filter(Boolean))]; return v.length ? `<div class="tsx-v">@${esc(v.join("、"))}</div>` : ""; })()}
      ${shot ? "" : `<div class="tsx-chips"><span><b>${s.people.length}</b> 人</span><span><b>${fmtSeg(segs)}</b> 段</span><span><b>$${money(grand)}</b></span></div>`}</div>
      <div class="tsx-scroll"><table class="tsx-tb"><thead><tr><th class="stk" rowspan="2">人員</th><th rowspan="2" class="g-prep">前置</th>
      ${s.groups.map(g => `<th colspan="${g.n}" class="g ${gcls(g)}">${esc(g.glabel.replace("\n", ""))}</th>`).join("")}<th rowspan="2" class="tot">時段數</th><th rowspan="2" class="tot">金額</th></tr>
      <tr>${s.groups.map(g => s.allCols.slice(g.start, g.start + g.n).map((col, j) => `<th class="dt ${gcls(g)}${j === 0 ? " gstart" : ""}">${md(col.d.date)}<small>${wk(col.d.date)}</small></th>`).join("")).join("")}</tr></thead><tbody>`;
    const starts = new Set(s.groups.map(g => g.start));
    s.people.forEach(p => {
      h += `<tr class="${p.role === "TD" ? "td" : ""}"><td class="stk"><b>${esc(p.name)}</b><small>${esc(p.roleText.replace(/\n/g, " "))}${p.flat ? "・整筆" : p.rate ? "・$" + money(p.rate) : "・<em>未填</em>"}</small></td>
        <td class="pp">${p.prepSeg !== "" ? `<span class="sg">${fmtSeg(p.prepSeg)}</span>${p.prep ? `<div class="pt">${esc(p.prep).replace(/\n/g, "<br>")}</div>` : ""}` : `<span class="nil">·</span>`}</td>`;
      p.cells.forEach((cell, k) => {
        const x = cell.raw, gs = starts.has(k) ? " gstart" : "";
        h += cell.text ? `<td class="cell${gs}"><span class="tm">${x.slot ? SLOTS[x.slot] : `${esc(x.tin || "?")}${shot ? "–" : "<br>"}${esc(x.tout || "?")}`}</span><span class="sg">${cell.seg === "" ? "?" : fmtSeg(cell.seg)}</span>${tags(x)}</td>` : `<td class="cell${gs}"><span class="nil">·</span></td>`;
      });
      h += `<td class="tot"><b>${fmtSeg(p.total)}</b></td><td class="tot">${p.pay !== null ? "$" + money(p.pay) : "<em>—</em>"}</td></tr>`;
    });
    h += `</tbody><tfoot><tr><td class="stk"><b>總計</b></td><td></td><td colspan="${s.allCols.length}"></td><td class="tot"><b>${fmtSeg(segs)}</b></td><td class="tot"><b>$${money(grand)}</b></td></tr></tfoot></table></div>
      <div class="tsx-legend"><i>午+</i>午餐 <i>晚+</i>晚餐 <i>超+</i>22:00 後 <span class="nil">·</span> 當天沒來或未填</div>
      ${shot ? `<div class="tsx-rules">${ruleLines(s.late).map((l, i) => i ? `<div>${esc(l)}</div>` : `<b>${esc(l)}</b>`).join("")}</div>` : ""}</div>`;
    return h;
  }
  async function copySheet(s) {
    const html = `<meta charset="utf-8">` + sheetHtml(s).replace(' id="tsTable"', "");
    const tsv = sheetTsv(s);
    try { await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([tsv], { type: "text/plain" }) })]); toast("已複製時段表"); return; } catch (e) {}
    try {
      const el = $("tsTable"); const r = document.createRange(); r.selectNode(el);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      const ok = document.execCommand("copy"); sel.removeAllRanges();
      if (ok) { toast("已複製時段表"); return; }
    } catch (e) {}
    $("fallbackText").value = tsv; $("modal").classList.add("show");
  }
  function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }

  // ===================== boot =====================
  window.__punch = {
    enter(ph) {
      if (ph && ph !== phase) { phase = ph; ptab = PHASE_TABS[ph][0][0]; window.scrollTo(0, 0); }
      const t = document.querySelector("#punchView h1"); if (t) t.textContent = phase === "close" ? "結案" : "進場中";
      if (!loaded && mcp) loadAll(); render();
    },
    refresh() { Object.keys(tables).forEach(k => delete tables[k]); loadAll(); },
    _test: { segments, parseRec, serialize, parseTable, buildSheet, tableMap, recOf, sheetPlan, getCase: () => cases.find(x => x.id === caseId),
      set(o) { cases = o.cases; crew = o.crew; crewByName = {}; crew.forEach(c => { crewByName[c.name] = c; }); Object.assign(tables, o.tables); } }
  };
  document.addEventListener("change", (e) => { if (e.target && e.target.id === "caseSel") { caseId = e.target.value; render(); } });
  (async () => { if (!window.claude || !window.claude.use) { render(); return; } mcp = await window.claude.use("mcp"); render(); })();
})();

</script>
<script>
(() => {
  const sen = document.getElementById("pSentinel"), st = document.querySelector(".pstick");
  if (!sen || !st || !window.IntersectionObserver) return;
  const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--stick-top")) || 0;
  new IntersectionObserver(([e]) => st.classList.toggle("stuck", !e.isIntersecting), { rootMargin: `-${top + 1}px 0px 0px 0px` }).observe(sen);
})();
</script>
<script>
(() => {
  const vv = window.visualViewport, root = document.documentElement;
  const upd = () => { if (!vv) return; root.style.setProperty("--vvh", vv.height + "px"); root.style.setProperty("--vvt", vv.offsetTop + "px"); };
  if (vv) { vv.addEventListener("resize", upd); vv.addEventListener("scroll", upd); upd(); }
  const sh = document.getElementById("pSheet");
  if (sh) new MutationObserver(() => { const on = sh.classList.contains("show"); root.style.overflow = on ? "hidden" : ""; document.body.style.overflow = on ? "hidden" : ""; }).observe(sh, { attributes: true, attributeFilter: ["class"] });
})();
</script>

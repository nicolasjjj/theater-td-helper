<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>劇場TD小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4f0; --card:#fff; --ink:#1f1d1a; --muted:#7a746b; --line:#e6e1d8;
    --accent:#2f5d50; --accent-ink:#fff; --blue:#e3ecf7; --blue-ink:#2c5282;
    --yellow:#faf0d2; --yellow-ink:#8a6410; --sel:#eef4f1;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#171614; --card:#22201d; --ink:#f0ede7; --muted:#a39d93; --line:#34312c;
      --accent:#6fb39c; --accent-ink:#10201b; --blue:#1f2c3d; --blue-ink:#9cc0ea;
      --yellow:#352c16; --yellow-ink:#e7c66a; --sel:#1d2a25; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-tap-highlight-color:transparent}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 150px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
  h1{font-size:20px;margin:0;font-weight:700}
  .sub{color:var(--muted);font-size:12px;margin:2px 0 12px}
  .icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
    padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;
    padding:8px 0;font:inherit;font-size:14px;cursor:pointer}
  .tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 12px 12px 46px;
    margin-bottom:10px;position:relative;cursor:pointer;transition:border-color .15s, background .15s}
  .card.sel{border-color:var(--accent);background:var(--sel)}
  .check{position:absolute;left:13px;top:14px;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;background:var(--card)}
  .card.sel .check{background:var(--accent);border-color:var(--accent)}
  .card.sel .check::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;
    transform:rotate(45deg) translate(-1px,-1px)}
  .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .tag{font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px}
  .tag.w{background:var(--blue);color:var(--blue-ink)}
  .tag.s{background:var(--yellow);color:var(--yellow-ink)}
  .tag.l{background:var(--line);color:var(--ink)}
  .case{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:15px;line-height:1.55}
  .row-actions{display:flex;gap:8px;margin-top:8px}
  .mini{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:4px 10px;
    font:inherit;font-size:12px;cursor:pointer;text-decoration:none}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom) + var(--bar-lift,0px))}
  @media (pointer:coarse){:root{--bar-lift:6px}}
  .bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
  .count{flex:1;font-size:14px;color:var(--muted)}
  .count b{color:var(--ink)}
  .primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 20px;
    font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .primary:disabled{opacity:.4;cursor:default}
  .ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:11px 14px;
    font:inherit;font-size:14px;cursor:pointer}
  .state{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center;
    color:var(--muted);font-size:14px;line-height:1.6}
  .state b{color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;
    transition:all .2s;pointer-events:none;z-index:10}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .modal.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
  .sheet textarea{width:100%;height:45vh;border:1px solid var(--line);border-radius:10px;padding:10px;
    font:inherit;font-size:15px;background:var(--bg);color:var(--ink)}
  .sheet p{margin:0 0 8px;font-size:13px;color:var(--muted)}
  .note{font-size:12px;color:var(--muted);margin-top:4px}
  .info{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;line-height:1.6;color:var(--muted)}
  .info b{color:var(--ink);font-weight:500}
  .cf-h{font-size:16px;margin-bottom:10px} .cf-h b{font-size:18px}
  .cf-rows{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .cf-opt{margin:10px 0}
  .cf-cancel{width:100%;margin-top:8px;padding:9px}
  .cf-h small{margin-left:6px;font-size:12px;color:var(--accent)}
  .planrow{font-size:13px;color:var(--muted);margin:2px 0 4px} .planrow b{color:var(--ink);font-weight:500}
  .cardBtns{display:flex;gap:8px;margin-top:10px} .cardBtns .bookBar{flex:2;margin-top:0}
  .tblBtn{flex:1;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:7px 0}
  .bookBar{display:block;width:100%;margin-top:10px;padding:8.5px 12px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;text-align:center;cursor:pointer;box-sizing:border-box}
  .bk-g{display:flex;align-items:flex-start;gap:8px;margin-top:8px} .bk-g .plist{flex:1}
  .gt{flex:none;font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;margin-top:4px;min-width:3.2em;text-align:center}
  .gt.g-全程,.bk-g .pchip.on.g-全程{background:color-mix(in srgb,#4a86c5 26%,var(--card));border-color:#4a86c5;color:var(--ink)}
  .gt.g-裝拆,.bk-g .pchip.on.g-裝拆{background:color-mix(in srgb,#d9a521 28%,var(--card));border-color:#d9a521;color:var(--ink)}
  .gt.g-裝台,.bk-g .pchip.on.g-裝台{background:color-mix(in srgb,#3f9a5a 26%,var(--card));border-color:#3f9a5a;color:var(--ink)}
  .gt.g-拆台,.bk-g .pchip.on.g-拆台{background:color-mix(in srgb,#d9662b 26%,var(--card));border-color:#d9662b;color:var(--ink)}
  .gt.g-na,.bk-g .pchip.on.g-na{background:var(--bg);border-color:var(--line);color:var(--muted)}
  .bk-h{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--accent-ink)} .bk-h i{display:none}
  .bk-r{display:flex;gap:8px;font-size:13px;margin-top:4px;line-height:1.45} .bk-r b{flex:none;font-weight:600;min-width:3.6em} .bk-r span{color:var(--muted)}
  .bk-l{display:block;font-size:13px;color:var(--muted);margin-top:4px}
  .cf-row{display:flex;align-items:baseline;gap:8px;text-align:left;font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .cf-row:disabled{opacity:1} .cf-row:not(.on){opacity:.45}
  .cf-row .ck{width:16px;height:16px;flex:none;border-radius:4px;border:1.5px solid var(--muted);align-self:center}
  .cf-row.on .ck{background:var(--accent);border-color:var(--accent)}
  .cf-row small{margin-left:auto;color:var(--muted);font-size:12px;text-align:right}
  .cf-row.has small{color:var(--accent)}
  .cf-act{display:flex;gap:8px;margin-top:2px} .cf-act button{flex:1;padding:11px}
  .linkbtn{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
  .infoTog{display:flex;align-items:center;gap:4px;font-weight:500;width:100%;background:none;border:0;padding:2px 0;margin:0 0 2px;font:inherit;font-size:13px;color:var(--muted);text-align:left;cursor:pointer}
  .infoTog .arr{display:inline-flex;align-items:center;justify-content:center;transition:transform .15s;font-size:15px;width:20px;height:20px}
  .infoTog.on .arr{transform:rotate(90deg)}
  .infoBody{padding:2px 0 4px 18px}
  .bar-in .ghost{padding:11px 10px}
  [hidden]{display:none!important}
  /* ---- day states ---- */
  :root{--ok-bg:#eef8f2;--ok-bd:#a9d8bb;--ok-ink:#23784b;--warn-bg:#fff4e5;--warn-bd:#f0bf7a;--warn-ink:#b25d00;--today:#1f6f5c;--today-glow:rgba(31,111,92,.22)}
  @media (prefers-color-scheme: dark){:root{--ok-bg:#122a1d;--ok-bd:#2e8a57;--ok-ink:#5fe39a;--warn-bg:#33210b;--warn-bd:#c47a1e;--warn-ink:#ffb04d;--today:#45d4c0;--today-glow:rgba(69,212,192,.28)}}
  .day{position:relative;transition:background .2s,border-color .2s}
  .day .pill{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--muted)}
  .day.done{background:var(--ok-bg);border-color:var(--ok-bd);box-shadow:inset 5px 0 0 var(--ok-ink)}
  .day.done .pill{background:var(--ok-ink);color:var(--bg)}
  .day.done .big{color:var(--ok-ink)}
  .day.miss{background:var(--warn-bg);border-color:var(--warn-bd);box-shadow:inset 5px 0 0 var(--warn-ink)}
  .day.miss .pill{background:var(--warn-ink);color:var(--bg)}
  .day.miss .big.empty{color:var(--warn-bd)}
  .day.today{border:2px solid var(--today);box-shadow:inset 5px 0 0 var(--today),0 0 0 4px var(--today-glow)}
  .day.today .pill{background:var(--today);color:var(--bg)}
  .day.today .dd,.day.today .big{color:var(--today)}
  .day.future .pill{background:var(--line);color:var(--muted)}
  .ptabs{display:flex;gap:6px;margin:0 0 12px}
  .ptabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:9px 0;font:inherit;font-size:14px;cursor:pointer}
  .ptabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
  .more summary{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--muted)}
  .more summary span{font-size:11px;color:var(--warn-ink);background:var(--warn-bg);padding:1px 7px;border-radius:6px}
  .segc i{font-style:normal;font-size:10px;opacity:.7;margin-left:2px}
  .danger{margin-top:12px;border:1px solid #e4b4ad;background:transparent;color:#b24434;border-radius:10px;padding:9px 12px;font:inherit;font-size:13px;cursor:pointer;width:100%}
  .danger.sm{width:auto;padding:6px 12px;font-size:12px;margin-top:10px}
  .cm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .cmh{display:flex;align-items:center;gap:8px} .cmh span{flex:1;color:var(--muted);font-size:13px} .cmh em{color:var(--warn-ink);font-style:normal}
  .cmh .primary{padding:7px 14px;font-size:13px}
  .row2>*{min-width:0}
  .more .row2 input,.more input{width:100%;box-sizing:border-box;min-width:0}
  .cm-top .ghost{white-space:nowrap;flex:none}
  body{overflow-x:hidden}
  .shotbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;font:inherit;cursor:pointer}
  .shotbtn b{font-size:16px} .shotbtn span{font-size:13px;color:var(--muted)}
  .shot{position:fixed;inset:0;z-index:50;background:#eceae5;display:none;align-items:center;justify-content:center;padding:16px}
  .shot.show{display:flex}
  .shot-in{width:100%;max-width:520px}
  .lightvars{--bg:#f6f4f0;--card:#fff;--ink:#1f1d1a;--muted:#7a746b;--line:#e6e1d8;--accent:#2f5d50;--accent-ink:#fff;--sel:#eef4f1;--warn-ink:#b25d00;color:var(--ink)}
  .wide-box{position:relative;flex:none}
  .shot-wide{position:absolute;left:0;top:0;transform-origin:0 0;width:max-content}
  .shot.wide{background:var(--card);padding:0}
  .shot-wide .tsx{margin:0;border:0;border-radius:0}
  .tsx-v{font-size:13px;color:var(--muted);margin:-6px 0 8px}
  .tsx-rules{padding:10px 14px 14px;font-size:11px;line-height:1.6;color:var(--muted);border-top:1px solid var(--line)} .tsx-rules b{color:var(--ink);font-size:12px}
  .shot-in.land{max-width:none;width:auto}
  .shot-in.land{display:flex;justify-content:center}
  .shot-in.land .crewlist{width:max-content;max-width:calc(100vw - 40px);padding:1.2em 2em 1.2em 1.6em}
  @media (orientation:landscape){ .shot .shot-in.land .crewlist{width:68vw;max-width:68vw} .shot .shot-in.land .crewlist .shot-tb{width:100%} .shot .shot-in.land .crewlist .shot-tb th,.shot .shot-in.land .crewlist .shot-tb td.n{width:1%;white-space:nowrap} }
  .shot-in.land .crewlist .shot-tb{width:100%}
  .crewlist .shot-tb th,.crewlist .shot-tb td.n{width:1%}
  .crewlist .shot-t{white-space:nowrap;font-size:1.2em;overflow:hidden}
  .tblv .shot-t{font-size:1.55em;line-height:1.25;margin:.2em 0 .3em}
  .tblv .tv-meta{font-size:.9em;color:#5a544b;white-space:nowrap;margin-bottom:.7em} .tblv .dot{color:#b8b1a6;margin:0 .25em}
  .tblv .tv-plan{display:flex;align-items:baseline;gap:.7em;background:#f3efe6;border-left:.22em solid #2f5d50;border-radius:.35em;padding:.45em .8em;margin:0 0 .8em;white-space:nowrap}
  .tblv .tv-plan span{font-size:.8em;color:#2f5d50;font-weight:700;letter-spacing:.05em} .tblv .tv-plan b{font-size:1.05em;color:#1d1b18}
  .tblv .tv-plan b.tbd{color:#b0741f}
  .crewlist .shot-tb tr.cwk th,.crewlist .shot-tb tr.cwk td{padding-left:.5em} .crewlist .shot-tb tr.cwk td.n{padding-right:.5em}
  .crewlist .shot-tb tr.cwk2,.crewlist .shot-tb tr.cwk4{background:#efede9}
  .crewlist .shot-tb tr.cwk-brk{border-top:1px solid #d9d4cb}
  .crewlist .shot-v{font-size:.95em;font-weight:600;color:#4a453e;margin:.1em 0 .15em}
  .shot-in.land .crewlist .shot-tb th,.shot-in.land .crewlist .shot-tb td{padding-top:.32em;padding-bottom:.32em}
  .shot-in.land .crewlist .shot-tb th{padding-right:1.2em}
  .shot-in.land .crewlist .shot-tb th em{display:inline;margin-left:.4em}
  .shot-in.land .crewlist .shot-tb td.n{padding-left:1.4em}
  .crewlist .shot-tb td.n{padding-right:.2em}
  .cl-cols{display:flex;gap:1.8em} .cl-cols table{flex:1;width:auto}
  .shot-wide .tsx-tb th,.shot-wide .tsx-tb td{padding:4px 7px}
  .shot-wide .tsx-tb td.cell .tm{display:inline}
  .shot-wide .tsx-tb .sg{margin-top:2px}
  .shot-wide .tsx-tb td.cell i{display:inline;margin:0 0 0 3px}
  .shot-wide .tsx-tb td.cell .sg{display:block;width:max-content;margin:2px auto 0}
  .shot-wide .tsx-head{padding:10px 14px 8px}
  .shot-wide .tsx-tb td.pp .pt{white-space:nowrap}
  .shot-wide .tsx-rules{columns:2;column-gap:28px}
  .shot-in.land .crewlist td{white-space:nowrap}
  .shot-wide .tsx-scroll{overflow:visible;max-height:none}
  .shot-wide .tsx-tb thead th,.shot-wide .tsx-tb .stk,.shot-wide .tsx-tb tfoot td{position:static}
  .shot-card{background:#fff;color:#1d1b18;border-radius:18px;padding:1.4em 1.2em;box-shadow:0 8px 30px rgba(0,0,0,.08);font-family:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif}
  .shot-k{font-size:.75em;letter-spacing:.15em;color:#8a847a}
  .shot-t{font-size:1.5em;font-weight:700;margin:.15em 0 .1em}
  .shot-s{font-size:.8em;color:#8a847a;margin-bottom:.9em}
  .shot-tb{width:100%;border-collapse:collapse}
  .shot-tb tr{border-top:1px solid #ece8e1}
  .shot-tb th{text-align:left;white-space:nowrap;padding:.55em .7em .55em 0;font-weight:700;font-size:.92em;vertical-align:top}
  .shot-tb th em{display:block;font-style:normal;font-size:.75em;color:#2f5d50;font-weight:700}
  .shot-tb td{padding:.55em 0;font-size:.95em;line-height:1.55;vertical-align:top}
  .shot-tb td.n{text-align:right;color:#a29b90;font-size:.8em;padding-left:.5em;white-space:nowrap}
  .shot-tb .x{color:#c9c3b8}
  .shot-card.tax{padding:1.8em 1.4em}
  .tax-l{font-size:.8em;color:#8a847a;margin-top:1.1em}
  .tax-v{font-size:1.45em;font-weight:700;line-height:1.35;word-break:break-all}
  .tax-v.num{font-size:2em;letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .fd-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
  .fd{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer} .fd b{font-size:15px} .fd small{font-size:12px;color:var(--muted)}
  .tdrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)} .tdrow span{font-size:13px;font-weight:700} .sh-in .tdrow input{flex:1;min-width:0;width:auto;font:inherit;font-size:15px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink)} .tdrow button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:7px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
  .tdbar{position:fixed;left:12px;right:12px;top:calc(12px + var(--stick-top,0px));display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.15);max-width:480px;margin:0 auto;font-size:13px}
  .tdbar span{white-space:nowrap;color:var(--muted)} .tdbar input{flex:1;min-width:0;font:inherit;font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)} .tdbar button{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:8px;padding:7px 12px;background:var(--accent);color:var(--accent-ink)}
  .shot-hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:6px 14px;border-radius:999px;transition:opacity .4s}
  .shot-hint.gone{opacity:0}
  #list .card{padding:12px 12px 12px 46px}
  .dfoot{display:flex;justify-content:flex-end;margin-top:8px}
  .clearDay{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .clearDay.armed{color:#fff;background:#c0392b;text-decoration:none;padding:5px 12px;border-radius:999px;font-weight:700}
  .askrow{display:flex;align-items:center;gap:6px;margin-top:2px} .askrow span{flex:1}
  .askBtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}

  const API = "/api/v1";
  const NV = "2022-06-28";
  const LS = "tdh.settings.v1";
  const DB_NAMES = { cases: "劇場の案子", crew: "劇場のCrew", troupe: "劇場の劇團", venue: "劇場の場館" };

  // ---------- 設定 ----------
  const S = {
    load() { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { return {}; } },
    save(v) { try { localStorage.setItem(LS, JSON.stringify(v)); } catch (e) {} },
  };
  let cfg = S.load();
  window.__tdh = { get cfg() { return cfg; }, setCfg(v) { cfg = Object.assign({}, cfg, v); S.save(cfg); } };

  // ---------- 呼叫 Notion（限速：Notion 每秒約 3 次） ----------
  let chain = Promise.resolve(), last = 0;
  const gap = 340;
  function nfetch(path, opt = {}, token = cfg.token) {
    const run = async () => {
      const wait = Math.max(0, last + gap - Date.now()); if (wait) await new Promise(r => setTimeout(r, wait));
      last = Date.now();
      let res, tries = 0;
      for (;;) {
        res = await fetch(API + path, {
          method: opt.method || "GET",
          headers: Object.assign({ "Authorization": "Bearer " + token, "Notion-Version": NV }, opt.body ? { "Content-Type": "application/json" } : {}),
          body: opt.body ? JSON.stringify(opt.body) : undefined,
        });
        if (res.status === 429 && tries++ < 4) { await new Promise(r => setTimeout(r, 1000 * tries)); continue; }
        break;
      }
      const j = await res.json().catch(() => ({}));
      if (!res.ok) {
        const e = new Error(j.message || ("Notion " + res.status));
        e.code = res.status === 401 ? "needs_reauth" : res.status === 404 ? "not_found" : "tool_error";
        e.status = res.status; throw e;
      }
      return j;
    };
    const p = chain.then(run, run); chain = p.catch(() => {}); return p;
  }
  window.__tdh.nfetch = nfetch;

  const hex = (u) => { const m = String(u || "").replace(/-/g, "").match(/[0-9a-f]{32}/i); return m ? m[0].toLowerCase() : ""; };
  const dashed = (h) => h.replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/, "$1-$2-$3-$4-$5");
  const purl = (id) => "https://www.notion.so/" + hex(id);
  const plain = (rt) => (rt || []).map(t => t.plain_text || (t.text && t.text.content) || "").join("");
  const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  // ---------- 資料庫結構（欄位型別） ----------
  const schemas = {};
  async function schemaOf(dbId) {
    if (!schemas[dbId]) schemas[dbId] = nfetch(`/databases/${dbId}`).then(d => d.properties || {});
    return schemas[dbId];
  }

  // ---------- 一列資料 → 原本網頁看得懂的格式 ----------
  function flat(page) {
    const o = { url: purl(page.id) };
    for (const [k, p] of Object.entries(page.properties || {})) {
      switch (p.type) {
        case "title": case "rich_text": o[k] = plain(p[p.type]); break;
        case "number": o[k] = p.number; break;
        case "select": o[k] = p.select ? p.select.name : null; break;
        case "status": o[k] = p.status ? p.status.name : null; break;
        case "multi_select": o[k] = JSON.stringify((p.multi_select || []).map(x => x.name)); break;
        case "relation": o[k] = JSON.stringify((p.relation || []).map(x => purl(x.id))); break;
        case "url": o[k] = p.url; break;
        case "checkbox": o[k] = p.checkbox ? "__YES__" : "__NO__"; break;
        case "date": o[`date:${k}:start`] = p.date ? p.date.start : null; o[`date:${k}:end`] = p.date ? p.date.end : null; break;
        case "formula": { const f = p.formula || {}; o[k] = f[f.type] ?? null; break; }
        default: break;
      }
    }
    return o;
  }

  // ---------- 原本的「檢視」→ 資料庫查詢 ----------
  async function queryView(view) {
    const key = String(view).replace("view://", "").toUpperCase();
    const db = { TD: "cases", NEED: "cases", DONE: "cases", CREW: "crew", TROUPE: "troupe", VENUE: "venue" }[key];
    if (!db) throw Object.assign(new Error("unknown view " + view), { code: "tool_error" });
    const dbId = cfg.db && cfg.db[db];
    if (!dbId) throw Object.assign(new Error("not configured"), { code: "not_configured" });
    const sch = await schemaOf(dbId);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const weekAgo = new Date(today); weekAgo.setDate(today.getDate() - 7);
    const and = [], sorts = [];
    const has = (n, t) => sch[n] && (!t || sch[n].type === t);
    if (db === "cases") {
      if (has("職位", "select")) and.push({ property: "職位", select: { equals: "TD" } });
      if (has("進場日期", "date")) {
        if (key === "DONE") { and.push({ property: "進場日期", date: { on_or_before: isoDay(today) } }); sorts.push({ property: "進場日期", direction: "descending" }); }
        else { and.push({ property: "進場日期", date: { on_or_after: isoDay(weekAgo) } }); sorts.push({ property: "進場日期", direction: "ascending" }); }
      }
      if (key === "NEED" && has("Crew 狀態", "multi_select")) and.push({ property: "Crew 狀態", multi_select: { does_not_contain: "全部完成" } });
    }
    const title = Object.keys(sch).find(k => sch[k].type === "title");
    if (db !== "cases" && title) sorts.push({ property: title, direction: "ascending" });
    const body = { page_size: 100 };
    if (and.length) body.filter = and.length === 1 ? and[0] : { and };
    if (sorts.length) body.sorts = sorts;
    const out = []; let cursor = null, g = 0;
    do {
      const r = await nfetch(`/databases/${dbId}/query`, { method: "POST", body: Object.assign({}, body, cursor ? { start_cursor: cursor } : {}) });
      out.push(...(r.results || []).map(flat));
      cursor = r.has_more ? r.next_cursor : null;
    } while (cursor && g++ < 50);
    return { results: out, has_more: false, next_cursor: null };
  }

  // ---------- 頁面內容 → 文字（表格保留成 <table> 格式） ----------
  const escH = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const rtHtml = (rt) => (rt || []).map(t => { const s = escH(t.plain_text || "").replace(/\n/g, "<br>"); return t.annotations && t.annotations.bold ? `<b>${s}</b>` : s; }).join("");
  async function children(id) {
    const out = []; let cursor = null, g = 0;
    do {
      const r = await nfetch(`/blocks/${id}/children?page_size=100${cursor ? "&start_cursor=" + cursor : ""}`);
      out.push(...(r.results || [])); cursor = r.has_more ? r.next_cursor : null;
    } while (cursor && g++ < 20);
    return out;
  }
  async function blocksText(id, depth = 0) {
    const lines = [];
    for (const b of await children(id)) {
      const v = b[b.type] || {};
      if (b.type === "table") {
        const rows = await children(b.id);
        lines.push("<table>");
        rows.forEach(r => { if (r.type !== "table_row") return; lines.push(`<tr data-b="${r.id}">`); (r.table_row.cells || []).forEach(c => lines.push(`<td>\n${rtHtml(c)}\n</td>`)); lines.push("</tr>"); });
        lines.push("</table>");
        continue;
      }
      if (v.rich_text) lines.push(`<p>${rtHtml(v.rich_text)}</p>`);   // 用標籤包起來，讓「抬頭：」這類欄位只讀到同一行
      if (b.has_children && depth < 4 && b.type !== "child_page" && b.type !== "child_database") lines.push(await blocksText(b.id, depth + 1));
    }
    return lines.join("\n");
  }

  // ---------- 寫入：屬性 ----------
  async function updateProps(pageId, props) {
    const page = await nfetch(`/pages/${dashed(hex(pageId))}`);
    const dbId = page.parent && page.parent.database_id;
    const sch = dbId ? await schemaOf(dbId) : {};
    const out = {};
    const chunks = (s) => { const a = []; s = String(s ?? ""); for (let i = 0; i < s.length; i += 1900) a.push({ type: "text", text: { content: s.slice(i, i + 1900) } }); return a; };
    for (const [k, v] of Object.entries(props)) {
      const t = (sch[k] || page.properties[k] || {}).type;
      const list = Array.isArray(v) ? v : typeof v === "string" && v.startsWith("[") ? (() => { try { return JSON.parse(v); } catch (e) { return [v]; } })() : v == null ? [] : [v];
      switch (t) {
        case "relation": out[k] = { relation: list.map(u => ({ id: dashed(hex(u)) })).filter(x => x.id.length === 36) }; break;
        case "number": out[k] = { number: v === "" || v == null ? null : Number(v) }; break;
        case "rich_text": out[k] = { rich_text: v == null ? [] : chunks(v) }; break;
        case "title": out[k] = { title: chunks(v) }; break;
        case "url": out[k] = { url: v || null }; break;
        case "select": out[k] = { select: v ? { name: String(v) } : null }; break;
        case "multi_select": out[k] = { multi_select: list.map(n => ({ name: String(n) })) }; break;
        case "checkbox": out[k] = { checkbox: v === true || v === "__YES__" }; break;
        default: break;   // 不認得的欄位略過
      }
    }
    if (Object.keys(out).length) await nfetch(`/pages/${page.id}`, { method: "PATCH", body: { properties: out } });
    return { ok: true };
  }

  // ---------- 寫入：Call Time 表格的某幾列 ----------
  const unescH = (s) => s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&amp;/g, "&");
  function cellRich(inner) {
    const s = inner.replace(/^\s*\n|\n\s*$/g, "").replace(/<br\s*\/?>/gi, "\n");
    const out = [];
    for (const m of s.matchAll(/<b>([\s\S]*?)<\/b>|([^<]+|<(?!b>)[^>]*>)/g)) {
      if (m[1] !== undefined) { const t = unescH(m[1].replace(/<[^>]+>/g, "")); if (t) out.push({ type: "text", text: { content: t }, annotations: { bold: true } }); }
      else { const t = unescH((m[2] || "").replace(/<[^>]+>/g, "")); if (t) out.push({ type: "text", text: { content: t } }); }
    }
    return out;
  }
  async function updateContent(updates) {
    const warnings = [];
    for (const u of updates || []) {
      const id = (String(u.old_str).match(/data-b="([^"]+)"/) || [])[1];
      if (!id) { warnings.push("row not found"); continue; }
      const cells = [...String(u.new_str).matchAll(/<td[^>]*>([\s\S]*?)<\/td>/g)].map(m => cellRich(m[1]));
      try { await nfetch(`/blocks/${id}`, { method: "PATCH", body: { table_row: { cells } } }); }
      catch (e) { warnings.push(e.message); }
    }
    return { warnings };
  }

  // ---------- 模仿 Claude 的 MCP 介面 ----------
  const cache = new Map();   // key → {at, value}
  const ckey = (tool, input) => tool + "|" + JSON.stringify(input);
  async function run(server, tool, input) {
    if (server !== "Notion") throw Object.assign(new Error("此功能在獨立版不支援：" + server), { code: "server_not_connected" });
    if (!cfg.token) throw Object.assign(new Error("尚未設定 Notion 金鑰"), { code: "not_configured" });
    if (tool === "notion-query-data-sources") return queryView(input.data && input.data.view_url);
    if (tool === "notion-fetch") return { text: await blocksText(dashed(hex(input.id))) };
    if (tool === "notion-update-page") {
      if (input.command === "update_properties") return updateProps(input.page_id, input.properties || {});
      if (input.command === "update_content") return updateContent(input.content_updates);
    }
    throw Object.assign(new Error("unsupported " + tool), { code: "tool_error" });
  }
  const wrap = (value, at) => ({ payload: value, content: [{ type: "text", text: JSON.stringify(value) }], cache: { storedAt: at } });
  const mcp = {
    async callTool(server, tool, input, opts = {}) {
      const k = ckey(tool, input), c = opts && opts.cache, write = tool === "notion-update-page";
      if (!write && c && !c.refresh) {
        const hit = cache.get(k);
        if (hit && Date.now() - hit.at < (c.staleTime || 0)) return wrap(hit.value, hit.at);
      }
      const value = await run(server, tool, input);
      if (!write) cache.set(k, { at: Date.now(), value });
      return wrap(value, Date.now());
    },
    watchTool(server, tool, input, handler, opts) {
      let live = true;
      mcp.callTool(server, tool, input, opts)
        .then(result => { if (live) handler({ type: "data", result }); })
        .catch(e => { if (live) handler({ type: "error", error: { code: e.code || "tool_error", message: e.message } }); });
      return () => { live = false; };
    },
    async invalidate(server, tool) { for (const k of [...cache.keys()]) if (!tool || k.startsWith(tool + "|")) cache.delete(k); },
  };
  window.claude = { use: async (kind) => (kind === "mcp" ? mcp : null) };

  // ---------- 設定精靈用：找資料庫 ----------
  window.__tdh.findDatabases = async (token) => {
    const found = {}; let cursor = null, g = 0;
    do {
      const r = await nfetch("/search", { method: "POST", body: Object.assign({ filter: { value: "database", property: "object" }, page_size: 100 }, cursor ? { start_cursor: cursor } : {}) }, token);
      for (const d of r.results || []) {
        const name = plain(d.title).trim();
        for (const [k, want] of Object.entries(DB_NAMES)) if (name === want && !found[k]) found[k] = d.id;
      }
      cursor = r.has_more ? r.next_cursor : null;
    } while (cursor && g++ < 10);
    return found;
  };

  // ---------- 設定精靈用：幫新使用者建立四個資料庫＋一個範例案子 ----------
  window.__tdh.listPages = async (token) => {
    const r = await nfetch("/search", { method: "POST", body: { filter: { value: "page", property: "object" }, page_size: 50 } }, token);
    return (r.results || []).filter(p => p.parent && p.parent.type !== "database_id").map(p => {
      const tp = Object.values(p.properties || {}).find(x => x.type === "title");
      return { id: p.id, title: (tp ? plain(tp.title) : "") || "（未命名頁面）" };
    });
  };
  window.__tdh.createDatabases = async (token, parentId, onStep = () => {}) => {
    const T = (s) => [{ type: "text", text: { content: s } }];
    const opts = (names, color = "default") => ({ options: names.map(n => ({ name: n, color })) });
    const mk = async (title, icon, props) => (await nfetch("/databases", { method: "POST", body: { parent: { type: "page_id", page_id: parentId }, icon: { type: "emoji", emoji: icon }, title: T(title), properties: props } }, token)).id;
    onStep("建立「劇場の場館」…");
    const venue = await mk("劇場の場館", "🏛️", { "場館名稱": { title: {} }, "地區": { select: opts(["雙北地區", "桃竹苗地區", "中部地區", "南部地區", "東部地區", "海外地區"]) }, "官方網站": { url: {} }, "技術資料與圖面": { url: {} } });
    onStep("建立「劇場の劇團」…");
    const troupe = await mk("劇場の劇團", "🎭", { "劇團名稱": { title: {} }, "抬頭": { rich_text: {} }, "統編": { rich_text: {} } });
    onStep("建立「劇場のCrew」…");
    const crew = await mk("劇場のCrew", "👷", { "姓名": { title: {} }, "時段費": { number: { format: "number" } }, "時段費紀錄": { rich_text: {} }, "居住地區": { select: opts(["台北", "新北", "桃園", "台中", "台南", "高雄", "其他"]) }, "車號": { rich_text: {} } });
    onStep("建立「劇場の案子」…");
    const st = [["尚未開始", "gray"], ["等待製作確認", "gray"], ["全部完成", "default"]];
    for (let i = 1; i <= 4; i++) st.push([`全程缺${i}`, "blue"]);
    for (let i = 1; i <= 9; i++) st.push([`裝拆缺${i}`, "yellow"]);
    for (let i = 1; i <= 4; i++) st.push([`裝台缺${i}`, "green"]);
    for (let i = 1; i <= 5; i++) st.push([`拆台缺${i}`, "orange"]);
    for (let i = 1; i <= 4; i++) st.push([`裝車缺${i}`, "gray"]);
    for (let i = 1; i <= 3; i++) st.push([`卸車缺${i}`, "purple"]);
    const rel = (db) => ({ relation: { database_id: db, type: "dual_property", dual_property: {} } });
    const cases = await mk("劇場の案子", "🎪", {
      "案名": { title: {} }, "職位": { select: { options: [{ name: "TD", color: "blue" }, { name: "Crew", color: "yellow" }] } },
      "劇團": rel(troupe), "進場日期": { date: {} }, "進場地點": rel(venue), "裝車時間": { date: {} }, "裝車地點": { rich_text: {} },
      "人力分配": { rich_text: {} }, "Crew 狀態": { multi_select: { options: st.map(([name, color]) => ({ name, color })) } },
      "問過的人": rel(crew), "摳的人": rel(crew), "TD姓名": { rich_text: {} }, "TD時段費": { number: { format: "number" } }, "TD整筆費用": { number: { format: "number" } },
      "Crew時段費": { number: { format: "number" } }, "前置": { rich_text: {} }, "前置段數": { number: { format: "number" } }, "打卡": { rich_text: {} },
      "時段表資料夾": { url: {} }, "巡演": { select: { options: [] } },
    });
    // 把另一邊自動產生的關聯欄位改成好懂的名字
    onStep("整理關聯欄位…");
    const cs = (await nfetch(`/databases/${cases}`, {}, token)).properties;
    const renameBack = async (db, prop, name) => {
      const d = cs[prop] && cs[prop].relation && cs[prop].relation.dual_property;
      if (d && d.synced_property_id) await nfetch(`/databases/${db}`, { method: "PATCH", body: { properties: { [d.synced_property_id]: { name } } } }, token).catch(() => {});
    };
    await renameBack(troupe, "劇團", "劇場の案子"); await renameBack(venue, "進場地點", "劇場の案子");
    await renameBack(crew, "問過的人", "問過的案子"); await renameBack(crew, "摳的人", "做過的案子");
    // 範例案子（可以複製這頁當範本）
    onStep("建立範例案子…");
    const today = new Date(), d0 = new Date(today); d0.setDate(today.getDate() + 14);
    const d1 = new Date(d0); d1.setDate(d0.getDate() + 4); const dl = new Date(d0); dl.setDate(d0.getDate() - 1);
    const callout = (s, emoji) => ({ object: "block", type: "callout", callout: { rich_text: [{ type: "text", text: { content: s }, annotations: { bold: true } }], icon: { type: "emoji", emoji }, color: "gray_background" } });
    const row = (a, b) => ({ type: "table_row", table_row: { cells: [[{ type: "text", text: { content: a }, annotations: { bold: true } }], b ? [{ type: "text", text: { content: b } }] : []] } });
    const rows = [row("裝車", "")].concat([1, 2, 3, 4, 5].map(i => row(`Day ${i}`, ""))).concat([row("拆台", ""), row("卸車", "")]);
    await nfetch("/pages", { method: "POST", body: {
      parent: { database_id: cases }, icon: { type: "emoji", emoji: "📋" },
      properties: { "案名": { title: T("（範例）複製這頁當新案子") }, "職位": { select: { name: "TD" } },
        "進場日期": { date: { start: isoDay(d0), end: isoDay(d1) } }, "裝車時間": { date: { start: isoDay(dl) } },
        "人力分配": { rich_text: T("全程2、裝拆2") }, "Crew 狀態": { multi_select: [{ name: "全程缺2" }, { name: "裝拆缺2" }] } },
      children: [
        { object: "block", type: "column_list", column_list: { children: [
          { object: "block", type: "column", column: { children: [callout("抬頭：\n統編：", "🧾"), callout("採購清單", "🛒"), { object: "block", type: "to_do", to_do: { rich_text: [] } }, callout("工具清單", "🔧"), { object: "block", type: "to_do", to_do: { rich_text: [] } }] } },
          { object: "block", type: "column", column: { children: [callout("地址：\n姓名：\n電話：", "✉️"), callout("舞台組人員 Call Time", "⏰"),
            { object: "block", type: "table", table: { table_width: 2, has_column_header: false, has_row_header: false, children: rows } }] } },
        ] } },
      ] } }, token);
    return { cases, crew, troupe, venue };
  };
  window.__tdh.DB_NAMES = DB_NAMES;
})();

</script>
<script>
// 劇場TD小幫手｜把時段表直接做成 Excel 檔（.xlsx），不需要任何外部套件。
// 輸入：sheets = [{name, rows}]（值可以是文字、數字、或以 = 開頭的公式），reqs = Google 試算表格式指令（網頁原本就會產生）。
(() => {
  // ---------- 小型 zip（不壓縮） ----------
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = (u8) => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zip(files) {
    const enc = new TextEncoder(), parts = [], central = []; let off = 0;
    for (const [name, text] of files) {
      const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
      h.setUint16(26, nb.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), nb, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, nb.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), nb);
      off += 30 + nb.length + data.length;
    }
    const csize = central.reduce((a, b) => a + b.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
    return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }

  const X = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const colL = (n) => { let s = ""; n++; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const argb = (c) => { if (!c) return null; const h = (v) => Math.round((v || 0) * 255).toString(16).padStart(2, "0").toUpperCase(); return "FF" + h(c.red) + h(c.green) + h(c.blue); };
  const colorOf = (cs) => cs && (cs.rgbColor || cs);

  function build(sheetsIn, reqs) {
    // 每張表：cells[r][c] = {v, st:{...}}
    const sheets = sheetsIn.map((s, i) => ({ name: s.name, id: i, rows: s.rows, st: {}, merges: [], cols: {}, rowsH: {}, freeze: 0, grid: true }));
    const byId = (id) => sheets[id] || sheets[0];
    const cellSt = (sh, r, c) => { const k = r + "," + c; return sh.st[k] || (sh.st[k] = {}); };
    const each = (rg, fn) => { const sh = byId(rg.sheetId); for (let r = rg.startRowIndex; r < rg.endRowIndex; r++) for (let c = rg.startColumnIndex; c < rg.endColumnIndex; c++) fn(cellSt(sh, r, c), r, c, sh); };
    for (const q of reqs || []) {
      if (q.repeatCell) {
        const f = (q.repeatCell.cell || {}).userEnteredFormat || {}, fields = q.repeatCell.fields.split(",").map(x => x.replace("userEnteredFormat.", ""));
        each(q.repeatCell.range, (st) => {
          for (const fd of fields) {
            if (fd === "horizontalAlignment") st.h = f.horizontalAlignment;
            else if (fd === "verticalAlignment") st.v = f.verticalAlignment;
            else if (fd === "wrapStrategy") st.wrap = f.wrapStrategy === "WRAP";
            else if (fd === "backgroundColorStyle" || fd === "backgroundColor") st.bg = argb(colorOf(f.backgroundColorStyle || f.backgroundColor));
            else if (fd === "numberFormat") st.num = f.numberFormat && f.numberFormat.pattern;
            else if (fd.startsWith("textFormat")) { const t = f.textFormat || {}; st.font = { b: !!t.bold, sz: t.fontSize || 11, name: t.fontFamily || "Arial", color: argb(colorOf(t.foregroundColorStyle || t.foregroundColor)) }; }
          }
        });
      } else if (q.mergeCells) {
        const rg = q.mergeCells.range; byId(rg.sheetId).merges.push(rg);
      } else if (q.updateBorders) {
        const b = q.updateBorders, rg = b.range;
        const kind = (x) => x && (x.style === "SOLID_MEDIUM" ? "medium" : x.style === "SOLID_THICK" ? "thick" : x.style === "NONE" ? null : "thin");
        each(rg, (st, r, c, sh) => {
          st.bd = st.bd || {};
          const set = (side, x) => { if (x) st.bd[side] = kind(x); };
          if (r === rg.startRowIndex) set("top", b.top); else set("top", b.innerHorizontal);
          if (r === rg.endRowIndex - 1) set("bottom", b.bottom); else set("bottom", b.innerHorizontal);
          if (c === rg.startColumnIndex) set("left", b.left); else set("left", b.innerVertical);
          if (c === rg.endColumnIndex - 1) set("right", b.right); else set("right", b.innerVertical);
          // 讓相鄰格子的那一邊也一致
          if (r === rg.startRowIndex && b.top && r > 0) { const o = cellSt(sh, r - 1, c); o.bd = o.bd || {}; o.bd.bottom = kind(b.top); }
          if (r === rg.endRowIndex - 1 && b.bottom) { const o = cellSt(sh, r + 1, c); o.bd = o.bd || {}; o.bd.top = kind(b.bottom); }
          if (c === rg.startColumnIndex && b.left && c > 0) { const o = cellSt(sh, r, c - 1); o.bd = o.bd || {}; o.bd.right = kind(b.left); }
        });
      } else if (q.updateDimensionProperties) {
        const d = q.updateDimensionProperties, rg = d.range, sh = byId(rg.sheetId), px = d.properties.pixelSize;
        for (let i = rg.startIndex; i < rg.endIndex; i++) { if (rg.dimension === "COLUMNS") sh.cols[i] = px; else sh.rowsH[i] = px; }
      } else if (q.updateSheetProperties) {
        const p = q.updateSheetProperties.properties, sh = byId(p.sheetId), g = p.gridProperties || {};
        if (g.frozenRowCount !== undefined) sh.freeze = g.frozenRowCount;
        if (g.hideGridlines !== undefined) sh.grid = !g.hideGridlines;
      }
    }

    // ---------- styles ----------
    const fonts = ['<font><sz val="11"/><name val="Arial"/></font>'], fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'], borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>'], numFmts = [], xfs = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
    const idx = (arr, s) => { let i = arr.indexOf(s); if (i < 0) { arr.push(s); i = arr.length - 1; } return i; };
    const xfMap = {};
    function xfOf(st) {
      const key = JSON.stringify(st); if (xfMap[key] !== undefined) return xfMap[key];
      const f = st.font || { b: false, sz: 11, name: "Arial" };
      const fontId = idx(fonts, `<font>${f.b ? "<b/>" : ""}<sz val="${f.sz}"/>${f.color ? `<color rgb="${f.color}"/>` : ""}<name val="${X(f.name)}"/></font>`);
      const fillId = st.bg ? idx(fills, `<fill><patternFill patternType="solid"><fgColor rgb="${st.bg}"/><bgColor indexed="64"/></patternFill></fill>`) : 0;
      const bd = st.bd || {}, side = (s) => bd[s] ? `<${s} style="${bd[s]}"><color rgb="FF000000"/></${s}>` : `<${s}/>`;
      const borderId = idx(borders, `<border>${side("left")}${side("right")}${side("top")}${side("bottom")}<diagonal/></border>`);
      let numFmtId = 0;
      if (st.num) { const builtin = { "0.00": 2, "#,##0": 3, "0": 1 }[st.num]; numFmtId = builtin ?? (164 + idx(numFmts, st.num)); }
      const H = { LEFT: "left", CENTER: "center", RIGHT: "right" }[st.h], V = { TOP: "top", MIDDLE: "center", BOTTOM: "bottom" }[st.v];
      const al = (H || V || st.wrap) ? `<alignment${H ? ` horizontal="${H}"` : ""}${V ? ` vertical="${V}"` : ""}${st.wrap ? ' wrapText="1"' : ""}/>` : "";
      const xf = `<xf numFmtId="${numFmtId}" fontId="${fontId}" fillId="${fillId}" borderId="${borderId}" xfId="0" applyFont="1" applyFill="1" applyBorder="1"${numFmtId ? ' applyNumberFormat="1"' : ""}${al ? ' applyAlignment="1">' + al + "</xf>" : "/>"}`;
      xfMap[key] = idx(xfs, xf); return xfMap[key];
    }

    const sheetXml = sheets.map(sh => {
      let maxR = sh.rows.length, maxC = Math.max(1, ...sh.rows.map(r => r.length));
      for (const k of Object.keys(sh.st)) { const [r, c] = k.split(",").map(Number); maxR = Math.max(maxR, r + 1); maxC = Math.max(maxC, c + 1); }
      const cols = Object.keys(sh.cols).length ? "<cols>" + Object.entries(sh.cols).sort((a, b) => a[0] - b[0]).map(([i, px]) => `<col min="${+i + 1}" max="${+i + 1}" width="${Math.max(1, (px - 5) / 7).toFixed(2)}" customWidth="1"/>`).join("") + "</cols>" : "";
      let data = "";
      for (let r = 0; r < maxR; r++) {
        const row = sh.rows[r] || [];
        let cells = "";
        for (let c = 0; c < maxC; c++) {
          const v = row[c], st = sh.st[r + "," + c];
          if ((v === undefined || v === null || v === "") && !st) continue;
          const ref = colL(c) + (r + 1), s = st ? ` s="${xfOf(st)}"` : "";
          if (v === undefined || v === null || v === "") cells += `<c r="${ref}"${s}/>`;
          else if (typeof v === "number" && isFinite(v)) cells += `<c r="${ref}"${s}><v>${v}</v></c>`;
          else if (typeof v === "string" && v.startsWith("=")) cells += `<c r="${ref}"${s}><f>${X(v.slice(1))}</f></c>`;
          else if (typeof v === "string" && /^-?\d+(\.\d+)?$/.test(v.trim()) && v.trim().length < 15) cells += `<c r="${ref}"${s}><v>${Number(v)}</v></c>`;
          else cells += `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${X(v)}</t></is></c>`;
        }
        const ht = sh.rowsH[r] ? ` ht="${(sh.rowsH[r] * 0.75).toFixed(2)}" customHeight="1"` : "";
        if (cells || ht) data += `<row r="${r + 1}"${ht}>${cells}</row>`;
      }
      const merges = sh.merges.length ? `<mergeCells count="${sh.merges.length}">` + sh.merges.map(m => `<mergeCell ref="${colL(m.startColumnIndex)}${m.startRowIndex + 1}:${colL(m.endColumnIndex - 1)}${m.endRowIndex}"/>`).join("") + "</mergeCells>" : "";
      const pane = sh.freeze ? `<pane ySplit="${sh.freeze}" topLeftCell="A${sh.freeze + 1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/>` : "";
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"${sh.grid ? "" : ' showGridLines="0"'}${sh.id === 0 ? ' tabSelected="1"' : ""}>${pane}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols}<sheetData>${data}</sheetData>${merges}<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/></worksheet>`;
    });

    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${numFmts.length ? `<numFmts count="${numFmts.length}">` + numFmts.map((f, i) => `<numFmt numFmtId="${164 + i}" formatCode="${X(f)}"/>`).join("") + "</numFmts>" : ""}<fonts count="${fonts.length}">${fonts.join("")}</fonts><fills count="${fills.length}">${fills.join("")}</fills><borders count="${borders.length}">${borders.join("")}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.join("")}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
    const wb = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>${sheets.map((s, i) => `<sheet name="${X(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`;
    const wbRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
    const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
    const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
    return zip([["[Content_Types].xml", ct], ["_rels/.rels", rels], ["xl/workbook.xml", wb], ["xl/_rels/workbook.xml.rels", wbRels], ["xl/styles.xml", styles], ...sheetXml.map((x, i) => [`xl/worksheets/sheet${i + 1}.xml`, x])]);
  }

  async function save(blob, filename) {
    const file = new File([blob], filename, { type: blob.type });
    // 手機：優先用分享選單（可以存到檔案、傳 LINE）
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
      try { await navigator.share({ files: [file], title: filename }); return "shared"; } catch (e) { if (e && e.name === "AbortError") return "cancelled"; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    return "downloaded";
  }

  window.__tdh = window.__tdh || {};
  window.__tdh.xlsx = (sheets, reqs) => build(sheets, reqs);
  window.__tdh.saveFile = save;
})();

</script>
<script>
// 劇場TD小幫手｜第一次設定（Notion 金鑰、找資料庫、預設 TD）
(() => {

  const css = `
  .tdh-ov{position:fixed;inset:0;z-index:9999;background:#f4f1ea;overflow:auto;-webkit-overflow-scrolling:touch;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#1d1b18}

  `;
  const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);

  function open(force) {
    if (document.querySelector(".tdh-ov")) return;
    const c = T.cfg, ov = document.createElement("div"); ov.className = "tdh-ov";
    ov.innerHTML = `<div class="tdh-in">

      <div class="tdh-st"><h2><b>1</b>建立 Notion 連線金鑰</h2><ol>
        <li>按下面按鈕打開 Notion 的「開發人員連接」頁面（手機請用瀏覽器開）</li>
        <li>按「＋ 新連接」：名稱填「劇場TD小幫手」，驗證方式選「API 權杖」，按「建立連接」</li>
        <li>點進剛建立的連接，找到「API 權杖」→ 複製（開頭是 ntn_）</li></ol>
        <a class="btn" href="https://www.notion.so/profile/integrations" target="_blank" rel="noopener">打開 Notion 開發人員連接</a></div>
      <div class="tdh-st"><h2><b>2</b>讓金鑰可以看到你的資料庫</h2><ol>

        <li>或：在 Notion 打開那一頁，右上角「⋯」→「連線」→ 選「劇場TD小幫手」</li>

      <div class="tdh-st"><h2><b>3</b>貼上金鑰</h2>
        <input id="tdhTok" type="password" autocomplete="off" placeholder="ntn_ 開頭的一串字" value="${c.token ? c.token.replace(/"/g, "") : ""}">

      <div style="font-size:12px;color:#8a847a;line-height:1.6;margin-top:8px">金鑰只存在這支手機的瀏覽器裡，資料直接在你的 Notion 讀寫，不會存到別的地方。</div>

          try {
            found = await T.createDatabases(tok, pg.id, (m) => { const x = $("tdhStepMsg"); if (x) x.textContent = m; });
            box.innerHTML = Object.values(T.DB_NAMES).map(n => `<div class="ok">✓ 已建立 ${n}</div>`).join("") + `<div style="margin-top:6px;color:#6e685f">也建了一個「（範例）」案子，之後新案子可以複製那一頁。</div>`;
            $("tdhStep4").style.display = "";
          } catch (e) { $("tdhErr").textContent = "建立失敗：" + (e.message || e); }
        });
      } catch (e) { $("tdhErr").textContent = "讀取頁面失敗：" + (e.message || e); }
    }
    $("tdhSave").onclick = () => {
      T.setCfg({ db: found, tdName: $("tdhTd").value.trim() });
      location.reload();
    };
    if ($("tdhClose")) $("tdhClose").onclick = () => ov.remove();
    if ($("tdhOut")) $("tdhOut").onclick = () => { if (confirm("確定要清除這支手機上的 Notion 金鑰？")) { localStorage.removeItem("tdh.settings.v1"); location.reload(); } };
  }

  document.addEventListener("DOMContentLoaded", () => {
    const g = document.createElement("button"); g.className = "tdh-gear"; g.textContent = "⚙︎"; g.title = "設定";
    g.onclick = () => open(true);
    const modes = document.querySelector(".modes");
    if (modes) modes.appendChild(g); else { g.style.cssText = "position:fixed;right:10px;top:10px;z-index:50"; document.body.appendChild(g); }
    if (need()) open(false);
  });
})();

</script>

<script>
(() => {
  const SERVER = "Notion";
  const TOOL = "notion-query-data-sources";
  const DS_CASES = "collection://unused";
  const DS_VENUES = "collection://unused";

  // Saved-view reads: not counted against Notion's hourly SQL/rows query allowance.
  const viewInput = (v, cursor) => ({ data: Object.assign(
    { mode: "view", view_url: v, page_size: 100 }, cursor ? { start_cursor: cursor } : {}) });
  const VIEW_CASES = "view://NEED";   // 劇場の案子 →「缺人」
  const VIEW_VENUES = "view://VENUE";  // 劇場の場館 →「地區」
  const VIEW_TROUPES = "view://TROUPE"; // 劇場の劇團 → Default view
  const CASES_INPUT = viewInput(VIEW_CASES);
  const VENUES_INPUT = viewInput(VIEW_VENUES);
  const TROUPES_INPUT = viewInput(VIEW_TROUPES);

  const $ = (id) => document.getElementById(id);
  let cases = null, venues = null, troupes = null, casesAt = null;
  let errorState = null;
  let filter = "all";
  const selected = new Set();
  let items = [];

  // ---------- helpers ----------
  const unesc = (s) => String(s ?? "").replace(/\\(.)/g, "$1");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const arr = (v) => {
    if (Array.isArray(v)) return v;
    if (typeof v === "string" && v.trim().startsWith("[")) { try { return JSON.parse(v); } catch (e) {} }
    return [];
  };
  const idOf = (u) => { const m = String(u).replace(/-/g, "").match(/[0-9a-f]{32}/i); return m ? m[0].toLowerCase() : ""; };
  const pd = (s) => {
    if (!s) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
    const t = new Date(String(s).replace(" ", "T"));
    return isNaN(t) ? null : t;
  };
  const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
  const wk = (d) => "日一二三四五六"[d.getDay()];
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const zh = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7 };

  function rowsOf(result) {
    let p = result && result.payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) {} }
    if (p && Array.isArray(p.results)) return p.results;
    for (const b of (result && result.content) || []) {
      if (b.type === "text") { try { const j = JSON.parse(b.text); if (j && Array.isArray(j.results)) return j.results; } catch (e) {} }
    }
    throw new Error("unexpected_shape");
  }

  // ---------- message building (mirrors the Notion formulas) ----------
  function build() {
    const venueName = {};
    (venues || []).forEach(v => { venueName[idOf(v.url)] = unesc(v["場館名稱"]); });
    const troupeName = {};
    (troupes || []).forEach(t => { troupeName[idOf(t.url)] = unesc(t["劇團名稱"]); });
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const out = [];

    (cases || []).forEach(r => {
      const st = arr(r["Crew 狀態"]);
      const start = pd(r["date:進場日期:start"]);
      if (!start) return;
      const end = pd(r["date:進場日期:end"]) || start;
      if (end < today) return;

      const troupe = arr(r["劇團"]).map(u => troupeName[idOf(u)]).filter(Boolean).join("、");
      const title = unesc(r["案名"] || "");
      const header = `${troupe}《${title.split("_")[0]}》` + (/tryout/i.test(title) ? "Tryout" : "");
      const dw = (d) => `${md(d)}(${wk(d)})`;
      const same = (a, b) => a.toDateString() === b.toDateString();
      const plan = unesc(r["人力分配"] || "").trim();
      const td = tdOverride[idOf(r.url)] ?? (unesc(r["TD姓名"] || "").trim() || window.TDN());
      const cid = idOf(r.url), tour = String(r["巡演"] || "").trim();
      if (!asked[cid]) asked[cid] = new Set(arr(r["問過的人"]).map(idOf));
      if (!booked[cid]) booked[cid] = new Set(arr(r["摳的人"]).map(idOf));
      const vIds = arr(r["進場地點"]).map(idOf);
      const vNames = vIds.map(id => venueName[id]).filter(Boolean);
      const venue = vNames.length ? vNames.join("、") : (vIds.length && !venues ? "（地點讀取中）" : "地點待定");

      const whole = st.filter(s => /^(全程缺|整週缺|尚未開始|等待製作確認)/.test(s));
      if (whole.length) {
        let t = `${header}\n${same(start, end) ? dw(start) : `${dw(start)} - ${dw(end)}`}\n@${venue}`;
        const load = pd(r["date:裝車時間:start"]);
        if (load) t += `\n保留${md(load)}(${wk(load)})裝車`;
        out.push({ key: r.url + "#w", kind: "全程", tags: whole, title, header, td, url: r.url, cid, tour, venue, load: pd(r["date:裝車時間:start"]), start, end, plan, text: t });
      }

      const ss = st.filter(s => /^(裝拆|裝台|拆台)缺/.test(s));
      if (ss.length) {
        const needSet = ss.some(s => /^(裝拆|裝台)/.test(s));
        const needStrike = ss.some(s => /^(裝拆|拆台)/.test(s));
        const m = String(r["人力分配"] || "").match(/裝台?([0-9一二三四五六七]+)天/);
        const n = m ? (zh[m[1]] || parseInt(m[1], 10) || 1) : 1;
        const setEnd = addDays(start, n - 1);
        const lines = [header];
        if (needSet) lines.push(n === 1 ? `${dw(start)}裝台` : `${dw(start)} - ${dw(setEnd)}裝台${n}天`);
        if (needStrike) lines.push(needSet ? `${dw(end)}拆台` : `${dw(end)} 拆台`);
        lines.push(`@${venue}`);
        out.push({ key: r.url + "#s", kind: "裝拆", tags: ss, title, header, td, url: r.url, cid, tour, venue, load: pd(r["date:裝車時間:start"]), start, end, setEnd, needSet, needStrike, plan, text: lines.join("\n") });
      }

      const lc = st.filter(s => /^裝車缺/.test(s));
      if (lc.length) {
        const ls = r["date:裝車時間:start"];
        const load = pd(ls);
        const hasTime = Number(r["date:裝車時間:is_datetime"]) === 1;
        const place = unesc(r["裝車地點"] || "").trim() || "地點待定";
        let when = "裝車時間待定";
        if (load) {
          const hm = hasTime ? `${load.getHours()}:${String(load.getMinutes()).padStart(2, "0")}` : "";
          when = `${md(load)}(${wk(load)})${hm} 裝車`;
        }
        out.push({ key: r.url + "#l", kind: "裝車", tags: lc, title, header, td, url: r.url, cid, tour, venue, load: pd(r["date:裝車時間:start"]), start: load || start, caseStart: start, end, plan,
          text: `${header}\n${when}\n@${place}` });
      }
    });
    const ord = { "全程": 0, "裝車": 1, "裝拆": 2 };
    out.sort((a, b) => a.start - b.start || ord[a.kind] - ord[b.kind]);
    return out;
  }

  // ---------- render ----------
  function render() {
    const list = $("list");
    if (errorState && !cases) { list.innerHTML = errorState; return; }
    if (!cases) { list.innerHTML = `<div class="state">讀取中…</div>`; return; }

    items = build();
    const keys = new Set(items.map(i => i.key));
    [...selected].forEach(k => { if (!keys.has(k)) selected.delete(k); });

    const shown = items.filter(i => filter === "all" || i.kind === filter);
    if (!shown.length) {
      list.innerHTML = `<div class="state">${filter === "all" ? "目前沒有缺人的案子 🎉" : `沒有「${filter}」缺人的案子`}</div>`;
    } else {
      list.innerHTML = "";
      shown.forEach(i => {
        const c = document.createElement("div");
        c.className = "card" + (selected.has(i.key) ? " sel" : "");
        c.innerHTML = `<div class="check"></div>
          <div class="meta">${i.tags.map(t => `<span class="tag ${i.kind === "全程" ? "w" : i.kind === "裝車" ? "l" : "s"}">${t}</span>`).join("")}
          <span class="case"></span></div><pre></pre><div class="info"></div>
          <div class="cardBtns"><button class="tblBtn">看表格</button><button class="bookBar"></button></div>`;
        c.querySelector(".case").textContent = i.title;
        c.querySelector("pre").textContent = i.text;
        fillInfo(c.querySelector(".info"), i);
        fillBook(c.querySelector(".bookBar"), i);
        loadCrew(i.url);
        c.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;
          if (e.target.closest(".askBtn")) { e.stopPropagation(); openAsk(i); return; }
          if (e.target.closest(".bookBar")) { e.stopPropagation(); openBook(i); return; }
          if (e.target.closest(".tblBtn")) { e.stopPropagation(); openTable(i); return; }
          if (e.target.closest(".infoTog")) { e.stopPropagation(); openInfo.has(i.key) ? openInfo.delete(i.key) : openInfo.add(i.key); fillInfo(c.querySelector(".info"), i); return; }
          selected.has(i.key) ? selected.delete(i.key) : selected.add(i.key);
          render();
        });
        list.appendChild(c);
      });
    }
    if (errorState) list.insertAdjacentHTML("afterbegin", errorState);
    if (!crewDirState && mcpRef && Object.values(asked).some(s => s.size)) loadCrewDir().catch(() => {});
    updateBar(shown);
  }

  function updateBar(shown) {
    const n = selected.size;
    $("count").innerHTML = n ? `已選 <b>${n}</b> 則` : "點卡片勾選";
    $("copy").disabled = !n;
    $("clear").hidden = !n;
    const allOn = shown.length && shown.every(i => selected.has(i.key));
    $("all").textContent = allOn ? "取消全選" : "全選";
  }

  function setFresh(result) {
    const at = result && result.cache ? result.cache.storedAt : Date.now();
    casesAt = new Date(at);
    $("fresh").textContent = `資料更新於 ${casesAt.getHours()}:${String(casesAt.getMinutes()).padStart(2, "0")}・來自「劇場の案子」`;
  }


  // ---------- crew from page body table ----------
  const crew = {};
  const splitNames = (s) => unesc(s).replace(/<[^>]+>/g, " ")
    .split(/[、,，\/\s]+/).map(x => x.trim()).filter(x => x && !/^[xX×\-－—]$/.test(x) && !/不留|無人|待定|未定|^無$/.test(x));
  function parseCrew(text) {
    const rows = [];
    for (const m of String(text).matchAll(/<tr[^>]*>([\s\S]*?)<\/tr>/g)) {
      const cells = [...m[1].matchAll(/<td[^>]*>([\s\S]*?)<\/td>/g)].map(x => x[1]);
      if (cells.length < 2) continue;
      const label = unesc(cells[0].replace(/<[^>]+>/g, "")).trim();
      rows.push({ label, names: splitNames(cells.slice(1).join(" ")) });
    }
    if (!rows.length) return { status: "none" };
    const days = rows.filter(r => !/裝車|拆台|卸車/.test(r.label) && r.names.length);
    const strike = rows.filter(r => /拆台/.test(r.label));
    const loadRow = rows.filter(r => /裝車/.test(r.label));
    let whole = days.length ? days[0].names.slice() : [];
    days.slice(1).forEach(d => { whole = whole.filter(n => d.names.includes(n)); });
    const set = new Set();
    days.concat(strike).forEach(d => d.names.forEach(n => { if (!whole.includes(n)) set.add(n); }));
    const loaders = [...new Set(loadRow.flatMap(r => r.names))];
    return { status: "ok", whole, part: [...set], loaders };
  }
  function loadCrew(url) {
    if (crew[url] || !mcpRef) return;
    crew[url] = { status: "loading" };
    mcpRef.callTool(SERVER, "notion-fetch", { id: url }, { cache: { staleTime: 300000, gcTime: 86400000 } })
      .then(r => {
        const p = payloadOf(r);
        let text = typeof p === "string" ? p : (p.text || "");
        if (!text) text = ((r.content || []).find(b => b.type === "text") || {}).text || "";
        crew[url] = parseCrew(text);
      })
      .catch(e => { crew[url] = { status: "err", code: e && e.code }; })
      .then(() => render());
  }
  const openInfo = new Set();
  const list = (a) => a.length ? `${a.join("、")}（${a.length}）` : "—";
  function fillInfo(el, i) {
    const esc = (s) => String(s).replace(/[&<>]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
    let html = `<div class="planrow"><b>人力分配</b>　<span>${i.plan ? esc(i.plan) : "—"}</span></div>`;
    el.innerHTML = html;
  }
  // 卡片最下面：確定人選（Call Time 表格裡已經排的人）
  function fillBook(el, i) {
    el.innerHTML = `<div class="bk-h"><span>加入 / 編輯</span><i>›</i></div>`;
  }

  // ---------- 問過的人 ----------
  const asked = {}, booked = {};
  const crewDir = {};
  let crewDirState = null;
  const V_CREW_DIR = "view://CREW";
  // 「摳的人」次數要看所有案子：TD、已完成、缺人三個 view
  const V_BOOK_VIEWS = ["view://TD", "view://DONE", VIEW_CASES];
  async function readAllRows(view) {
    const rows = []; let cursor = null, g = 0;
    do {
      const r = await mcpRef.callTool(SERVER, TOOL, { data: Object.assign({ mode: "view", view_url: view, page_size: 100 }, cursor ? { start_cursor: cursor } : {}) }, { cache: { staleTime: 600000, gcTime: 86400000 } });
      const p = payloadOf(r);
      rows.push(...(p.results || []));
      cursor = p.has_more ? p.next_cursor : null;
    } while (cursor && g++ < 30);
    return rows;
  }
  async function loadCrewDir() {
    if (crewDirState) return crewDirState;
    crewDirState = (async () => {
      const [dir, ...caseLists] = await Promise.all([readAllRows(V_CREW_DIR)].concat(V_BOOK_VIEWS.map(v => readAllRows(v).catch(() => []))));
      dir.forEach(x => { crewDir[idOf(x.url)] = { id: idOf(x.url), url: x.url, name: unesc(x["姓名"] || "").trim(), lvl: (String(x["活躍程度"] || "").match(/🌕/g) || []).length, area: x["居住地區"] || "", booked: 0 }; });
      const seen = new Set();
      caseLists.flat().forEach(r => {
        const cid = idOf(r.url); if (seen.has(cid)) return; seen.add(cid);
        arr(r["摳的人"]).map(idOf).forEach(id => { if (crewDir[id]) crewDir[id].booked++; });
      });
      render();
    })().catch(e => { crewDirState = null; throw e; });
    return crewDirState;
  }
  let askTimer;
  function saveAsked(i) {
    clearTimeout(askTimer);
    askTimer = setTimeout(async () => {
      const urls = [...asked[i.cid]].map(id => (crewDir[id] || {}).url).filter(Boolean);
      try {
        await mcpRef.callTool(SERVER, "notion-update-page", { page_id: i.cid, command: "update_properties", properties: { "問過的人": urls }, allow_async: false }, { cache: false });
        toast("已記錄到 Notion");
      } catch (e) { toast("儲存失敗，請稍後再試"); }
    }, 700);
  }
  // ---------- 確認可以：寫進「摳的人」和內文的 Call Time 表格 ----------
  const pageText = {}, tdOverride = {};
  async function fetchPageText(url) {
    const r = await mcpRef.callTool(SERVER, "notion-fetch", { id: url }, { cache: false });
    const p = payloadOf(r);
    let text = typeof p === "string" ? p : (p.text || "");
    if (!text) text = ((r.content || []).find(b => b.type === "text") || {}).text || "";
    return text;
  }
  // 每一站的 Call Time 表格放在各自的頁面（巡演也一樣）
  const tsrcCache = {};
  async function tableSrc(i) { return { url: i.url, cid: i.cid, multi: false }; }
  const stopRows = (rows) => rows;
  async function stopText(i) { return fetchPageText((await tableSrc(i)).url); }
  function tableRows(text, i) {
    const base = i.caseStart || i.start;
    const rows = [];
    for (const m of String(text).matchAll(/<tr[^>]*>[\s\S]*?<\/tr>/g)) {
      const raw = m[0];
      const tds = [...raw.matchAll(/<td[^>]*>([\s\S]*?)<\/td>/g)];
      if (tds.length < 2) continue;
      const label = unesc(tds[0][1].replace(/<[^>]+>/g, "")).trim();
      const labelRaw = tds[0][0];
      const cellRaw = tds[1][0], inner = tds[1][1];
      const plain = unesc(inner.replace(/<[^>]+>/g, " ")).trim();
      const names = splitNames(inner);
      const isX = !names.length && /^[xX×]$|不留|無人/.test(plain);
      let date = null;
      const dm = label.match(/(\d{1,2})\/(\d{1,2})/);
      if (dm && base) { date = new Date(base.getFullYear(), +dm[1] - 1, +dm[2]); if (date - base < -200 * 864e5) date.setFullYear(date.getFullYear() + 1); }
      const dn = label.match(/Day\s*(\d+)/i);
      if (!date && dn && base) date = addDays(base, +dn[1] - 1);
      const type = /裝車/.test(label) ? "load" : /卸車/.test(label) ? "unload" : /拆台/.test(label) ? "strike" : date ? "day" : "other";
      const range = /\d{1,2}\/\d{1,2}[^\d]*[-–~～至][^\d]*\d{1,2}\/\d{1,2}/.test(label);
      const dateLabel = date ? `${date.getMonth() + 1}/${date.getDate()} (${wk(date)})` : "";
      const needLabel = type === "day" && !range && (/^Day\s*\d+$/i.test(label) || /^\d{1,2}\/\d{1,2}$/.test(label));
      const show = needLabel ? dateLabel : label;
      rows.push({ raw, labelRaw, cellRaw, inner, label, show, needLabel, dateLabel, names, plain, isX, date, type, range });
    }
    return rows;

  function defaultRows(rows, i, opt) {

  }
  const mealSeg = (key, val, cls, withInherit) => {
    const opts = (withInherit ? [[null, "同你"]] : []).concat(MEAL_OPTS);
    return `<div class="meal"><span>${key}餐</span><div class="segc">${opts.map(([v, l]) =>

  };
  let ptab = "punch", scrolledFor = null, clearArm = null, phase = "live";
  const PHASE_TABS = { live: [["punch", "每日打卡"], ["shot", "截圖"]], close: [["crew", "時段費"], ["sheet", "時段表"], ["give", "給 Crew"]] };
  const todayD = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
  function dayState(d) {
    if (d.off) return "off";
    const done = !!(d.off || d.slot || (d.tin && d.tout)), t = todayD(), same = d.date.getTime() === t.getTime();
    if (same) return done ? "today done" : "today";
    if (done) return "done";
    return d.date < t ? "miss" : "future";
  }
  const IN_OPTS = ["0900", "0930", "1000", "1100", "1200"], OUT_OPTS = ["2100", "2130", "2200"];
  const quick = (cur, opts, cls) => `<div class="qp">${opts.map(t => `<button class="${cls} ${cur === t ? "on" : ""}" data-t="${t}">${t}</button>`).join("")}</div>`;
  const STATE_PILL = { "off": "沒上班", "today": "今天", "today done": "今天・已填", "done": "打卡完成", "miss": "未填", "future": "還沒打卡" };

  function render() {
    const root = $("punchBody"); if (!root) return;
    if (!mcp) { root.innerHTML = `<div class="state">還沒設定 Notion，請按上方的 ⚙︎ 設定。</div>`; return; }
    if (!loaded) { root.innerHTML = `<div class="state">讀取中…</div>`; return; }
    const sel = $("caseSel");
    sel.innerHTML = cases.slice().sort((a, b) => b.start - a.start)
      .map(c => `<option value="${c.id}" ${c.id === caseId ? "selected" : ""}>${esc(c.title)}・${md(c.start)}${c.end > c.start ? "-" + md(c.end) : ""}</option>`).join("");
    const c = cases.find(x => x.id === caseId);
    if (!c) { root.innerHTML = `<div class="state">沒有可打卡的案子</div>`; return; }
    TD_NAME = c.tdName || DEFAULT_TD;
    loadTable(c);
    const rec = recOf(c); LATE = rec.late;
    const tmap = tableMap(c), t = tables[tsrc(c).id];

    const done = rec.days.filter(d => tdSeg(d) !== null);
    const daySum = done.reduce((s, d) => s + tdSeg(d), 0);
    const total = daySum + (c.prepSeg || 0);
    $("pSum").innerHTML = `<div class="sum"><div><div class="sum-l">我目前累積</div><div class="sum-n">${fmtSeg(total)}<small> 段</small></div></div>
      <div class="sum-r">進場 ${fmtSeg(daySum)} 段（${done.length}/${rec.days.length} 天）<br>前置 ${fmtSeg(c.prepSeg || 0)} 段
      ${c.tdFlat ? `<br>整筆 $${money(c.tdFlat)}` : c.tdRate ? `<br>約 $${money(total * c.tdRate)}` : ""}</div></div>`;
    const tabs = PHASE_TABS[phase];
    if (!tabs.some(([k]) => k === ptab)) ptab = tabs[0][0];
    let h = `<div class="ptabs">${tabs.map(([k, l]) => `<button data-t="${k}" class="${ptab === k ? "on" : ""}">${l}</button>`).join("")}</div>`;

    if (ptab === "punch") {
      if (t === "none") h += `<div class="note">內文沒有找到 Call Time 表格，Crew 請用「＋其他人」加入。</div>`;
      if (t === "err") h += `<div class="note">讀不到內文的 Call Time 表格。</div>`;
      STAGES.forEach(stage => {
        const list = rec.days.map((d, i) => ({ d, i })).filter(x => x.d.stage === stage);
        if (!list.length) return;
        const segSum = list.reduce((a, x) => a + (tdSeg(x.d) || 0), 0);
        const filled = list.filter(x => tdSeg(x.d) !== null).length;
        const first = list[0].d.date, last = list[list.length - 1].d.date;
        h += `<section class="stage st-${stage}"><div class="stage-h"><div><b>${stage}</b><span>${md(first)}${last > first ? " – " + md(last) : ""}・${list.length} 天</span></div>
          <div class="stage-r"><b>${fmtSeg(segSum)}</b> 段<small>${filled}/${list.length} 已填</small></div></div>`;
        const ws = stage === "進場" ? weeksOf(c, rec) : [];
        if (ws.length > 1 && !wkOpen[c.id]) {
          const t = todayD(), cur = ws.find(w => w.days.some(x => +x.date === +t));
          const ended = t > ws[ws.length - 1].days.slice(-1)[0].date;
          wkOpen[c.id] = new Set(cur ? [cur.n] : ended ? [] : [ws[0].n]);   // 已經進完場的案子全部收合
        }
        let closed = false;
        list.forEach(({ d, i }) => {
          const w = ws.length > 1 && ws.find(x => x.days[0] === d);
          if (w) {
            const ss = w.days.reduce((a, x) => a + (tdSeg(x) || 0), 0);
            const filled = w.days.filter(x => x.off || x.slot || (x.tin && x.tout)).length;
            const open = wkOpen[c.id].has(w.n); closed = !open;
            h += `<div class="wk-h wkTog ${open ? "on" : ""}" data-w="${w.n}"><span class="arr">▶</span><b>Week ${w.n}</b><span>${md(w.days[0].date)}–${md(w.days[w.days.length - 1].date)}<br>${fmtSeg(ss)} 段・${filled}/${w.days.length} 已填</span></div>`;
          }
          if (!closed) h += dayCard(d, rec.days[i - 1], i, tmap);
        });
        h += `</section>`;
      });
      h += `<div class="addday"><select id="addStage">${STAGES.map(s => `<option ${s === "拆台" ? "selected" : ""}>${s}</option>`).join("")}</select>
        <input type="date" id="addDate" value="${iso(c.end)}"><button class="ghost" id="addDay">＋加一天</button></div>`;
      h += `<button class="danger" id="clearAll" style="width:100%;margin-top:14px">${clearArm === "all" ? "再按一次確認清除" : "清除這個案子的所有打卡"}</button>`;
      h += `<button class="totop" id="toTop" aria-label="回到最上面"><span>↑</span>回到最上面</button>`;
    } else if (ptab === "sheet") {
      const stops = tourStops(c), merge = c.tour && stops.length > 1 && tourMerge[c.tour] !== false;
      if (c.tour && stops.length > 1) h += `<div class="card tourcard"><label class="tourtog"><input type="checkbox" id="tourMerge" ${merge ? "checked" : ""}>合併整個巡演「${esc(c.tour)}」（${stops.length} 站）</label>
        <div class="note">${stops.map(x => esc(x.title)).join("・")}</div>${merge && stops.some(x => { const t = tables[x.id]; return !t || t === "loading"; }) ? `<div class="note">讀取各站的 Call Time 表格中…</div>` : ""}</div>`;
      const sheetNow = merge ? buildTourSheet(c) : buildSheet(c, rec, tmap);
      if (merge && sheetNow.people.some(p => p.mixedRate)) h += `<div class="note" style="color:var(--warn-ink);margin:0 2px 8px">有人在不同站的時段費不一樣，合併表上他的時段費欄會空白，金額照各站分別計算後加總。</div>`;
      h += previewHtml(sheetNow, c)
        + `<div class="pvact"><button class="primary" id="tsMake">下載 Excel 時段表</button>
          ${sheetWarn[c.id] ? `<div class="note" style="color:var(--warn-ink)">${esc(sheetWarn[c.id])}</div>` : ""}
          ${sheetLinks[c.id] ? `<a class="sheetlink" href="${sheetLinks[c.id]}" target="_blank" rel="noopener">打開剛建立的試算表 ↗</a>` : ""}
          <div class="note" id="tsMsg">下載成 Excel 檔（.xlsx），格式和顏色都會保留，可以直接傳給製作。</div>
          </div>`;
    } else if (ptab === "shot") {
      const inf = invoiceOf(c);
      h += `<button class="shotbtn" id="shotTax"><b>抬頭・統編</b><span>${inf.head || inf.tax ? esc(inf.head) + (inf.tax ? "・" + esc(inf.tax) : "") : "還沒找到，請在案子內文或「劇場の劇團」填寫"}</span></button>
        <button class="shotbtn" id="shotCrew"><b>舞台組人員名單</b><span>給製作人：每天預計的舞台組人員（含 TD），一張圖看完</span></button>

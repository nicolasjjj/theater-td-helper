        if (target !== "sheets") {   // Excel：直接把有段數的格子塗淺綠
          const b = rows[r + 1];
          for (let c = C.prep; c < C.dEnd; c++) if (b[c] !== "") out.push(bg(G(r + 1, r + 2, c, c + 1), P.seg));
        }
        // 段數格子之間留一點縫，看起來一格一格
        out.push({ updateBorders: { range: G(r + 1, r + 2, C.prep, C.dEnd), innerVertical: line(base, "SOLID_THICK") } });
      });
      // 分隔線：人員｜前置與每天｜各組別｜時段數以後
      const vline = (c) => out.push({ updateBorders: { range: G(personStart, last, c, c + 1), left: line(P.ink, "SOLID_MEDIUM") } });
      vline(C.prep); s.groups.forEach(g => vline(C.day0 + g.start)); vline(C.total);
      // 補充文字（午+、晚+、超+）用淡橘色小字，和上下班時間區隔
      if (target === "sheets") tagCells.forEach(t => out.push({ updateCells: { range: G(t.r, t.r + 1, t.c, t.c + 1), fields: "userEnteredValue,textFormatRuns",
        rows: [{ values: [{ userEnteredValue: { stringValue: t.text }, textFormatRuns: [{ startIndex: 0, format: { foregroundColorStyle: { rgbColor: rgb(P.time) }, fontSize: 10 } }, { startIndex: t.at, format: { foregroundColorStyle: { rgbColor: rgb(P.warn) }, fontSize: 9 } }] }] }] } }));
      if (target === "sheets") {    // Google 試算表：有填段數就自動變淺綠（之後改資料也會跟著變）
        const ranges = s.people.map((p, i) => G(personStart + i * 2 + 1, personStart + i * 2 + 2, C.prep, C.dEnd));
        if (ranges.length) out.push({ addConditionalFormatRule: { index: 0, rule: { ranges, booleanRule: {
          condition: { type: "NOT_BLANK" }, format: { backgroundColorStyle: { rgbColor: rgb(P.seg) } } } } } });
      }
      // 支出明細表
      const E = (a, b, c, d) => G(a, b, c, d, SID2);
      const eLast = rows2.length - 1;
      out.push(
        { updateSheetProperties: { properties: { sheetId: SID2, gridProperties: { frozenRowCount: 0, hideGridlines: true } }, fields: "gridProperties.frozenRowCount,gridProperties.hideGridlines" } },
        fmt(E(0, eLast + 1, 0, 8), { verticalAlignment: "MIDDLE", wrapStrategy: "WRAP", textFormat: TF() }, "verticalAlignment,wrapStrategy,textFormat"),
        merge(E(0, 1, 1, 8)), tx(E(0, 1, 1, 8), { fontSize: 15, bold: true }, { horizontalAlignment: "LEFT" }, "horizontalAlignment"),
        bg(E(1, 2, 1, 8), P.head), tx(E(1, 2, 1, 8), { bold: true, color: P.white }, { horizontalAlignment: "CENTER" }, "horizontalAlignment"),
        fmt(E(2, eLast, 1, 2), { horizontalAlignment: "CENTER", numberFormat: { type: "DATE", pattern: "yyyy/m/d" } }, "horizontalAlignment,numberFormat"),
        fmt(E(2, eLast + 1, 6, 7), { horizontalAlignment: "RIGHT", numberFormat: { type: "NUMBER", pattern: "$#,##0" } }, "horizontalAlignment,numberFormat"),
        bg(E(eLast, eLast + 1, 1, 8), P.totRow), tx(E(eLast, eLast + 1, 1, 8), { bold: true, fontSize: 11 }),
        merge(E(eLast, eLast + 1, 1, 6)), fmt(E(eLast, eLast + 1, 1, 6), { horizontalAlignment: "RIGHT" }, "horizontalAlignment"),
        tx(E(eLast, eLast + 1, 6, 7), { bold: true, fontSize: 11, color: P.red }),
        tx(E(eLast, eLast + 1, 7, 8), { color: P.muted, fontSize: 9 }),
        { updateBorders: { range: E(1, eLast + 1, 1, 8), innerHorizontal: line(P.line), bottom: line(P.ink, "SOLID_MEDIUM") } },
        { updateBorders: { range: E(eLast, eLast + 1, 1, 8), top: line(P.ink, "SOLID_MEDIUM") } },
        colW(0, 1, 16, SID2), colW(1, 2, 95, SID2), colW(2, 3, 150, SID2), colW(3, 4, 170, SID2), colW(4, 5, 110, SID2), colW(5, 6, 115, SID2), colW(6, 7, 90, SID2), colW(7, 8, 200, SID2),
        rowH(0, 1, 40, SID2), rowH(1, 2, 30, SID2), rowH(2, eLast, 26, SID2), rowH(eLast, eLast + 1, 32, SID2),
      );
      return out;
    };
    return { rows, rows2, reqs, W, C, last };
  }

  async function makeGoogleSheet(c, s) {   // 劇場幫幫：在使用者自己的 Google 雲端建立試算表
    const btn = $("tsMake"), msg = $("tsMsg"), G = window.__tdh.google;
    if (!(await G.ready())) { msg.textContent = "Google 試算表功能還沒開通，請先用「下載 Excel」。"; return; }
    if (!G.signedIn) { msg.textContent = "要先登入 Google，才能在你的雲端硬碟建立試算表。前往 Google 登入中…"; G.login("sheet:" + c.id); return; }
    btn.disabled = true; btn.textContent = "建立中…";
    try {
      const plan = prettyPlan(s);
      msg.textContent = "準備「劇場幫幫 / 時段表」資料夾…";
      const dir = await G.sheetFolder();
      msg.textContent = "建立試算表…";
      const f = await G.api("https://www.googleapis.com/drive/v3/files?fields=id", { method: "POST", body: { name: s.title, mimeType: "application/vnd.google-apps.spreadsheet", parents: [dir] } });
      const id = f.id, SS = `https://sheets.googleapis.com/v4/spreadsheets/${id}`;
      const meta = await G.api(`${SS}?fields=sheets.properties.sheetId`);
      const SID = ((meta.sheets || [])[0] || { properties: { sheetId: 0 } }).properties.sheetId || 0, SID2 = SID === 1 ? 2 : 1;
      await G.api(`${SS}:batchUpdate`, { method: "POST", body: { requests: [
        { updateSheetProperties: { properties: { sheetId: SID, title: "時段表" }, fields: "title" } },
        { addSheet: { properties: { sheetId: SID2, title: EXP_TAB, index: 1 } } } ] } });
      msg.textContent = "寫入表格內容…";
      await G.api(`${SS}/values:batchUpdate`, { method: "POST", body: { valueInputOption: "USER_ENTERED", data: [{ range: "'時段表'!A1", values: plan.rows }, { range: `'${EXP_TAB}'!A1`, values: plan.rows2 }] } });
      msg.textContent = "套用樣式…";
      await G.api(`${SS}:batchUpdate`, { method: "POST", body: { requests: plan.reqs(SID, SID2, "sheets") } });
      msg.textContent = "設定共用連結…";
      let shared = true;
      try { await G.api(`https://www.googleapis.com/drive/v3/files/${id}/permissions`, { method: "POST", body: { role: "reader", type: "anyone" } }); } catch (e) { shared = false; }
      if (!shared) sheetWarn[c.id] = "試算表建好了，但共用設定沒有成功，請在 Google 試算表裡手動改成「知道連結的使用者：檢視者」。"; else delete sheetWarn[c.id];
      sheetLinks[c.id] = `https://docs.google.com/spreadsheets/d/${id}/edit`;
      toast("試算表建立好了");
      render();
    } catch (e) {
      btn.disabled = false; btn.textContent = "建立 Google 試算表";
      msg.textContent = e && e.code === "google_login" ? String(e.message) + "（按一下按鈕就會前往登入）" : "建立失敗：" + String((e && e.message) || e).slice(0, 140);
    }
  }
  async function makeXlsx(c, s) {   // 下載 Excel（樣式和 Google 試算表一樣）
    const btn = $("tsXlsx"), msg = $("tsMsg");
    btn.disabled = true;
    try {
      const plan = prettyPlan(s);
      const blob = window.__tdh.xlsx([{ name: "時段表", rows: plan.rows }, { name: EXP_TAB, rows: plan.rows2 }], plan.reqs(0, 1, "xlsx"));
      const how = await window.__tdh.saveFile(blob, `${s.title}.xlsx`.replace(/[\\/:*?"<>|]/g, "_"));
      if (how !== "cancelled") toast("Excel 已下載");
    } catch (e) { msg.textContent = "製作失敗：" + String((e && e.message) || e).slice(0, 120); }
    btn.disabled = false;
  }
  // ---------- preview ----------
  function previewHtml(s, c, shot) {
    const grand = s.people.reduce((a, p) => a + (p.pay || 0), 0);
    const segs = s.people.reduce((a, p) => a + p.total, 0);
    const tags = (x) => {
      if (!x) return "";
      const t = [];
      if (x.lunch) t.push(`午+${fmtSeg(x.lunch)}`);
      if (x.dinner) t.push(`晚+${fmtSeg(x.dinner)}`);
      const ls = x.adj === null || x.adj === undefined ? lateSeg(x.tin, x.tout) : 0;
      if (ls) t.push(`超+${fmtSeg(ls)}`);
      if (x.adj !== null && x.adj !== undefined) t.push("手動");
      return t.map(v => `<i>${v}</i>`).join("");
    };
    const gcls = (g) => g.group === "進場" ? `g-進場 wk${((g.week - 1) % 4) + 1}` : `g-${g.group}`;
    let h = `<div class="tsx"><div class="tsx-head"><div class="tsx-k">舞台技術人員時段統計表</div>
      <div class="tsx-t">${esc(s.short)}</div>
      ${(() => { const v = [...new Set(s.weeks.map(w => w.venue).filter(Boolean))]; return v.length ? `<div class="tsx-v">@${esc(v.join("、"))}</div>` : ""; })()}
      </div>
      <div class="tsx-scroll"><table class="tsx-tb"><thead><tr><th class="stk" rowspan="2">人員</th><th rowspan="2" class="g-prep">前置</th>
      ${s.groups.map(g => `<th colspan="${g.n}" class="g ${gcls(g)}">${esc(g.glabel.replace("\n", ""))}</th>`).join("")}<th rowspan="2" class="tot">時段數</th><th rowspan="2" class="tot">金額</th></tr>
      <tr>${s.groups.map(g => s.allCols.slice(g.start, g.start + g.n).map((col, j) => `<th class="dt ${gcls(g)}${j === 0 ? " gstart" : ""}">${md(col.d.date)}<small>${wk(col.d.date)}</small></th>`).join("")).join("")}</tr></thead><tbody>`;
    const starts = new Set(s.groups.map(g => g.start));
    s.people.forEach(p => {
      h += `<tr class="${p.role === "TD" ? "td" : ""}"><td class="stk"><b>${esc(p.name)}</b><small>${esc(p.roleText.replace(/\n/g, " "))}${p.flat ? "・整筆" : p.rate ? "・$" + money(p.rate) : "・<em>未填</em>"}</small></td>
        <td class="pp">${p.prepSeg !== "" ? `<span class="sg">${fmtSeg(p.prepSeg)}</span>${p.prep ? `<div class="pt">${esc(p.prep).replace(/\n/g, "<br>")}</div>` : ""}` : `<span class="nil">·</span>`}</td>`;
      p.cells.forEach((cell, k) => {
        const x = cell.raw, gs = starts.has(k) ? " gstart" : "";
        h += cell.text ? `<td class="cell${gs}"><span class="tm">${x.slot ? SLOTS[x.slot] : `${esc(x.tin || "?")}${shot ? "–" : "<br>"}${esc(x.tout || "?")}`}</span><span class="sg">${cell.seg === "" ? "?" : fmtSeg(cell.seg)}</span>${tags(x)}</td>` : `<td class="cell${gs}"><span class="nil">·</span></td>`;
      });
      h += `<td class="tot"><b>${fmtSeg(p.total)}</b></td><td class="tot">${p.pay !== null ? "$" + money(p.pay) : "<em>—</em>"}</td></tr>`;
    });
    h += `</tbody><tfoot><tr><td class="stk"><b>總計</b></td><td></td><td colspan="${s.allCols.length}"></td><td class="tot"><b>${fmtSeg(segs)}</b></td><td class="tot"><b>$${money(grand)}</b></td></tr></tfoot></table></div>
      <div class="tsx-legend"><i>午+</i>午餐 <i>晚+</i>晚餐 <i>超+</i>22:00 後 <span class="nil">·</span> 當天沒來或未填</div>
      ${shot ? `<div class="tsx-rules">${ruleLines(s.late).map((l, i) => i ? `<div>${esc(l)}</div>` : `<b>${esc(l)}</b>`).join("")}</div>` : ""}</div>`;
    return h;
  }
  async function copySheet(s) {
    const html = `<meta charset="utf-8">` + sheetHtml(s).replace(' id="tsTable"', "");
    const tsv = sheetTsv(s);
    try { await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([tsv], { type: "text/plain" }) })]); toast("已複製時段表"); return; } catch (e) {}
    try {
      const el = $("tsTable"); const r = document.createRange(); r.selectNode(el);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      const ok = document.execCommand("copy"); sel.removeAllRanges();
      if (ok) { toast("已複製時段表"); return; }
    } catch (e) {}
    $("fallbackText").value = tsv; $("modal").classList.add("show");
  }
  function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }

  // ===================== boot =====================
  window.__punch = {
    enter(ph) {
      if (ph && ph !== phase) { phase = ph; ptab = PHASE_TABS[ph][0][0]; window.scrollTo(0, 0); }
      const t = document.querySelector("#punchView h1"); if (t) t.textContent = phase === "close" ? "結案" : "進場中";
      if (!loaded && mcp) loadAll(); render();
    },
    refresh() { Object.keys(tables).forEach(k => delete tables[k]); loadAll(); },
    _test: { segments, parseRec, serialize, parseTable, buildSheet, tableMap, recOf, sheetPlan, getCase: () => cases.find(x => x.id === caseId),
      set(o) { cases = o.cases; crew = o.crew; crewByName = {}; crew.forEach(c => { crewByName[c.name] = c; }); Object.assign(tables, o.tables); } }
  };
  document.addEventListener("change", (e) => { if (e.target && e.target.id === "caseSel") { caseId = e.target.value; render(); } });
  (async () => { if (!window.claude || !window.claude.use) { render(); return; } mcp = await window.claude.use("mcp"); render(); })();
})();

</script>
<script>
(() => {
  const sen = document.getElementById("pSentinel"), st = document.querySelector(".pstick");
  if (!sen || !st || !window.IntersectionObserver) return;
  const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--stick-top")) || 0;
  new IntersectionObserver(([e]) => st.classList.toggle("stuck", !e.isIntersecting), { rootMargin: `-${top + 1}px 0px 0px 0px` }).observe(sen);
})();
</script>
<script>
(() => {
  const vv = window.visualViewport, root = document.documentElement;
  const upd = () => { if (!vv) return; root.style.setProperty("--vvh", vv.height + "px"); root.style.setProperty("--vvt", vv.offsetTop + "px"); };
  if (vv) { vv.addEventListener("resize", upd); vv.addEventListener("scroll", upd); upd(); }
  const sh = document.getElementById("pSheet");
  if (sh) new MutationObserver(() => { const on = sh.classList.contains("show"); root.style.overflow = on ? "hidden" : ""; document.body.style.overflow = on ? "hidden" : ""; }).observe(sh, { attributes: true, attributeFilter: ["class"] });
})();
</script>

    } else if (resume === "google" || (mode === "google" && T.cfg.gRefresh && !T.cfg.gData)) {
      body = `${googleCard(false)}<div id="tdhWhoBox" style="display:none">${whoCard(c, false)}</div>`;
    } else if (mode === "notion" || resume === "notion") {
      body = `${notionCard(c, seen, false)}<div id="tdhWhoBox" style="display:${notionReady() ? "" : "none"}">${whoCard(c, false)}</div><button class="ghost" id="tdhBack" style="border:0;background:none;color:#6e685f;text-decoration:underline;font-size:14px">‹ 改用 Google 帳號</button>`;
    } else if (dataReady()) {
      body = whoCard(c, false);
    } else body = chooseCard();
    ov.innerHTML = `<div class="tdh-in">
      ${force ? `<div class="tdh-head"><h1>設定</h1><button class="tdh-done" id="tdhDone">完成</button></div>` : `<h1>劇場幫幫</h1><div class="sub">給劇場人的排班、找人、時段表小幫手</div>`}
      ${ios && !standalone && !force ? `<div class="tdh-tip"><b>📱 iPhone 請先加到主畫面再設定</b><br>Safari 和主畫面的捷徑各自存設定，在這裡設定好，從主畫面打開還要再設定一次。<br>做法：按下方的「分享」→「加入主畫面」→ 從主畫面打開「劇場幫幫」再設定。<br><button type="button" class="ghost" id="tdhTipOk" style="margin-top:8px;padding:6px 12px;font-size:13px;border:0;border-radius:999px;background:#f3e3bd">我只要在 Safari 用，繼續</button></div>` : ""}
      ${body}
      <div class="tdh-foot">設定只存在這個瀏覽器裡；資料直接存在你自己的 Google 雲端或 Notion，不會經過別的地方保存。請用 Safari 或 Chrome 打開，LINE、Notion 裡面的內建瀏覽器不會記住設定。</div>

    document.body.appendChild(ov);
    const $ = (id) => ov.querySelector("#" + id);
    const showWho = () => { const w = $("tdhWhoBox"); if (w) { w.style.display = ""; w.scrollIntoView({ behavior: "smooth", block: "start" }); } };

    // 選擇
    if ($("tdhPickG")) $("tdhPickG").onclick = async () => {
      if (!(await T.google.ready())) { alert("這個網站還沒開通 Google 登入，請先用 Notion，或請網站管理者設定。"); return; }

    // Google 區塊
    if ($("tdhGBody")) (async () => {
      const G = T.google, box = $("tdhGBody");
      if (!(await G.ready())) { box.innerHTML = `<p class="no">這個網站還沒開通 Google 登入。</p>`; return; }
      if (!G.signedIn) { box.innerHTML = `<p>${force ? "登入後可以在你的 Google 雲端建立時段表試算表。" : ""}</p><button id="tdhGIn">登入 Google</button>`; $("tdhGIn").onclick = () => G.login(force ? "settings" : "setup"); return; }
      box.innerHTML = `<p class="ok">✓ 已登入 ${esc(G.email)}</p>${force ? `<button class="ghost" id="tdhGOut">登出 Google</button>` : `<div id="tdhGStep" style="font-size:14px;color:#6e685f;margin-top:6px">準備你的資料…</div><div class="tdh-err" id="tdhGErr"></div>`}`;
      if ($("tdhGOut")) $("tdhGOut").onclick = () => { if (T.cfg.mode === "google" && !confirm("登出後要重新登入才能讀到資料，確定嗎？")) return; G.logout(); location.reload(); };

        try {
          await T.gstore.ensure((m) => { const x = $("tdhGStep"); if (x) x.textContent = m; });
          $("tdhGStep").innerHTML = `<span class="ok">✓ 資料放在你的雲端硬碟「劇場幫幫 / 劇場幫幫資料」</span>`;
          showWho();
        } catch (e) {
          $("tdhGErr").innerHTML = "準備資料失敗：" + esc(e.message || e) + `<br><button id="tdhGRetry">再試一次</button>`;
          $("tdhGRetry").onclick = () => { ov.remove(); open(false, "google"); };
        }
      }
    })();

    // Notion 區塊
    let found = null;
    if ($("tdhGo")) $("tdhGo").onclick = async () => {
      const tok = $("tdhTok").value.trim(); $("tdhErr").textContent = ""; $("tdhRes").textContent = "連線中…";
      if (!/^(ntn_|secret_)/.test(tok)) { $("tdhRes").textContent = ""; $("tdhErr").textContent = "權杖看起來不對，應該是 ntn_ 開頭的一串字。"; return; }
      try {
        found = await T.findDatabases(tok);
        const names = T.DB_NAMES;
        $("tdhRes").innerHTML = Object.entries(names).map(([k, n]) => found[k] ? `<div class="ok">✓ ${n}</div>` : `<div class="no">✗ 找不到「${n}」</div>`).join("");
        if (Object.keys(names).every(k => found[k])) { T.setCfg({ token: tok, db: found, mode: "notion" }); if (force) $("tdhRes").innerHTML += `<div class="ok">已更新</div>`; else showWho(); }
        else if (!Object.keys(names).some(k => found[k])) { T.setCfg({ token: tok }); showCreate(tok); }
        else $("tdhErr").textContent = "有資料庫找不到：請確認已經在「內容存取」勾選放資料庫的頁面，或資料庫名稱完全一樣。";
      } catch (e) {
        $("tdhRes").textContent = "";
        $("tdhErr").textContent = e.status === 401 ? "權杖無效，請回 Notion 重新複製一次。" : "連線失敗：" + (e.message || e);
      }
    };
    async function showCreate(tok) {
      const box = $("tdhRes");
      box.innerHTML = `<div style="margin-bottom:6px">還沒有劇場資料庫。要幫你建立嗎？選一個要放資料庫的頁面：</div><div id="tdhPages">讀取頁面中…</div>`;
      try {
        const pages = await T.listPages(tok);
        const el = $("tdhPages");
        if (!pages.length) { el.innerHTML = `<div class="no">找不到可以用的頁面：請先在 Notion 連接的「內容存取」勾選一個頁面。</div>`; return; }
        el.innerHTML = pages.map((p, i) => `<button class="ghost" data-i="${i}" style="display:block;width:100%;text-align:left;margin-top:6px">📄 ${esc(p.title)}</button>`).join("");
        el.querySelectorAll("button").forEach(b => b.onclick = async () => {
          const pg = pages[+b.dataset.i]; el.innerHTML = `<div>在「${esc(pg.title)}」建立中…</div><div id="tdhStepMsg"></div>`;
          try {
            found = await T.createDatabases(tok, pg.id, (m) => { const x = $("tdhStepMsg"); if (x) x.textContent = m; });
            T.setCfg({ token: tok, db: found, mode: "notion" });
            box.innerHTML = Object.values(T.DB_NAMES).map(n => `<div class="ok">✓ 已建立 ${n}</div>`).join("") + `<div style="margin-top:6px;color:#6e685f">也建了一個「（範例）」案子。</div>`;
            showWho();
          } catch (e) { $("tdhErr").textContent = "建立失敗：" + (e.message || e); }
        });
      } catch (e) { $("tdhErr").textContent = "讀取頁面失敗：" + (e.message || e); }
    }

    // 你是誰
    ov.querySelectorAll(".tdh-chips").forEach(box => {
      const inp = $(box.dataset.for), mark = () => box.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.textContent === inp.value.trim()));
      box.querySelectorAll("button").forEach(b => b.onclick = () => { inp.value = b.textContent; mark(); });
      inp.addEventListener("input", mark); mark();
    });
    if ($("tdhTipOk")) $("tdhTipOk").onclick = () => $("tdhTipOk").parentNode.remove();
    if ($("tdhSave")) $("tdhSave").onclick = () => {
      T.setCfg({ tdName: $("tdhTd").value.trim(), role: $("tdhRole").value.trim(), team: $("tdhTeam").value.trim(), named: true });
      try { localStorage.setItem("tdh.seen", "1"); } catch (e) {}
      location.reload();
    };
    if ($("tdhClose")) $("tdhClose").onclick = () => ov.remove();
    if ($("tdhDone")) $("tdhDone").onclick = () => ov.remove();
    if ($("tdhSwitch")) $("tdhSwitch").onclick = () => {
      if (!confirm(T.cfg.mode === "google" ? "改用 Notion 後，會讀取 Notion 裡的資料（Google 雲端裡的資料不會被刪除）。要繼續嗎？" : "改用 Google 雲端後，會在你的雲端硬碟建立新的資料（Notion 裡的資料不會被刪除、也不會搬過去）。要繼續嗎？")) return;
      if (T.cfg.mode === "google") { T.setCfg({ mode: "notion" }); ov.remove(); open(false, "notion"); }
      else { T.setCfg({ mode: "google" }); if (T.google.signedIn) { ov.remove(); open(false, "google"); } else T.google.login("setup"); }
    };
    if ($("tdhOut")) $("tdhOut").onclick = () => { if (confirm("確定要登出並清除這個瀏覽器裡的設定？（你的資料不會被刪除）")) { localStorage.removeItem("tdh.settings.v1"); localStorage.removeItem("tdh.gat"); location.reload(); } };
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const g = document.createElement("button"); g.className = "tdh-gear"; g.textContent = "⚙︎"; g.title = "設定";
    g.onclick = () => open(true);
    const modes = document.querySelector(".modes");
    if (modes) modes.appendChild(g); else { g.style.cssText = "position:fixed;right:10px;top:10px;z-index:50"; document.body.appendChild(g); }
    // 舊版使用者：已經設定好 Notion，就不用再填「你是誰」
    if (T.cfg.mode === "notion" && notionReady() && !T.cfg.named && T.cfg.tdName !== undefined) T.setCfg({ named: true });
    const r = await T.googleReturn;
    if (r && r.ok && r.after === "setup") { open(false, "google"); return; }
    if (need()) open(false);
    if (!r) return;
    const b = document.createElement("div");
    b.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:10000;background:" + (r.error ? "#b3261e" : "#2f5d50") + ";color:#fff;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.2)";
    b.textContent = r.error || (String(r.after).startsWith("sheet") ? "✓ 已登入 Google。回到「結案 → 時段表」，再按一次「建立 Google 試算表」。" : "✓ 已登入 Google。");
    b.onclick = () => b.remove(); document.body.appendChild(b); setTimeout(() => b.remove(), 9000);
  });
})();

</script>

  const WK = "日一二三四五六";
  const md = (iso) => { if (!iso) return ""; const d = new Date(iso + "T00:00:00"); return `${d.getMonth() + 1}/${d.getDate()}(${WK[d.getDay()]})`; };
  const today = () => T.isoDay(new Date());

  const css = `
  .mg{color-scheme:light dark;position:fixed;inset:0;z-index:9000;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}

  .mg-empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);padding:22px 12px;font-size:14px;line-height:1.7;margin-top:6px}
  .mg-back{border:0;background:none;color:var(--accent);font:inherit;font-size:14px;font-weight:600;padding:4px 0;margin:0 0 6px;cursor:pointer}
  .mg-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px 14px 14px;margin-bottom:12px}

  .mg-f label{display:block;font-size:12.5px;color:var(--muted);margin:12px 2px 5px}

  .mg-f input:focus,.mg-f select:focus,.mg-f textarea:focus{border-color:var(--accent)}

  .mg-newrow{display:flex;gap:8px;margin-top:8px}.mg-newrow input{flex:1}.mg-newrow button{flex:0 0 auto;border:0;border-radius:10px;padding:0 14px;font:inherit;font-size:14px;font-weight:700;background:var(--accent);color:var(--accent-ink);cursor:pointer}
  .mg-newrow button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}

  .mg-tagrow>span{flex:0 0 34px;font-size:13px;color:var(--muted);padding-top:9px}.mg-tagrow>div{flex:1;display:flex;flex-wrap:wrap;gap:6px}
  .mg-tag{border:1.5px solid var(--line);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;background:var(--card);color:var(--muted);cursor:pointer}

  .mg-tag.on.c-blue{background:#4a86c5;border-color:#4a86c5}.mg-tag.on.c-yellow{background:#c99412;border-color:#c99412}
  .mg-tag.on.c-green{background:#3f9a5a;border-color:#3f9a5a}.mg-tag.on.c-orange{background:#d9662b;border-color:#d9662b}
  .mg-tag.on.c-gray{background:#7a746b;border-color:#7a746b}.mg-tag.on.c-purple{background:#7a5aa8;border-color:#7a5aa8}
  .mg-tag.on.c-default{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .mg a{color:var(--accent)}
  .mg-note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}

  .mg-tbl .r{display:flex;gap:6px;margin-top:6px}.mg-tbl .r input:first-child{flex:0 0 36%}.mg-tbl .r button{flex:0 0 36px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;font-size:14px;cursor:pointer}
  .mg-act{display:flex;gap:8px;margin-top:12px}.mg-act button{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .mg-act .pri{background:var(--accent);color:var(--accent-ink)}.mg-act .dan{background:transparent;border:1px solid var(--line);color:var(--tdh-dan);font-weight:500}
  .mg-err{color:var(--tdh-dan);font-size:13px;margin-top:8px}

  const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);

  let ov, tab = "cases", data = {}, fields = {}, dirty = false, q = "";
  const store = () => T.store();
  const $ = (id) => ov.querySelector("#" + id);

  async function loadKind(k, force) {
    if (!data[k] || force) data[k] = await store().list(k);
    if (!fields[k]) fields[k] = store().fields ? await store().fields(k) : T.SCHEMA[k].fields.map(f => f[0]);
    return data[k];
  }
  const has = (k, name) => (fields[k] || []).includes(name);
  const nameOf = (k, id) => { const r = (data[k] || []).find(x => x.id === id); return r ? r[T.SCHEMA[k].fields[0][0]] : ""; };

  function open(startTab) {
    if (ov) return;
    tab = startTab || "cases"; q = "";
    ov = document.createElement("div"); ov.className = "mg";
    ov.innerHTML = `<div class="mg-top"><div><div class="mg-row"><h1>劇場の資料庫</h1><button class="mg-x" id="mgX">完成</button></div>
      <div class="mg-tabs">${Object.entries(K).map(([k, n]) => `<button data-k="${k}">${n}</button>`).join("")}</div></div>
      </div></div><div class="mg-body" id="mgScroll"><div class="mg-in" id="mgBody"></div></div>`;
    document.body.appendChild(ov);
    document.documentElement.style.overflow = "hidden";
    $("mgX").onclick = close;
    ov.querySelectorAll(".mg-tabs button").forEach(b => b.onclick = () => { tab = b.dataset.k; q = ""; sub = ""; list(); });
    list();
  }
  function close() {
    ov.remove(); ov = null; document.documentElement.style.overflow = "";

  }
  function busy(msg) { $("mgBody").innerHTML = `<div class="mg-empty">${esc(msg)}</div>`; const a = ov.querySelector(".mg-add"); if (a) a.remove(); }
  function fail(e) { $("mgBody").innerHTML = `<div class="mg-empty">讀取失敗：${esc((e && e.message) || e)}<br><button class="mg-chip" id="mgRetry">再試一次</button></div>`; $("mgRetry").onclick = () => list(true); }

  // ---------- 列表 ----------
  let sub = "";   // Crew：居住地區、場館：地區 的篩選頁籤
  async function list(force) {
    ov.querySelectorAll(".mg-tabs button").forEach(b => b.classList.toggle("on", b.dataset.k === tab));
    const old = ov.querySelector(".mg-add"); if (old) old.remove();
    busy("讀取中…");
    try {
      await loadKind(tab, force);
      if (tab === "cases") await Promise.all([loadKind("venue"), loadKind("troupe")]);
      if (tab === "crew") await loadKind("cases");
    } catch (e) { return fail(e); }
    const k = tab;
    // 搜尋框只建立一次，打字（含注音組字）時只更新下面的結果，不會跳掉
    $("mgBody").innerHTML = `<input class="mg-search" id="mgQ" placeholder="搜尋${K[k]}" value="${esc(q)}"><div id="mgSubTabs"></div><div id="mgList"></div>`;
    const qi = $("mgQ"); let composing = false;

    results();
    const add = document.createElement("button"); add.className = "mg-add"; add.textContent = `＋ 新增${K[k]}`; add.onclick = () => edit(k, null); ov.appendChild(add);
  }
  function results() {
    const k = tab, title = T.SCHEMA[k].fields[0][0], box = $("mgList"); if (!box) return;
    let rows = data[k].filter(r => !q || JSON.stringify(r).includes(q));
    let h = "";
    if (k === "crew" || k === "venue") {   // 地區頁籤
      const key = k === "crew" ? "居住地區" : "地區";
      const areas = [...new Set(data[k].map(r => r[key]).filter(Boolean))];
      const order = (T.SCHEMA[k].fields.find(f => f[0] === key) || [])[2] || [];
      areas.sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
      if (sub && !areas.includes(sub) && sub !== "__none") sub = "";
      const none = data[k].some(r => !r[key]);
      $("mgSubTabs").innerHTML = areas.length ? `<div class="mg-sub">${[["", "全部"]].concat(areas.map(a => [a, a])).concat(none ? [["__none", "未分類"]] : []).map(([v, t]) => `<button data-v="${esc(v)}" class="${sub === v ? "on" : ""}">${esc(t)}</button>`).join("")}</div>` : "";
      $("mgSubTabs").querySelectorAll("button").forEach(b => b.onclick = () => { sub = b.dataset.v; results(); });
      if (sub) rows = rows.filter(r => sub === "__none" ? !r[key] : r[key] === sub);
    } else $("mgSubTabs").innerHTML = "";
    if (k === "cases") {
      const t = today();
      const st = (r) => r["進場日期"] ? (r["進場日期"].end || r["進場日期"].start) : "";
      const live = rows.filter(r => !st(r) || st(r) >= t).sort((a, b) => String((a["進場日期"] || {}).start || "9").localeCompare(String((b["進場日期"] || {}).start || "9")));
      const past = rows.filter(r => st(r) && st(r) < t).sort((a, b) => st(b).localeCompare(st(a)));
      const years = [...new Set(past.map(r => st(r).slice(0, 4)))];
      const item = (r) => {
        const d = r["進場日期"], v = (r["進場地點"] || []).map(id => nameOf("venue", id)).filter(Boolean).join("、");
        const need = (r["Crew 狀態"] || []).filter(x => /缺/.test(x));
        const tags = (r["Crew 狀態"] || []).includes("全部完成") ? `<span class="tg ok">人都找齊了</span>` : need.map(x => `<span class="tg w">${esc(x)}</span>`).join("");
        return `<button class="mg-it" data-id="${r.id}"><b>${esc(r["案名"] || "（未命名）")}</b><small>${d ? md(d.start) + (d.end && d.end !== d.start ? " – " + md(d.end) : "") : "還沒填日期"}${v ? "・" + esc(v) : ""}</small>${tags}</button>`;
      };
      h += live.length ? `<div class="mg-sec">進行中、還沒開始</div>` + live.map(item).join("") : `<div class="mg-empty">${q ? "找不到符合的案子" : "還沒有案子，按下面的「＋ 新增案子」。"}</div>`;
      if (past.length) h += `<div class="mg-sec">已經結束</div>` + years.map(y => { const ys = past.filter(r => st(r).startsWith(y)); return `<details ${q ? "open" : ""}><summary class="mg-sec" style="cursor:pointer;font-size:15px;color:var(--ink)">${y} 年（${ys.length}）</summary>${ys.map(item).join("")}</details>`; }).join("");
    } else {
      if (k === "crew") {   // 常出現的人排前面：被排進或問過的案子數
        const freq = {};
        (data.cases || []).forEach(c => new Set([...(c["摳的人"] || []), ...(c["問過的人"] || [])]).forEach(id => { freq[id] = (freq[id] || 0) + 1; }));
        rows.sort((a, b) => (freq[b.id] || 0) - (freq[a.id] || 0) || String(a[title]).localeCompare(String(b[title]), "zh-Hant"));
        rows.forEach(r => { r._n = freq[r.id] || 0; });
      } else rows.sort((a, b) => String(a[title]).localeCompare(String(b[title]), "zh-Hant"));
      h += rows.length ? rows.map(r => {
        const sub2 = k === "crew" ? [r["時段費"] ? "$" + r["時段費"] : "", r["居住地區"], r["電話"], r._n ? `合作 ${r._n} 檔` : ""].filter(Boolean).join("・")
          : k === "venue" ? [r["地區"], r["地址"]].filter(Boolean).join("・") : [r["抬頭"], r["統編"]].filter(Boolean).join("・");
        return `<button class="mg-it" data-id="${r.id}"><b>${esc(r[title] || "（未命名）")}</b>${sub2 ? `<small>${esc(sub2)}</small>` : ""}</button>`;
      }).join("") : `<div class="mg-empty">${q || sub ? "找不到符合的" + K[k] : "還沒有" + K[k] + "，按下面的「＋ 新增" + K[k] + "」。"}</div>`;
    }
    box.innerHTML = h;
    box.querySelectorAll(".mg-it").forEach(b => b.onclick = () => edit(k, b.dataset.id));
  }

  // ---------- 編輯 ----------
  const inp = (id, label, v, extra = "") => `<label for="${id}">${label}</label><input id="${id}" value="${esc(v ?? "")}" ${extra}>`;
  function selectHtml(id, label, opts, v, addLabel) {
    return `<label for="${id}">${label}</label><select id="${id}"><option value="">（不選）</option>${opts.map(([val, txt]) => `<option value="${esc(val)}" ${val === v ? "selected" : ""}>${esc(txt)}</option>`).join("")}${addLabel ? `<option value="__new">＋ ${addLabel}</option>` : ""}</select>`;
  }
  // 下拉選單＋右上角「＋ 新增」：在下面展開一列輸入框，直接建立
  function pickHtml(id, label, kind, opts, v) {
    return `<div class="mg-lrow"><label for="${id}">${label}</label><button type="button" class="mg-mini" data-addfor="${id}" data-kind="${kind}">＋ 新增${K[kind]}</button></div>
      <select id="${id}"><option value="">（不選）</option>${opts.map(([val, txt]) => `<option value="${esc(val)}" ${val === v ? "selected" : ""}>${esc(txt)}</option>`).join("")}</select>
      <div class="mg-newrow" id="${id}_new" style="display:none"><input placeholder="新的${K[kind]}名稱"><button type="button">加入</button><button type="button" class="ghost">取消</button></div>`;
  }
  function bindPick() {
    ov.querySelectorAll("[data-addfor]").forEach(btn => btn.onclick = () => {
      const id = btn.dataset.addfor, kind = btn.dataset.kind, row = $(id + "_new"), input = row.children[0];
      row.style.display = "flex"; input.value = ""; input.focus();
      row.children[2].onclick = () => { row.style.display = "none"; };
      row.children[1].onclick = async () => {
        const name = input.value.trim(); if (!name) { input.focus(); return; }
        row.children[1].disabled = true; row.children[1].textContent = "加入中…";
        try {
          const nid = await store().create(kind, { [T.SCHEMA[kind].fields[0][0]]: name });
          data[kind] = null; await loadKind(kind, true); dirty = true;
          const sel = $(id); sel.insertAdjacentHTML("beforeend", `<option value="${nid}">${esc(name)}</option>`); sel.value = nid;
          row.style.display = "none";
        } catch (e) { alert("新增失敗：" + (e.message || e)); }
        row.children[1].disabled = false; row.children[1].textContent = "加入";
      };
    });
  }
  async function pickNew(sel, kind) {   // 下拉選單選「＋ 新增…」：直接建立一筆
    const name = prompt(`新增${K[kind]}的名稱`);
    if (!name || !name.trim()) { sel.value = ""; return; }
    sel.disabled = true;
    try {
      const id = await store().create(kind, { [T.SCHEMA[kind].fields[0][0]]: name.trim() });
      data[kind] = null; await loadKind(kind, true); dirty = true;
      sel.insertAdjacentHTML("beforeend", `<option value="${id}">${esc(name.trim())}</option>`); sel.value = id;
    } catch (e) { alert("新增失敗：" + (e.message || e)); sel.value = ""; }
    sel.disabled = false;
  }

  async function edit(k, id) {
    const old = ov.querySelector(".mg-add"); if (old) old.remove();
    const r = id ? data[k].find(x => x.id === id) : {};
    const isNew = !id;
    let h = `<button class="mg-back" id="mgBack">‹ ${K[k]}列表</button><div class="mg-f">`;
    if (k === "cases") h += await caseForm(r, isNew);
    else {
      h += `<div class="mg-card">`;
      const HIDE = { venue: ["官方網站", "技術資料與圖面"] };
      for (const [name, type, opts] of T.SCHEMA[k].fields) {
        if (!has(k, name) || type === "content" || (HIDE[k] || []).includes(name) || (isNew && name === "時段費紀錄")) continue;
        const lab = name + (type === "title" ? "（必填）" : "（非必填）");
        const fid = "f_" + name;
        if (type === "select") h += selectHtml(fid, lab, (opts || []).concat(r[name] && !(opts || []).includes(r[name]) ? [r[name]] : []).map(o => [o, o]), r[name] || "");
        else if (name === "時段費紀錄" || name === "備註") h += `<label for="${fid}">${lab}</label><textarea id="${fid}">${esc(r[name] || "")}</textarea>`;
        else h += inp(fid, lab, r[name], type === "number" ? 'inputmode="numeric"' : name === "電話" ? 'inputmode="tel"' : type === "url" ? 'inputmode="url" placeholder="https://"' : "");
      }
      if (k === "troupe") h += `<div class="mg-note">劇團名稱會放在案名前面，當作複製訊息的內容，例如「光點劇場《午後的信》」。</div>`;
      if (!isNew && r["電話"]) h += `<div class="mg-note"><a href="tel:${esc(String(r["電話"]).replace(/[^\d+]/g, ""))}">📞 打電話給 ${esc(r[T.SCHEMA[k].fields[0][0]])}</a></div>`;
      h += `</div>`;
    }
    h += `<div class="mg-err" id="mgErr"></div><div class="mg-act"><button class="pri" id="mgSave">${isNew ? "新增" : "儲存"}</button></div>`;
    if (!isNew) h += `<div class="mg-act"><button class="dan" id="mgDel">刪除</button></div>`;
    h += `</div>`;
    $("mgBody").innerHTML = h; $("mgScroll").scrollTop = 0;
    $("mgBack").onclick = () => list();
    ov.querySelectorAll("select").forEach(s => s.onchange = () => { if (s.value === "__new") pickNew(s, s.dataset.kind); });
    if (k === "cases") { bindCase(r, isNew); bindPick(); }
    $("mgSave").onclick = () => save(k, id, r);
    if ($("mgArc")) $("mgArc").onclick = async () => {
      $("mgArc").disabled = true;
      try { await store().update("cases", id, { "封存": !r["封存"] }); dirty = true; await loadKind("cases", true); list(); }
      catch (e) { $("mgErr").textContent = "失敗：" + (e.message || e); $("mgArc").disabled = false; }
    };
    if ($("mgDel")) $("mgDel").onclick = async () => {
      const nm = r[T.SCHEMA[k].fields[0][0]] || "";
      if (!confirm(`確定要刪除「${nm}」？${T.cfg.mode === "google" ? "刪除後沒辦法復原。" : "會移到 Notion 的垃圾桶，30 天內可以還原。"}${k === "cases" ? "\n\n只是做完了的話，建議用「封存」。" : ""}`)) return;
      $("mgDel").disabled = true;
      try { await store().remove(k, id); dirty = true; await loadKind(k, true); list(); }
      catch (e) { $("mgErr").textContent = "刪除失敗：" + (e.message || e); $("mgDel").disabled = false; }
    };
  }

  // 案子表單
  const NEEDS = () => T.NEED_KINDS.map(x => x[0]);
  async function caseForm(r, isNew) {
    const d = r["進場日期"] || {}, ld = r["裝車時間"] || {};
    const st = r["Crew 狀態"] || [];
    const cnt = (kind) => { const m = st.map(x => x.match(new RegExp("^" + kind + "缺(\\d+)$"))).find(Boolean); return m ? +m[1] : 0; };
    const vOpts = (data.venue || []).map(x => [x.id, x["場館名稱"] || "（未命名）"]).sort((a, b) => a[1].localeCompare(b[1], "zh-Hant"));
    const tOpts = (data.troupe || []).map(x => [x.id, x["劇團名稱"] || "（未命名）"]).sort((a, b) => a[1].localeCompare(b[1], "zh-Hant"));
    let content = null;
    if (!isNew && T.cfg.mode === "google") content = await T.gstore.getContent(r.id);
    let h = `<div class="mg-card"><h3>基本資料</h3>
      ${inp("c_name", "案名／劇名（必填，劇團另外選）", r["案名"], 'placeholder="例如：午後的信"')}
      ${has("cases", "劇團") ? pickHtml("c_troupe", "劇團", "troupe", tOpts, (r["劇團"] || [])[0] || "") : ""}
      <div class="two"><div>${inp("c_s", "進場日期", d.start, 'type="date"')}</div><div>${inp("c_e", "最後一天", d.end || d.start, 'type="date"')}</div></div>
      ${has("cases", "進場地點") ? pickHtml("c_venue", "演出場館", "venue", vOpts, (r["進場地點"] || [])[0] || "") : ""}
      <div class="two"><div>${inp("c_l", "裝車日期（沒有就空白）", ld.start, 'type="date"')}</div><div>${has("cases", "裝車地點") ? inp("c_lp", "裝車地點（沒有就空白）", r["裝車地點"]) : ""}</div></div>
      ${has("cases", "負責人姓名") ? `<label class="mg-ck"><input type="checkbox" id="c_subOn" ${r["負責人姓名"] ? "checked" : ""}>這一檔我請人代班</label>
        <div id="c_subBox" style="${r["負責人姓名"] ? "" : "display:none"}">${inp("c_td", "代班的人是誰", r["負責人姓名"], 'placeholder="例如：王小明"')}</div>` : ""}
      ${has("cases", "巡演") ? `<label class="mg-ck"><input type="checkbox" id="c_tourOn" ${r["巡演"] ? "checked" : ""}>這一檔是巡演</label>
        <div id="c_tourBox" style="${r["巡演"] ? "" : "display:none"}">${inp("c_tour", "巡演名稱（每一站都填一樣的名字，結案時可以合併成一張時段表）", r["巡演"], 'placeholder="例如：2026午後的信"')}</div>` : ""}
      </div>
      <div class="mg-card"><h3>這檔要找幾個人</h3>
      ${has("cases", "人力分配") ? inp("c_plan", "人力分配", r["人力分配"], 'placeholder="例如：全程1帶2 / 裝2天+拆台1帶4"') : ""}
      <label>還缺的人（可複選，主畫面「找人」會照這個顯示）</label>
      <div id="c_need">${T.NEED_KINDS.map(([kind, n, col]) => `<div class="mg-tagrow"><span>${kind}</span><div>${Array.from({ length: n }, (_, i) => `${kind}缺${i + 1}`).map(tg => `<button type="button" class="mg-tag c-${col} ${st.includes(tg) ? "on" : ""}" data-tag="${tg}">${tg}</button>`).join("")}</div></div>`).join("")}
        <div class="mg-tagrow"><span>其他</span><div><button type="button" class="mg-tag c-default ${st.includes("全部完成") ? "on" : ""}" data-tag="全部完成">人都找齊了</button><button type="button" class="mg-tag c-gray ${st.includes("等待製作確認") ? "on" : ""}" data-tag="等待製作確認">人數尚未確認</button></div></div></div>
      </div>
      <div class="mg-card"><h3>費用</h3>
      ${inp("c_tdr", "我這一檔的時段費", r["負責人時段費"], 'inputmode="numeric" placeholder="例如：1400"')}
      ${inp("c_flat", "整筆費用（這一檔是談整筆才填寫）", r["負責人整筆費用"], 'inputmode="numeric"')}
      </div>`;
    if (isNew) h += `<div class="mg-note" style="margin:0 4px 10px">新增後會自動建立每一天的 Call Time 排班表，之後在主畫面「找人」選人就會填進去。</div>`;
    else if (content) {
      h += `<div class="mg-card"><h3>Call Time 排班表</h3><div class="mg-note">左邊是日期或項目，右邊是排的人（用「、」分開）。主畫面選人時會自動填，這裡可以手動修改。</div>
        <div class="mg-tbl" id="c_tbl">${content.table.map(row => `<div class="r"><input value="${esc(row[0])}"><input value="${esc(row[1] || "")}"><button type="button" title="刪除這列">✕</button></div>`).join("")}</div>
        <button type="button" class="mg-chip" id="c_addRow">＋ 加一列</button> <button type="button" class="mg-chip" id="c_fillDays">補上缺的日期</button>
        <h3 style="margin-top:16px">其他資訊</h3><textarea id="c_notes" placeholder="抬頭：&#10;統編：&#10;地址：">${esc(content.notes.join("\n"))}</textarea>
        <div class="mg-note">「抬頭：」「統編：」會用在截圖的抬頭統編卡片。</div></div>`;
    } else if (!isNew) h += `<div class="mg-note" style="margin:0 4px 10px">Call Time 排班表在這個案子的 Notion 頁面裡。</div>`;
    return h;
  }
  function bindCase(r, isNew) {
    ov.querySelectorAll("#c_need .mg-tag").forEach(b => b.onclick = () => b.classList.toggle("on"));
    [["c_subOn", "c_subBox", "c_td"], ["c_tourOn", "c_tourBox", "c_tour"]].forEach(([ck, box, input]) => { if ($(ck)) $(ck).onchange = () => { $(box).style.display = $(ck).checked ? "" : "none"; if ($(ck).checked) $(input).focus(); }; });
    $("c_s").onchange = () => { if (!$("c_e").value || $("c_e").value < $("c_s").value) $("c_e").value = $("c_s").value; };
    const tbl = $("c_tbl");
    if (tbl) {
      const bindDel = () => tbl.querySelectorAll("button").forEach(b => b.onclick = () => b.parentNode.remove());
      bindDel();
      $("c_addRow").onclick = () => { tbl.insertAdjacentHTML("beforeend", `<div class="r"><input placeholder="例如 12/20 (六)"><input placeholder="人名"><button type="button">✕</button></div>`); bindDel(); };
      $("c_fillDays").onclick = () => {
        const have = new Set([...tbl.querySelectorAll(".r")].map(x => x.children[0].value.replace(/\s*\(.*$/, "").trim()));
        T.callRows($("c_s").value, $("c_e").value, $("c_l").value).forEach(([label]) => {
          if (have.has(label.replace(/\s*\(.*$/, "").trim())) return;
          tbl.insertAdjacentHTML("beforeend", `<div class="r"><input value="${esc(label)}"><input><button type="button">✕</button></div>`);
        });
        bindDel();
      };
    }
  }
  const num = (v) => { const t = String(v || "").replace(/[,\s$]/g, ""); return t === "" || isNaN(+t) ? null : +t; };

  async function save(k, id, r) {
    const btn = $("mgSave"), errEl = $("mgErr"); errEl.textContent = "";
    const vals = {}; let content = null;
    if (k === "cases") {
      const name = $("c_name").value.trim(); if (!name) { errEl.textContent = "請填案名"; return; }
      const s = $("c_s").value, e = $("c_e").value || s, l = $("c_l").value;
      if (!s) { errEl.textContent = "請填進場日期"; return; }
      Object.assign(vals, { "案名": name, "進場日期": { start: s, end: e > s ? e : null }, "裝車時間": l ? { start: l } : null });
      if ($("c_troupe")) vals["劇團"] = $("c_troupe").value && $("c_troupe").value !== "__new" ? [$("c_troupe").value] : [];
      if ($("c_venue")) vals["進場地點"] = $("c_venue").value && $("c_venue").value !== "__new" ? [$("c_venue").value] : [];
      if ($("c_lp")) vals["裝車地點"] = $("c_lp").value.trim();
      if ($("c_plan")) vals["人力分配"] = $("c_plan").value.trim();
      if ($("c_tour")) vals["巡演"] = $("c_tourOn").checked ? ($("c_tour").value.trim() || null) : null;
      if (!id) vals["職位"] = "負責人";
      const tags = [...ov.querySelectorAll("#c_need .mg-tag.on")].map(b => b.dataset.tag);
      if (!tags.length) tags.push("尚未開始");
      vals["Crew 狀態"] = tags;
      vals["負責人時段費"] = num($("c_tdr").value); vals["負責人整筆費用"] = num($("c_flat").value);
      if ($("c_td")) vals["負責人姓名"] = $("c_subOn").checked ? ($("c_td").value.trim() || null) : null;
      if (!id) content = { notes: ["抬頭：", "統編："], table: T.callRows(s, e > s ? e : s, l) };
      else if ($("c_tbl")) content = { notes: $("c_notes").value.split("\n"), table: [...$("c_tbl").querySelectorAll(".r")].map(x => [x.children[0].value.trim(), x.children[1].value.trim()]).filter(x => x[0] || x[1]) };
    } else {
      for (const [name, type] of T.SCHEMA[k].fields) {
        const el = $("f_" + name); if (!el) continue;
        vals[name] = type === "number" ? num(el.value) : el.value.trim();
      }
      const tf = T.SCHEMA[k].fields[0][0];
      if (!vals[tf]) { errEl.textContent = `請填${tf}`; return; }
    }
    // Notion：自訂的單選值（例如巡演名稱）會自動新增選項；沒有的欄位略過
    btn.disabled = true; btn.textContent = "儲存中…";
    try {
      if (id) { await store().update(k, id, vals); if (content && T.cfg.mode === "google") await store().update(k, id, { "內容": content }); }
      else await store().create(k, vals, k === "cases" ? content : null);
      dirty = true;
      await loadKind(k, true);
      list();
    } catch (e) { errEl.textContent = "儲存失敗：" + ((e && e.message) || e); btn.disabled = false; btn.textContent = id ? "儲存" : "新增"; }
  }

  T.openManage = open;
  document.addEventListener("DOMContentLoaded", () => {
    const modes = document.querySelector(".modes");
    const b = document.createElement("button"); b.className = "mg-btn"; b.textContent = "☰"; b.title = "管理案子、人員、場館、劇團"; b.setAttribute("aria-label", "管理");
    b.onclick = () => open();
    const gear = modes && modes.querySelector(".tdh-gear");
    if (modes) modes.insertBefore(b, gear || null); else { b.style.cssText = "position:fixed;right:52px;top:10px;z-index:50"; document.body.appendChild(b); }
  });
})();

</script>
</head>
<body>
<div class="wrap">
  <div class="modes"><button class="mode on" data-m="find">進場前</button><button class="mode" data-m="live">進場中</button><button class="mode" data-m="close">結案</button></div>
  <div id="findView">
  <header>
    <h1>缺人訊息</h1>
    <button class="icon-btn" id="refresh">重新整理</button>
  </header>
  <div class="sub" id="fresh">從「劇場の案子」讀取中…</div>

  <div class="tabs">
    <button class="tab on" data-f="all">全部</button>
    <button class="tab" data-f="全程">全程</button>
    <button class="tab" data-f="裝拆">裝拆</button>
    <button class="tab" data-f="裝車">裝車</button>
  </div>

  <div id="list"><div class="state">讀取中…</div></div>
  </div>
  <div id="punchView" hidden>
    <header><h1>進場中</h1><button class="icon-btn" id="pRefresh">重新整理</button></header>
    <div id="pSentinel" style="height:1px"></div>
    <div class="pstick"><select id="caseSel" class="casesel"></select><div id="pSum"></div></div>
    <div class="sub" id="pStatus"></div>
    <div id="punchBody"><div class="state">讀取中…</div></div>
  </div>
</div>
<div class="psheet" id="pSheet"></div>
<div class="shot" id="shotLayer"></div>

<div class="bar" id="findBar">
  <div class="bar-in">
    <div class="count" id="count">點卡片勾選</div>
    <button class="ghost" id="clear" hidden>取消選取</button>
    <button class="ghost" id="all">全選</button>
    <button class="primary" id="copy" disabled>複製</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <p>這個畫面不能自動複製，請長按下面的文字 →「全選」→「拷貝」。</p>
    <textarea id="fallbackText" readonly></textarea>
    <div style="display:flex;justify-content:flex-end;margin-top:10px">
      <button class="ghost" id="closeModal">關閉</button>
    </div>
  </div>
</div>

<script>
document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".mode").forEach(x => x.classList.toggle("on", x === b));
  const p = b.dataset.m !== "find";
  document.getElementById("findView").hidden = p;
  document.getElementById("findBar").hidden = p;
  document.getElementById("punchView").hidden = !p;
  if (p && window.__punch) window.__punch.enter(b.dataset.m);
}));
document.getElementById("pRefresh").addEventListener("click", () => window.__punch && window.__punch.refresh());
</script>
<script>
(() => {
  const SERVER = "Notion";
  const TOOL = "notion-query-data-sources";
  const DS_CASES = "collection://unused";
  const DS_VENUES = "collection://unused";

  // Saved-view reads: not counted against Notion's hourly SQL/rows query allowance.
  const viewInput = (v, cursor) => ({ data: Object.assign(
    { mode: "view", view_url: v, page_size: 100 }, cursor ? { start_cursor: cursor } : {}) });
  const VIEW_CASES = "view://NEED";   // 劇場の案子 →「缺人」
  const VIEW_VENUES = "view://VENUE";  // 劇場の場館 →「地區」
  const VIEW_TROUPES = "view://TROUPE"; // 劇場の劇團 → Default view
  const CASES_INPUT = viewInput(VIEW_CASES);
  const VENUES_INPUT = viewInput(VIEW_VENUES);
  const TROUPES_INPUT = viewInput(VIEW_TROUPES);

  const $ = (id) => document.getElementById(id);
  let cases = null, venues = null, troupes = null, casesAt = null;
  let errorState = null;
  let filter = "all";
  const selected = new Set();
  let items = [];

  // ---------- helpers ----------
  const unesc = (s) => String(s ?? "").replace(/\\(.)/g, "$1");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const arr = (v) => {
    if (Array.isArray(v)) return v;
    if (typeof v === "string" && v.trim().startsWith("[")) { try { return JSON.parse(v); } catch (e) {} }
    return [];
  };
  const idOf = (u) => { const m = String(u).replace(/-/g, "").match(/[0-9a-f]{32}/i); return m ? m[0].toLowerCase() : ""; };
  const pd = (s) => {
    if (!s) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
    const t = new Date(String(s).replace(" ", "T"));
    return isNaN(t) ? null : t;
  };
  const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
  const wk = (d) => "日一二三四五六"[d.getDay()];
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const zh = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7 };

  function rowsOf(result) {
    let p = result && result.payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) {} }
    if (p && Array.isArray(p.results)) return p.results;
    for (const b of (result && result.content) || []) {
      if (b.type === "text") { try { const j = JSON.parse(b.text); if (j && Array.isArray(j.results)) return j.results; } catch (e) {} }
    }
    throw new Error("unexpected_shape");
  }

  // ---------- message building (mirrors the Notion formulas) ----------
  function build() {
    const venueName = {};
    (venues || []).forEach(v => { venueName[idOf(v.url)] = unesc(v["場館名稱"]); });
    const troupeName = {};
    (troupes || []).forEach(t => { troupeName[idOf(t.url)] = unesc(t["劇團名稱"]); });
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const out = [];

    (cases || []).forEach(r => {
      const st = arr(r["Crew 狀態"]);
      const start = pd(r["date:進場日期:start"]);
      if (!start) return;
      const end = pd(r["date:進場日期:end"]) || start;
      if (end < today) return;

      const troupe = arr(r["劇團"]).map(u => troupeName[idOf(u)]).filter(Boolean).join("、");
      const title = unesc(r["案名"] || "");
      const header = `${troupe}《${title.split("_")[0]}》` + (/tryout/i.test(title) ? "Tryout" : "");
      const dw = (d) => `${md(d)}(${wk(d)})`;
      const same = (a, b) => a.toDateString() === b.toDateString();
      const plan = unesc(r["人力分配"] || "").trim();
      const td = tdOverride[idOf(r.url)] ?? (unesc(r["TD姓名"] || "").trim() || window.TDN());
      const cid = idOf(r.url), tour = String(r["巡演"] || "").trim();
      if (!asked[cid]) asked[cid] = new Set(arr(r["問過的人"]).map(idOf));
      if (!booked[cid]) booked[cid] = new Set(arr(r["摳的人"]).map(idOf));
      const vIds = arr(r["進場地點"]).map(idOf);
      const vNames = vIds.map(id => venueName[id]).filter(Boolean);
      const venue = vNames.length ? vNames.join("、") : (vIds.length && !venues ? "（地點讀取中）" : "地點待定");

      const whole = st.filter(s => /^(全程缺|整週缺|尚未開始|等待製作確認)/.test(s));
      if (whole.length) {
        let t = `${header}\n${same(start, end) ? dw(start) : `${dw(start)} - ${dw(end)}`}\n@${venue}`;
        const load = pd(r["date:裝車時間:start"]);
        if (load) t += `\n保留${md(load)}(${wk(load)})裝車`;
        out.push({ key: r.url + "#w", kind: "全程", tags: whole, title, header, td, url: r.url, cid, tour, venue, load: pd(r["date:裝車時間:start"]), start, end, plan, text: t });
      }

      const ss = st.filter(s => /^(裝拆|裝台|拆台)缺/.test(s));
      if (ss.length) {
        const needSet = ss.some(s => /^(裝拆|裝台)/.test(s));
        const needStrike = ss.some(s => /^(裝拆|拆台)/.test(s));
        const m = String(r["人力分配"] || "").match(/裝台?([0-9一二三四五六七]+)天/);
        const n = m ? (zh[m[1]] || parseInt(m[1], 10) || 1) : 1;
        const setEnd = addDays(start, n - 1);
        const lines = [header];
        if (needSet) lines.push(n === 1 ? `${dw(start)}裝台` : `${dw(start)} - ${dw(setEnd)}裝台${n}天`);
        if (needStrike) lines.push(needSet ? `${dw(end)}拆台` : `${dw(end)} 拆台`);
        lines.push(`@${venue}`);
        out.push({ key: r.url + "#s", kind: "裝拆", tags: ss, title, header, td, url: r.url, cid, tour, venue, load: pd(r["date:裝車時間:start"]), start, end, setEnd, needSet, needStrike, plan, text: lines.join("\n") });
      }

      const lc = st.filter(s => /^裝車缺/.test(s));
      if (lc.length) {
        const ls = r["date:裝車時間:start"];
        const load = pd(ls);
        const hasTime = Number(r["date:裝車時間:is_datetime"]) === 1;
        const place = unesc(r["裝車地點"] || "").trim() || "地點待定";
        let when = "裝車時間待定";
        if (load) {
          const hm = hasTime ? `${load.getHours()}:${String(load.getMinutes()).padStart(2, "0")}` : "";
          when = `${md(load)}(${wk(load)})${hm} 裝車`;
        }
        out.push({ key: r.url + "#l", kind: "裝車", tags: lc, title, header, td, url: r.url, cid, tour, venue, load: pd(r["date:裝車時間:start"]), start: load || start, caseStart: start, end, plan,
          text: `${header}\n${when}\n@${place}` });
      }
    });
    const ord = { "全程": 0, "裝車": 1, "裝拆": 2 };
    out.sort((a, b) => a.start - b.start || ord[a.kind] - ord[b.kind]);
    return out;
  }

  // ---------- render ----------
  function render() {
    const list = $("list");
    if (errorState && !cases) { list.innerHTML = errorState; return; }
    if (!cases) { list.innerHTML = `<div class="state">讀取中…</div>`; return; }

    items = build();
    const keys = new Set(items.map(i => i.key));
    [...selected].forEach(k => { if (!keys.has(k)) selected.delete(k); });

    const shown = items.filter(i => filter === "all" || i.kind === filter);
    if (!shown.length) {
      list.innerHTML = `<div class="state">${filter === "all" ? "目前沒有缺人的案子 🎉" : `沒有「${filter}」缺人的案子`}</div>`;
    } else {
      list.innerHTML = "";
      shown.forEach(i => {
        const c = document.createElement("div");
        c.className = "card" + (selected.has(i.key) ? " sel" : "");
        c.innerHTML = `<div class="check"></div>
          <div class="meta">${i.tags.map(t => `<span class="tag ${i.kind === "全程" ? "w" : i.kind === "裝車" ? "l" : "s"}">${t}</span>`).join("")}
          <span class="case"></span></div><pre></pre><div class="info"></div>
          <div class="cardBtns"><button class="tblBtn">看表格</button><button class="bookBar"></button></div>`;
        c.querySelector(".case").textContent = i.title;
        c.querySelector("pre").textContent = i.text;
        fillInfo(c.querySelector(".info"), i);
        fillBook(c.querySelector(".bookBar"), i);
        loadCrew(i.url);
        c.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;
          if (e.target.closest(".askBtn")) { e.stopPropagation(); openAsk(i); return; }
          if (e.target.closest(".bookBar")) { e.stopPropagation(); openBook(i); return; }
          if (e.target.closest(".tblBtn")) { e.stopPropagation(); openTable(i); return; }
          if (e.target.closest(".infoTog")) { e.stopPropagation(); openInfo.has(i.key) ? openInfo.delete(i.key) : openInfo.add(i.key); fillInfo(c.querySelector(".info"), i); return; }
          selected.has(i.key) ? selected.delete(i.key) : selected.add(i.key);
          render();
        });
        list.appendChild(c);
      });
    }
    if (errorState) list.insertAdjacentHTML("afterbegin", errorState);
    if (!crewDirState && mcpRef && Object.values(asked).some(s => s.size)) loadCrewDir().catch(() => {});
    updateBar(shown);
  }

  function updateBar(shown) {
    const n = selected.size;
    $("count").innerHTML = n ? `已選 <b>${n}</b> 則` : "點卡片勾選";
    $("copy").disabled = !n;
    $("clear").hidden = !n;
    const allOn = shown.length && shown.every(i => selected.has(i.key));
    $("all").textContent = allOn ? "取消全選" : "全選";
  }

  function setFresh(result) {
    const at = result && result.cache ? result.cache.storedAt : Date.now();
    casesAt = new Date(at);
    $("fresh").textContent = `資料更新於 ${casesAt.getHours()}:${String(casesAt.getMinutes()).padStart(2, "0")}・來自${window.__tdh.cfg.mode === "google" ? "你的 Google 雲端" : " Notion「劇場の案子」"}`;
  }


  // ---------- crew from page body table ----------
  const crew = {};
  const splitNames = (s) => unesc(s).replace(/<[^>]+>/g, " ")
    .split(/[、,，\/\s]+/).map(x => x.trim()).filter(x => x && !/^[xX×\-－—]$/.test(x) && !/不留|無人|待定|未定|^無$/.test(x));
  function parseCrew(text) {
    const rows = [];
    for (const m of String(text).matchAll(/<tr[^>]*>([\s\S]*?)<\/tr>/g)) {
      const cells = [...m[1].matchAll(/<td[^>]*>([\s\S]*?)<\/td>/g)].map(x => x[1]);
      if (cells.length < 2) continue;
      const label = unesc(cells[0].replace(/<[^>]+>/g, "")).trim();
      rows.push({ label, names: splitNames(cells.slice(1).join(" ")) });
    }
    if (!rows.length) return { status: "none" };
    const days = rows.filter(r => !/裝車|拆台|卸車/.test(r.label) && r.names.length);
    const strike = rows.filter(r => /拆台/.test(r.label));
    const loadRow = rows.filter(r => /裝車/.test(r.label));
    let whole = days.length ? days[0].names.slice() : [];
    days.slice(1).forEach(d => { whole = whole.filter(n => d.names.includes(n)); });
    const set = new Set();
    days.concat(strike).forEach(d => d.names.forEach(n => { if (!whole.includes(n)) set.add(n); }));
    const loaders = [...new Set(loadRow.flatMap(r => r.names))];
    return { status: "ok", whole, part: [...set], loaders };
  }
  function loadCrew(url) {
    if (crew[url] || !mcpRef) return;
    crew[url] = { status: "loading" };
    mcpRef.callTool(SERVER, "notion-fetch", { id: url }, { cache: { staleTime: 300000, gcTime: 86400000 } })
      .then(r => {
        const p = payloadOf(r);
        let text = typeof p === "string" ? p : (p.text || "");
        if (!text) text = ((r.content || []).find(b => b.type === "text") || {}).text || "";
        crew[url] = parseCrew(text);
      })
      .catch(e => { crew[url] = { status: "err", code: e && e.code }; })
      .then(() => render());
  }
  const openInfo = new Set();
  const list = (a) => a.length ? `${a.join("、")}（${a.length}）` : "—";
  function fillInfo(el, i) {
    const esc = (s) => String(s).replace(/[&<>]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
    let html = `<div class="planrow"><b>人力分配</b>　<span>${i.plan ? esc(i.plan) : "—"}</span></div>`;
    el.innerHTML = html;
  }
  // 卡片最下面：確定人選（Call Time 表格裡已經排的人）
  function fillBook(el, i) {
    el.innerHTML = `<div class="bk-h"><span>加入 / 編輯</span><i>›</i></div>`;
  }

  // ---------- 問過的人 ----------
  const asked = {}, booked = {};
  const crewDir = {};
  let crewDirState = null;
  const V_CREW_DIR = "view://CREW";
  // 「摳的人」次數要看所有案子：TD、已完成、缺人三個 view
  const V_BOOK_VIEWS = ["view://TD", "view://DONE", VIEW_CASES];
  async function readAllRows(view) {
    const rows = []; let cursor = null, g = 0;
    do {
      const r = await mcpRef.callTool(SERVER, TOOL, { data: Object.assign({ mode: "view", view_url: view, page_size: 100 }, cursor ? { start_cursor: cursor } : {}) }, { cache: { staleTime: 600000, gcTime: 86400000 } });
      const p = payloadOf(r);
      rows.push(...(p.results || []));
      cursor = p.has_more ? p.next_cursor : null;
    } while (cursor && g++ < 30);
    return rows;
  }
  async function loadCrewDir() {
    if (crewDirState) return crewDirState;
    crewDirState = (async () => {
      const [dir, ...caseLists] = await Promise.all([readAllRows(V_CREW_DIR)].concat(V_BOOK_VIEWS.map(v => readAllRows(v).catch(() => []))));
      dir.forEach(x => { crewDir[idOf(x.url)] = { id: idOf(x.url), url: x.url, name: unesc(x["姓名"] || "").trim(), lvl: (String(x["活躍程度"] || "").match(/🌕/g) || []).length, area: x["居住地區"] || "", booked: 0 }; });
      const seen = new Set();
      caseLists.flat().forEach(r => {
        const cid = idOf(r.url); if (seen.has(cid)) return; seen.add(cid);
        arr(r["摳的人"]).map(idOf).forEach(id => { if (crewDir[id]) crewDir[id].booked++; });
      });
      render();
    })().catch(e => { crewDirState = null; throw e; });
    return crewDirState;
  }
  let askTimer;
  function saveAsked(i) {
    clearTimeout(askTimer);
    askTimer = setTimeout(async () => {
      const urls = [...asked[i.cid]].map(id => (crewDir[id] || {}).url).filter(Boolean);
      try {
        await mcpRef.callTool(SERVER, "notion-update-page", { page_id: i.cid, command: "update_properties", properties: { "問過的人": urls }, allow_async: false }, { cache: false });
        toast("已記錄");
      } catch (e) { toast("儲存失敗，請稍後再試"); }
    }, 700);
  }
  // ---------- 確認可以：寫進「摳的人」和內文的 Call Time 表格 ----------
  const pageText = {}, tdOverride = {};
  async function fetchPageText(url) {
    const r = await mcpRef.callTool(SERVER, "notion-fetch", { id: url }, { cache: false });
    const p = payloadOf(r);
    let text = typeof p === "string" ? p : (p.text || "");
    if (!text) text = ((r.content || []).find(b => b.type === "text") || {}).text || "";
    return text;
  }
  // 每一站的 Call Time 表格放在各自的頁面（巡演也一樣）
  const tsrcCache = {};
  async function tableSrc(i) { return { url: i.url, cid: i.cid, multi: false }; }
  const stopRows = (rows) => rows;
  async function stopText(i) { return fetchPageText((await tableSrc(i)).url); }
  function tableRows(text, i) {
    const base = i.caseStart || i.start;
    const rows = [];
    for (const m of String(text).matchAll(/<tr[^>]*>[\s\S]*?<\/tr>/g)) {
      const raw = m[0];
      const tds = [...raw.matchAll(/<td[^>]*>([\s\S]*?)<\/td>/g)];
      if (tds.length < 2) continue;
      const label = unesc(tds[0][1].replace(/<[^>]+>/g, "")).trim();
      const labelRaw = tds[0][0];
      const cellRaw = tds[1][0], inner = tds[1][1];
      const plain = unesc(inner.replace(/<[^>]+>/g, " ")).trim();
      const names = splitNames(inner);
      const isX = !names.length && /^[xX×]$|不留|無人/.test(plain);
      let date = null;
      const dm = label.match(/(\d{1,2})\/(\d{1,2})/);
      if (dm && base) { date = new Date(base.getFullYear(), +dm[1] - 1, +dm[2]); if (date - base < -200 * 864e5) date.setFullYear(date.getFullYear() + 1); }
      const dn = label.match(/Day\s*(\d+)/i);
      if (!date && dn && base) date = addDays(base, +dn[1] - 1);
      const type = /裝車/.test(label) ? "load" : /卸車/.test(label) ? "unload" : /拆台/.test(label) ? "strike" : date ? "day" : "other";
      const range = /\d{1,2}\/\d{1,2}[^\d]*[-–~～至][^\d]*\d{1,2}\/\d{1,2}/.test(label);
      const dateLabel = date ? `${date.getMonth() + 1}/${date.getDate()} (${wk(date)})` : "";
      const needLabel = type === "day" && !range && (/^Day\s*\d+$/i.test(label) || /^\d{1,2}\/\d{1,2}$/.test(label));
      const show = needLabel ? dateLabel : label;
      rows.push({ raw, labelRaw, cellRaw, inner, label, show, needLabel, dateLabel, names, plain, isX, date, type, range });
    }
    return rows;
  }
  function defaultRows(rows, i, opt) {
    const inRange = (d, a, b) => d && a && b && d >= new Date(a.getFullYear(), a.getMonth(), a.getDate()) && d <= new Date(b.getFullYear(), b.getMonth(), b.getDate());
    let pick;
    if (i.kind === "裝車") pick = (r) => r.type === "load";
    else if (i.kind === "裝拆") pick = (r) => r.type === "load" || r.type === "unload" || (i.needStrike && r.type === "strike")
      || (r.type === "day" && !r.range && !r.isX && i.needSet && inRange(r.date, i.start, i.setEnd));
    else pick = (r) => !r.range && !r.isX && r.type !== "other";
    return rows.map((r, k) => pick(r) && !(opt === "noLoad" && r.type === "load") ? k : -1).filter(k => k >= 0);
  }
  async function writeConfirm(i, person, rows, picks, text) {
    const ups = [], pk = new Set(picks);
    rows.forEach((r, k) => {
      let nr = r.raw;
      // 「Day 1」或只有日期的列，順便改成「12/7 (一)」
      if (r.needLabel && r.dateLabel) nr = nr.replace(r.labelRaw, r.labelRaw.replace(/Day\s*\d+|\d{1,2}\/\d{1,2}/i, r.dateLabel));
      if (pk.has(k) && !r.names.includes(person.name)) {
        const names = r.names.concat(person.name).join("、");
        nr = nr.replace(r.cellRaw, r.cellRaw.replace(/(<td[^>]*>)[\s\S]*?(<\/td>)$/, `$1\n${names}\n$2`));
      }
      if (nr !== r.raw) ups.push({ old_str: r.raw, new_str: nr });
    });
    const bk = booked[i.cid] || (booked[i.cid] = new Set());
    bk.add(person.id);
    const urls = [...bk].map(id => (crewDir[id] || {}).url || `https://app.notion.com/p/${id}`);
    await mcpRef.callTool(SERVER, "notion-update-page", { page_id: i.cid, command: "update_properties", properties: { "摳的人": urls }, allow_async: false }, { cache: false });
    let warn = "";
    if (ups.length) {
      const res = payloadOf(await mcpRef.callTool(SERVER, "notion-update-page", { page_id: (tsrcCache[i.cid] || i).cid, command: "update_content", content_updates: ups, allow_async: false }, { cache: false }));
      if (res && res.warnings && res.warnings.length) warn = "表格有幾列沒寫進去，請到「☰ 管理」確認排班表";
      let t = text; ups.forEach(u => { t = t.replace(u.old_str, u.new_str); });
      crew[i.url] = parseCrew(t); pageText[i.url] = t;
    }
    return warn;
  }
  async function removeConfirm(i, person, rows, text) {
    const ups = [];
    rows.forEach(r => {
      if (!r.names.includes(person.name)) return;
      const names = r.names.filter(n => n !== person.name).join("、");
      const newCell = r.cellRaw.replace(/(<td[^>]*>)[\s\S]*?(<\/td>)$/, names ? `$1\n${names}\n$2` : "$1$2");
      ups.push({ old_str: r.raw, new_str: r.raw.replace(r.cellRaw, newCell) });
    });
    const bk = booked[i.cid] || (booked[i.cid] = new Set());
    bk.delete(person.id);
    const urls = [...bk].map(id => (crewDir[id] || {}).url || `https://app.notion.com/p/${id}`);
    await mcpRef.callTool(SERVER, "notion-update-page", { page_id: i.cid, command: "update_properties", properties: { "摳的人": urls }, allow_async: false }, { cache: false });
    if (ups.length) {
      await mcpRef.callTool(SERVER, "notion-update-page", { page_id: (tsrcCache[i.cid] || i).cid, command: "update_content", content_updates: ups, allow_async: false }, { cache: false });
      let t = text; ups.forEach(u => { t = t.replace(u.old_str, u.new_str); });
      crew[i.url] = parseCrew(t); pageText[i.url] = t;
    }
  }
  // 小視窗共用外框：標題列（含 ✕）＋ 搜尋 ＋ 可捲動內容
  function sheetFrame(title, withSearch) {
    const sheet = document.getElementById("pSheet");
    sheet.innerHTML = `<div class="sh-in"><div class="sh-top"><b>${esc(title)}</b><button class="shx" aria-label="關閉">✕</button></div>
      ${withSearch ? `<input id="askSearch" placeholder="搜尋姓名" enterkeyhint="done">` : ""}<div class="sh-body"></div></div>`;
    sheet.classList.add("show");
    sheet.onclick = (e) => { if (e.target === sheet) sheet.classList.remove("show"); };
    sheet.querySelector(".shx").onclick = () => sheet.classList.remove("show");
    const s = sheet.querySelector("#askSearch");
    if (s) s.onkeydown = (e) => { if (e.key === "Enter") s.blur(); };
    return sheet;
  }
  async function openConfirm(i, person, back) {
    const sheet = document.getElementById("pSheet");
    const body = sheet.querySelector(".sh-body");
    const srch = sheet.querySelector("#askSearch"); if (srch) srch.style.display = "none";
    const goBack = () => { if (srch) srch.style.display = ""; back(); };
    body.innerHTML = `<div class="note">讀取 ${esc(i.title)} 的 Call Time 表格…</div>`;
    let text, rows;
    try { text = await stopText(i); rows = stopRows(tableRows(text, i), i); }
    catch (e) { body.innerHTML = `<div class="note">讀不到案子內文</div><button class="ghost" id="cfBack">返回</button>`; body.querySelector("#cfBack").onclick = goBack; return; }
    const isBooked = (booked[i.cid] || new Set()).has(person.id) || rows.some(r => r.names.includes(person.name));
    let opt = "all", picks = new Set(defaultRows(rows, i, "all"));
    const draw = () => {
      body.innerHTML = `<div class="cf-h"><b>${esc(person.name)}</b>・確認可以（${esc(i.kind)}）${isBooked ? `<small>已確定</small>` : ""}</div>
        <div class="cf-act"><button class="ghost" id="cfBack">返回</button><button class="primary" id="cfGo">確定寫入</button></div>
        ${isBooked ? `<button class="danger cf-cancel" id="cfCancel">取消確定（從摳的人和表格移除）</button>` : ""}
        <div class="segc cf-opt">${[["all", "皆可"], ["noLoad", "無法裝車"], ["some", "只有某幾天可"]].map(([v, l]) => `<button data-v="${v}" class="${opt === v ? "on" : ""}">${l}</button>`).join("")}</div>
        ${rows.length ? `<div class="clabel">會寫進表格的這幾列${opt === "some" ? "（點一下勾選／取消）" : ""}</div>
        <div class="cf-rows">${rows.map((r, k) => `<button class="cf-row ${picks.has(k) ? "on" : ""} ${r.names.includes(person.name) ? "has" : ""}" data-k="${k}" ${opt === "some" ? "" : "disabled"}>
          <span class="ck"></span><b>${esc(r.show)}</b><small>${r.names.includes(person.name) ? "已在表格裡" : esc(r.names.join("、") || r.plain || "")}</small></button>`).join("")}</div>`
        : `<div class="note">內文沒有找到 Call Time 表格，只會加到「摳的人」。</div>`}`;
      body.querySelectorAll(".cf-opt button").forEach(b => b.onclick = () => {
        opt = b.dataset.v; picks = opt === "some" ? new Set() : new Set(defaultRows(rows, i, opt)); draw();
      });
      body.querySelectorAll(".cf-row").forEach(b => b.onclick = () => { const k = +b.dataset.k; picks.has(k) ? picks.delete(k) : picks.add(k); draw(); });
      body.querySelector("#cfBack").onclick = goBack;
      const fail = (e, btn, label) => { btn.disabled = false; btn.textContent = label; toast(e && e.code === "approval_required" ? "需要你允許這個頁面修改 Notion，再按一次" : "寫入失敗，請稍後再試"); };
      const cc = body.querySelector("#cfCancel");
      if (cc) cc.onclick = async () => {
        if (!cc.dataset.arm) { cc.dataset.arm = 1; cc.textContent = "再按一次確認取消"; return; }
        cc.disabled = true; cc.textContent = "移除中…";
        try { await removeConfirm(i, person, rows, text); toast(`已取消 ${person.name} 的紀錄`); render(); goBack(); }
        catch (e) { fail(e, cc, "取消確定（從摳的人和表格移除）"); }
      };
      body.querySelector("#cfGo").onclick = async () => {
        const go = body.querySelector("#cfGo"); go.disabled = true; go.textContent = "寫入中…";
        try {
          const warn = await writeConfirm(i, person, rows, [...picks].sort((a, b) => a - b), text);
          toast(warn || `已把 ${person.name} 排進去了`);
          render(); goBack();
        } catch (e) { fail(e, go, "確定寫入"); }
      };
    };
    draw();
  }
  const chip = (p, on, small) => `<button class="pchip ask ${on ? "on" : ""}" data-id="${p.id}">${esc(p.name)}${small ? `<small>${small}</small>` : ""}</button>`;
  const crewSort = (a, b) => (b.booked || 0) - (a.booked || 0) || b.lvl - a.lvl || a.name.localeCompare(b.name, "zh-Hant");
  async function openAsk(i) {
    const sheet = sheetFrame(i.title, true);
    const body = sheet.querySelector(".sh-body");
    body.innerHTML = `<div class="note">讀取名單中…</div>`;
    try { await loadCrewDir(); } catch (e) { body.innerHTML = `<div class="note">讀不到「劇場のCrew」名單</div>`; return; }
    const set = asked[i.cid] || (asked[i.cid] = new Set());
    const bk = booked[i.cid] || new Set();
    let q = "";
    const draw = () => {
      const all = Object.values(crewDir).filter(p => p.name);
      const done = all.filter(p => set.has(p.id));
      const rest = all.filter(p => !set.has(p.id) && (!q || p.name.includes(q))).sort(crewSort);
      const sm = (p) => bk.has(p.id) ? "已確定" : "";
      body.innerHTML = `<div class="clabel">已問過（${done.length}）・點一下取消</div><div class="plist">${done.map(p => chip(p, true, sm(p))).join("") || `<span class="note">還沒有</span>`}</div>
         <div class="clabel" style="margin-top:12px">還沒問過・點一下記錄</div><div class="plist">${rest.slice(0, 120).map(p => chip(p, false, sm(p))).join("") || `<span class="note">找不到</span>`}</div>`;
      body.querySelectorAll(".ask").forEach(b => b.onclick = () => {
        const id = b.dataset.id; set.has(id) ? set.delete(id) : set.add(id);
        draw(); saveAsked(i); render();
      });
    };
    sheet.querySelector("#askSearch").oninput = (e) => { q = e.target.value.trim(); draw(); };
    draw();
  }
  function classify(rows, name) {
    const days = rows.filter(r => r.type === "day" && !r.isX && !r.range);
    const on = days.map(r => r.names.includes(name));
    const n = on.filter(Boolean).length;
    const strike = rows.some(r => r.type === "strike" && r.names.includes(name));
    if (days.length && n === days.length) return "全程";
    if (n && strike) return "裝拆";
    if (n) return on[0] || !on[on.length - 1] ? "裝台" : "拆台";
    if (strike) return "拆台";
    return "";
  }
  // 看表格：把 Notion 內文的 Call Time 表格做成「舞台組人員名單」卡片
  async function openTable(i) {
    const o = document.getElementById("shotLayer");
    o.innerHTML = `<div class="shot-in land"><div class="shot-card crewlist"><div class="shot-k">${window.TEAM()}人員名單</div><div class="shot-t">${esc(i.header || i.title)}</div><div class="shot-s">讀取 Notion 表格中…</div></div></div>`;
    o.classList.add("show");
    o.onclick = () => o.classList.remove("show");
    let rows;
    try { pageText[i.url] = await stopText(i); rows = stopRows(tableRows(pageText[i.url], i), i); }
    catch (e) { o.querySelector(".shot-s").textContent = "讀不到案子內文"; return; }
    if (!rows.length) { o.querySelector(".shot-s").textContent = "內文沒有找到 Call Time 表格"; return; }
    const TD = i.td || window.TDN();
    const body = rows.map(r => {
      const names = r.names.filter(n => n !== TD);
      return `<tr><th>${esc(r.show)}</th><td><span class="nm"><mark class="hl">${TD}</mark>${names.length ? "、" : ""}</span>${names.map((n, k) => `<span class="nm">${esc(n)}${k < names.length - 1 ? "、" : ""}</span>`).join("")}</td><td class="n"><b>${names.length + 1}</b>人</td></tr>`;
    }).join("");
    const sd = i.caseStart || i.start;
    const hd = String(i.header || i.title);
    const when = `${sd ? md(sd) : ""}${i.end && sd && i.end > sd ? " – " + md(i.end) : ""}`;
    const place = i.venue && !/待定|讀取中/.test(i.venue) ? i.venue : "";
    o.innerHTML = `<div class="shot-in land"><div class="shot-card crewlist tblv"><div class="shot-k">${window.TEAM()}人員名單</div>
      <div class="shot-t">${esc(hd)}</div>
      <div class="tv-meta">${esc(when)}${place ? `<span class="dot">・</span>${esc(place)}` : ""}<span class="dot">・</span><mark class="hl">${window.ROLE()} ${esc(TD)}</mark></div>
      <div class="tv-plan"><span>人力分配</span><b class="${i.plan ? "" : "tbd"}">${esc(i.plan || "待確認")}</b></div>
      <table class="shot-tb">${body}</table></div></div><div class="shot-hint">點一下關閉</div>`;
    const card = o.querySelector(".shot-card");
    let fs = 26; card.style.fontSize = fs + "px";
    const over = () => { const cr = card.getBoundingClientRect(), pr = parseFloat(getComputedStyle(card).paddingRight) || 0;
        const edge = [...card.querySelectorAll(".shot-tb, .shot-tb td.n")].some(el => el.getBoundingClientRect().right > cr.right - pr + 1);
        return cr.height > window.innerHeight - 24 || card.scrollWidth > card.clientWidth + 1 || edge; };
    while (over() && fs > 7) { fs -= 0.5; card.style.fontSize = fs + "px"; }
      { const tt = card.querySelector(".crewlist .shot-t, .shot-t"); if (tt && card.classList.contains("crewlist")) { let k = card.classList.contains("tblv") ? 1.55 : 1.2; tt.style.fontSize = k + "em"; while (tt.scrollWidth > tt.clientWidth + 1 && k > 0.6) { k -= 0.05; tt.style.fontSize = k + "em"; } } }
    setTimeout(() => { const t = o.querySelector(".shot-hint"); if (t) t.classList.add("gone"); }, 1600);
  }
  async function openBook(i) {
    const sheet = sheetFrame(i.title, true);
    const body = sheet.querySelector(".sh-body");
    body.innerHTML = `<div class="note">讀取名單中…</div>`;
    try { await loadCrewDir(); } catch (e) { body.innerHTML = `<div class="note">讀不到「劇場のCrew」名單</div>`; return; }
    try { pageText[i.url] = await stopText(i); } catch (e) { pageText[i.url] = ""; }
    let q = "";
    const draw = () => {
      const bk = booked[i.cid] || new Set();
      const rows = stopRows(tableRows(pageText[i.url] || "", i), i);
      const all = Object.values(crewDir).filter(p => p.name);
      const yes = all.filter(p => bk.has(p.id));
      const groups = { "全程": [], "裝拆": [], "裝台": [], "拆台": [], "": [] };
      yes.forEach(p => groups[classify(rows, p.name)].push(p));
      const rest = all.filter(p => !bk.has(p.id) && (!q || p.name.includes(q))).sort(crewSort);
      const gHtml = Object.entries(groups).filter(([, a]) => a.length).map(([g, a]) =>
        `<div class="bk-g"><span class="gt g-${g || "na"}">${g || "未排進表格"}</span><div class="plist">${a.map(p => `<button class="pchip ask on g-${g || "na"}" data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div></div>`).join("");
      body.innerHTML = `<div class="tdrow"><span>${window.ROLE()}</span><input id="tdIn" value="${esc(i.td || window.TDN())}" enterkeyhint="done"><button id="tdSave">更換</button></div>
        <div class="clabel">已確定（${yes.length}）・點名字可修改或取消</div>${gHtml || `<div class="note">還沒有</div>`}
        <div class="clabel" style="margin-top:12px">其他人・點名字確認可以</div><div class="plist">${rest.slice(0, 120).map(p => chip(p, false)).join("") || `<span class="note">找不到</span>`}</div>`;
      body.querySelectorAll(".ask").forEach(b => b.onclick = () => openConfirm(i, crewDir[b.dataset.id], draw));
      const tdIn = body.querySelector("#tdIn");
      tdIn.onkeydown = (e) => { if (e.key === "Enter") tdIn.blur(); };
      body.querySelector("#tdSave").onclick = async () => {
        const v = tdIn.value.trim() || window.TDN();
        const btn = body.querySelector("#tdSave"); btn.disabled = true; btn.textContent = "儲存中…";
        try {
          await mcpRef.callTool(SERVER, "notion-update-page", { page_id: i.cid, command: "update_properties", properties: { "TD姓名": v === window.TDN() ? null : v }, allow_async: false }, { cache: false });
          tdOverride[i.cid] = v; i.td = v; items.filter(x => x.cid === i.cid).forEach(x => { x.td = v; });
          toast(`${window.ROLE()} 改成 ${v}`); draw();
        } catch (e) { btn.disabled = false; btn.textContent = "更換"; toast("儲存失敗，請稍後再試"); }
      };
    };
    sheet.querySelector("#askSearch").oninput = (e) => { q = e.target.value.trim(); draw(); };
    draw();
  }

  // ---------- copy ----------
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1600);
  }
  async function copyText(text, okMsg) {
    try { await navigator.clipboard.writeText(text); toast(okMsg); return; } catch (e) {}
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy"); ta.remove();
      if (ok) { toast(okMsg); return; }
    } catch (e) {}
    $("fallbackText").value = text; $("modal").classList.add("show");
  }

  $("copy").addEventListener("click", () => {
    const chosen = items.filter(i => selected.has(i.key));
    if (!chosen.length) return;
    copyText(chosen.map(i => i.text).join("\n\n──────────\n\n"), `已複製 ${chosen.length} 則`);
  });
  $("all").addEventListener("click", () => {
    const shown = items.filter(i => filter === "all" || i.kind === filter);
    const allOn = shown.every(i => selected.has(i.key));
    shown.forEach(i => allOn ? selected.delete(i.key) : selected.add(i.key));
    render();
  });
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); filter = b.dataset.f; render();
  }));
  $("clear").addEventListener("click", () => { selected.clear(); render(); });
  $("closeModal").addEventListener("click", () => $("modal").classList.remove("show"));

  // ---------- data ----------
  function errorHtml(err, retryable) {
    const code = err && err.code;
    let msg;
    switch (code) {
      case "needs_reauth": msg = "Notion 金鑰失效了，請按上方的 ⚙︎ 重新貼上金鑰。"; break;
      case "server_not_connected": msg = "還沒設定好，請按上方的 ⚙︎ 設定。"; break;
      case "selection_required": msg = "你有不只一個 Notion 連線，請在跳出的視窗選擇要用哪一個。"; break;
      case "approval_required": msg = `需要你允許這個頁面讀取 Notion。<br><button class="ghost" id="approve" style="margin-top:10px">允許並讀取</button>`; break;
      case "not_in_manifest": msg = "這個頁面目前沒有讀取 Notion 的權限（可能被關掉了）。"; break;
      case "blocked_by_policy": msg = "組織的設定不允許這個頁面使用 Notion。"; break;
      case "google_login": msg = "Google 登入過期了，請按上方的 ⚙︎ 重新登入 Google。"; break;
      case "not_configured": case "not_granted": case "capability_disabled": case "capability_removed":
        msg = "還沒設定好，請按上方的 ⚙︎ 設定。"; break;
      case "server_unavailable": msg = "資料暫時讀不到，稍後按「重新整理」再試一次。"; break;
      case "tool_error": msg = /allowance/i.test(err.message || "") ? "這個小時的查詢次數用完了，約一小時內會恢復，之後按「重新整理」。" : "讀取資料出錯：" + (err.message || "").slice(0, 160); break;
      default: msg = "讀取資料時出了問題，按「重新整理」再試一次。";
    }
    return `<div class="state" style="margin-bottom:10px">${msg}</div>`;
  }
  const DENIALS = ["needs_reauth", "server_not_connected", "blocked_by_policy", "approval_required", "not_in_manifest"];

  function payloadOf(result) {
    let p = result && result.payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) {} }
    return p || {};
  }
  // First page arrives via watch; follow next_cursor for the rest.
  async function withRest(result, view) {
    let rows = rowsOf(result);
    let p = payloadOf(result), guard = 0;
    while (p.has_more && p.next_cursor && mcpRef && guard++ < 20) {
      const r = await mcpRef.callTool(SERVER, TOOL, viewInput(view, p.next_cursor),
        { cache: { staleTime: 300000, gcTime: 86400000 } });
      rows = rows.concat(rowsOf(r)); p = payloadOf(r);
    }
    return rows;
  }
  async function onCases(ev) {
    if (ev.type === "data") {
      try { cases = await withRest(ev.result, VIEW_CASES); errorState = null; setFresh(ev.result); }
      catch (e) { errorState = errorHtml(e && e.code ? e : { code: "tool_error", message: "資料格式看不懂" }); }
    } else {
      if (DENIALS.includes(ev.error.code)) { cases = null; selected.clear(); }
      errorState = errorHtml(ev.error);
    }
    render(); wireApprove();
  }
  async function onVenues(ev) {
    if (ev.type === "data") { try { venues = await withRest(ev.result, VIEW_VENUES); } catch (e) { venues = venues || []; } }
    render(); wireApprove();
  }
  async function onTroupes(ev) {
    if (ev.type === "data") { try { troupes = await withRest(ev.result, VIEW_TROUPES); } catch (e) { troupes = troupes || []; } }
    render(); wireApprove();
  }
  async function fetchAll(m, opts) {
    const [c, v, t] = await Promise.all([
      m.callTool(SERVER, TOOL, CASES_INPUT, opts),
      m.callTool(SERVER, TOOL, VENUES_INPUT, opts),
      m.callTool(SERVER, TOOL, TROUPES_INPUT, opts)
    ]);
    onVenues({ type: "data", result: v }); onTroupes({ type: "data", result: t }); onCases({ type: "data", result: c });
  }
  function wireApprove() {
    const b = document.getElementById("approve");
    if (!b || b._wired) return; b._wired = true;
    b.addEventListener("click", async () => {
      try { await fetchAll(mcpRef); }
      catch (e) { errorState = errorHtml(e); render(); wireApprove(); }
    });
  }

  let mcpRef = null;
  async function boot() {
    if (!window.claude || !window.claude.use) {
      errorState = errorHtml({ code: "not_granted" }); render(); return;
    }
    const mcp = await window.claude.use("mcp");
    if (!mcp) { errorState = errorHtml({ code: "not_granted" }); render(); return; }
    mcpRef = mcp;
    const opts = { cache: { staleTime: 300000, gcTime: 86400000 } };
    mcp.watchTool(SERVER, TOOL, VENUES_INPUT, onVenues, opts);
    mcp.watchTool(SERVER, TOOL, TROUPES_INPUT, onTroupes, opts);
    mcp.watchTool(SERVER, TOOL, CASES_INPUT, onCases, opts);
    $("refresh").addEventListener("click", async () => {
      $("fresh").textContent = "重新讀取中…";
      Object.keys(crew).forEach(k => delete crew[k]);
      try { await mcp.invalidate(SERVER, "notion-fetch"); } catch (e) {}
      try { await mcp.invalidate(SERVER, TOOL); }
      catch (e) {
        try { await fetchAll(mcp, { cache: { refresh: true, staleTime: 60000, gcTime: 86400000 } }); }
        catch (e2) { errorState = errorHtml(e2); render(); wireApprove(); }
      }
    });
  }
  boot();
})();
</script>
<script>
(() => {
  // ===================== config =====================
  const SERVER = "Notion";
  const Q = "notion-query-data-sources";
  const V_TD = "view://TD";      // 劇場の案子 → TD

  let TD_NAME = DEFAULT_TD;   // 每個案子可在「TD姓名」指定，空白就是你
  const STAGES = ["裝車", "交通", "進場", "拆台", "卸車"];
  // 用餐休息 0–29 分＝未休滿半小時 +0.5 段；30–59 分＝未休滿一小時 +0.25 段；休滿 → 0
  const MEAL_OPTS = [[0, "休滿"], [0.25, "未休滿一小時"], [0.5, "未休滿半小時"]];

  function crewRows(c, rec, tmap) {

  // ===================== timesheet =====================
  const dws = (d) => `${md(d)} (${wk(d)})`;
  function buildSheet(c, rec, tmap) {
    LATE = rec.late;
    const ds = rec.days;
    // 沒有人上班的進場日（例如「不留技術」的那週）不放進時段表
    const used = (d) => !!(d.tin || d.tout) || attendees(d, tmap).length > 0;
    const ws = weeksOf(c, rec).map(w => Object.assign({}, w, { days: w.days.filter(used) })).filter(w => w.days.length);
    // 最後一週只剩一天（拆台日）時，當作「拆台」欄，不另成一週
    const strikeDays = ds.filter(d => d.stage === "拆台");
    if (ws.length > 1 && ws[ws.length - 1].days.length === 1 && !strikeDays.length) strikeDays.push(ws.pop().days[0]);
    const allCols = [];
    const push = (d, group, gkey, glabel) => allCols.push({ d, group, gkey, glabel });
    ds.filter(d => d.stage === "裝車").forEach(d => push(d, "裝車", "裝車", "裝車"));
    ds.filter(d => d.stage === "交通").forEach(d => push(d, "交通", "交通", "交通\n時段"));
    ws.forEach(w => {
      const lab = (ws.length > 1 ? `進場 Week ${w.n}` : "進場") + (w.venue ? `（${w.venue}）` : "");
      w.days.forEach(d => push(d, "進場", "進場" + w.n, lab));
    });
    strikeDays.forEach(d => push(d, "拆台", "拆台", "拆台"));
    ds.filter(d => d.stage === "卸車").forEach(d => push(d, "卸車", "卸車", "卸車"));
    const groups = [];
    allCols.forEach((col, k) => {
      const g = groups[groups.length - 1];
      if (g && g.gkey === col.gkey) g.n++; else groups.push({ gkey: col.gkey, glabel: col.glabel, group: col.group, start: k, n: 1, week: col.group === "進場" ? +col.gkey.slice(2) : 0 });
    });
    const cellOf = (x) => {
      if (x && x.slot) return { text: [SLOTS[x.slot]].concat(x.note || []).join("\n"), seg: x.seg === null ? "" : x.seg, raw: x };
      if (!x || (!x.tin && !x.tout)) return { text: "", seg: "" };
      const ls = x.adj === null || x.adj === undefined ? lateSeg(x.tin, x.tout) : 0;
      const lines = [x.tin || "?", x.tout || "?", mealText("午", x.lunch, true), mealText("晚", x.dinner, true), ls ? "超過2200" : ""].concat(x.note).filter(Boolean);
      return { text: lines.join("\n"), seg: x.seg === null ? "" : x.seg, raw: x };
    };
    const at = (name) => (d) => attendees(d, tmap).includes(name);
    const roleText = (name) => {
      if (name === TD_NAME) return window.ROLE();
      const parts = [];
      // 職位看 Call Time 排班（缺席不影響「全程」的判斷）
      const on = (d) => (tmap.get(d) || new Set()).has(name) || d.people.some(p => p.name === name && !p.absent);
      const kind = (days) => {
        const n = days.filter(on).length, f = on(days[0]), l = on(days[days.length - 1]);
        return !n ? "" : n === days.length ? "全程" : f && l ? "裝拆" : f ? "裝台" : l ? "拆台" : `${n}天`;
      };
      const k = ws.map(w => kind(w.days));
      if (!(k.length && k.every(x => x === "全程")) && ds.some(d => d.stage === "裝車" && on(d))) parts.push("裝車");
      if (ws.length > 1) k.forEach((x, i) => { if (x) parts.push(`W${ws[i].n}${x}`); });
      else if (k[0]) parts.push(k[0]);
      const whole = k.length && k.every(x => x === "全程");
      if (!whole && strikeDays.some(on)) parts.push("拆台");
      if (!whole && ds.some(d => d.stage === "卸車" && on(d))) parts.push("卸車");
      return (parts.length ? parts.join(" / ") + "\n" : "") + "Crew";
    };
    const person = (name, role) => {
      let total = 0;
      const cells = allCols.map(col => {
        const x = role === "TD" ? { slot: col.d.slot, tin: col.d.tin, tout: col.d.tout, lunch: col.d.lunch, dinner: col.d.dinner, adj: col.d.adj, note: col.d.note ? [col.d.note] : [], seg: tdSeg(col.d) }
          : (attendees(col.d, tmap).includes(name) ? personDay(col.d, name) : null);
        const cc = cellOf(x); if (typeof cc.seg === "number") total += cc.seg; return cc;
      });
      const prepSeg = role === "TD" ? (c.prepSeg || 0) : 0;
      total += prepSeg;
      const rate = role === "TD" ? c.tdRate : (rec.rates[name] || c.crewRate || null);
      const flat = role === "TD" && c.tdFlat ? c.tdFlat : null;
      return { name, role, roleText: roleText(name), rate, flat, prep: role === "TD" ? c.prep : "", prepSeg: prepSeg || "", cells, total, pay: flat !== null ? flat : rate ? total * rate : null };
    };
    const people = [person(TD_NAME, "TD")].concat(crewOrder(c, rec, tmap).map(n => person(n, "Crew")));
    return { title: `${showName(c)}舞台技術人員時段統計表`, short: showName(c), allCols, groups, weeks: ws, people, late: rec.late };
  }
  // ---------- 巡演：把同一個「巡演」的各站合成一張時段表 ----------
  const tourStops = (c) => c.tour ? cases.filter(x => x.tour === c.tour).sort((a, b) => a.start - b.start) : [c];
  function giveSheet(c, rec, tmap) {

    }
